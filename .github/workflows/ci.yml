# 三平台 Python 工具和离线合同；无游戏 runner 不证明游戏行为。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装 Ruff
        run: python -m pip install "ruff>=0.16"
      - name: ruff —— 代码检查
        run: python -m ruff check .
      - name: ruff —— 格式检查
        run: python -m ruff format --check .

  check:
    runs-on: ${{ matrix.os }}
    env:
      SITAI_XDIST_WORKERS: "2"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装（含 dev 依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pip check — 平台依赖闭包可解析
        run: python -m pip check

      - name: UTF-8 无 BOM + LF —— 全部提交文本
        run: python tools/ci/run_check.py encoding

      - name: mypy —— 类型检查
        run: mypy

      - name: 创建测试产物目录
        run: python -c "from pathlib import Path; Path('tools/out/ci').mkdir(parents=True, exist_ok=True)"

      - name: pytest —— 不依赖游戏的用例
        run: >-
          python -m pytest -m "not integration and not benchmark"
          --junitxml=tools/out/ci/test-results.xml

      - name: 测试跳过项 —— 分类并拒绝未知原因
        run: >-
          python tools/ci/test_summary.py tools/out/ci/test-results.xml
          --output tools/out/ci/test-summary.json

      - name: 测试摘要归档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-${{ matrix.os }}-py${{ matrix.python-version }}
          path: tools/out/ci/

      - name: v3 verify —— 用入库快照核验一部分断言
        run: v3 verify --from-snapshot

      - name: v3 tables --offline —— 用入库快照核验生成表
        run: v3 tables --offline

      - name: v3 modgen --check —— 产物与数据源逐字节一致
        run: v3 modgen --check

      - name: v3 modguard --offline —— 锁定快照的生产接口门禁
        run: v3 modguard --offline

      - name: v3 ai-surface --check --offline —— 可执行面（同一份快照）
        run: v3 ai-surface --check --offline

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装（含 dev 依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest-benchmark —— 不需要游戏的基准
        run: |
          python -m pytest tests/test_benchmarks.py \
            -o addopts="" --benchmark-only --benchmark-json=bench.json -q

      - name: 把基准数字写进 job summary
        run: python tools/ci/bench_summary.py bench.json >> "$GITHUB_STEP_SUMMARY"

      - name: Python 时间与分配峰值（输出指纹随报告保存）
        run: python -m pdx.performance --output performance.json

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: |
            bench.json
            performance.json

  lock:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 按 requirements.lock 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: v3 lock —— 装出来的环境与锁逐条一致
        run: v3 lock

      - name: pytest —— 在锁定的环境里跑不依赖游戏的用例
        run: python -m pytest -m "not integration and not benchmark"
