# 提交前自动跑静态检查。
#
# 为什么用 `repo: local` + `language: system` 而不是社区的 ruff/mypy 镜像：
# 本项目的 ruff 与 mypy 版本由 pyproject.toml 的 `dev` extra 钉住，
# 再让 pre-commit 去拉一份自己的副本会出现「pre-commit 过了、手动跑却失败」
# 的分歧。这里直接调用 .venv 里已装好的那两个，与手动执行**完全同一份二进制**。
# 附带好处：不需要联网拉 hook 仓库。
#
# 启用：`.venv\Scripts\pre-commit.exe install`
# 手动全跑：`.venv\Scripts\pre-commit.exe run --all-files`
#
# 测试套件**不**放进来 —— 全量跑一次要 5 分钟，那是 CI / 提交前手动做的事，
# 不是每次 commit 都该付的成本。
#
# ⚠️ 下面的 entry 写的是 Windows 下的 `.venv/Scripts/`，因此这套 hook 只在
# Windows 本地可用；跨平台的同一套检查由 `.github/workflows/ci.yml` 承担。
#
# 与 CI 的对应关系（**别让两边漂开**）
# ----------------------------------
#   ruff check        ↔ ci.yml 的「ruff —— 代码检查」
#   ruff format       ↔ ci.yml 的「ruff —— 格式检查」
#   mypy              ↔ ci.yml 的「mypy —— 类型检查」
#   v3 verify --from-snapshot ↔ ci.yml 的同名步骤（本文件第 4 个 hook）
#   pytest            ← 有意不放（耗时）
#
# 最后一条是这轮补上的：它**离线可跑**（只读入库的精简快照与文档，不读游戏），
# 却是最容易在提交时漏掉的一环 —— 改了文档里的数字或断言注册表而没重跑，
# 本地全绿、CI 直接红。放进 hook 后提交前就会拦下。

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff（代码检查）
        entry: .venv/Scripts/ruff.exe check --force-exclude
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff（格式化）
        entry: .venv/Scripts/ruff.exe format --force-exclude
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy（类型检查）
        # mypy 的配置全在 pyproject.toml 的 [tool.mypy] 里，这里不传路径，
        # 让它按配置自己决定检查范围（传了路径反而会覆盖 files/exclude）。
        entry: .venv/Scripts/mypy.exe
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: v3-verify-offline
        name: v3 verify（用入库快照核验，不读游戏）
        # pass_filenames: false —— 这条检查的是**整个仓库**的一致性，
        # 与本次改了哪几个文件无关（改文档、改断言注册表、改快照都算）。
        entry: .venv/Scripts/v3.exe verify --from-snapshot
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
