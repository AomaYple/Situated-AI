# 本地 hook 复用 run_check.py 选择的项目运行时，与手动检查及 CI 共用配置。
# 启用：python -m pre_commit install；全量：python -m pre_commit run --all-files。
# 完整测试按 CONTRIBUTING.md 单独执行，不加入每次提交的静态 hook。

repos:
  - repo: local
    hooks:
      - id: source-encoding
        name: UTF-8 无 BOM + LF（含未跟踪新文件）
        entry: python tools/ci/run_check.py encoding
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: ruff-check
        name: ruff（代码检查）
        entry: python tools/ci/run_check.py lint
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff（格式化）
        entry: python tools/ci/run_check.py format
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy（类型检查）
        # mypy 的配置全在 pyproject.toml 的 [tool.mypy] 里，这里不传路径，
        # 让它按配置自己决定检查范围（传了路径反而会覆盖 files/exclude）。
        entry: python tools/ci/run_check.py types
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: v3-verify-offline
        name: v3 verify（用入库快照核验，不读游戏）
        # pass_filenames: false —— 这条检查的是**整个仓库**的一致性，
        # 与本次改了哪几个文件无关（改文档、改断言注册表、改快照都算）。
        entry: python tools/ci/run_check.py offline
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
