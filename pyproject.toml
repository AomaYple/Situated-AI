[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────
# Victoria 3 mod 开发研究工具链
#
# 本文件集中维护 Python 工程配置：
#   项目元数据 / 依赖 / 打包 / pytest / ruff / mypy / coverage
# Git、编辑器、提交钩子与 CI 保留各自的专用配置；具体流程见 CONTRIBUTING.md。
#
# 安装（完整仓库的可编辑开发环境）：
#     .venv\Scripts\python.exe -m pip install -e ".[dev]"
# ─────────────────────────────────────────────────────────────

[project]
name = "situated-ai-v3tools"
version = "0.3.0"
description = "Victoria 3 mod 开发研究工具链：PDX 脚本全量分析与信息提取"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AomaYple", email = "2890599214@qq.com" }]
keywords = ["victoria3", "paradox", "modding", "pdx", "clausewitz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 运行期依赖：只保留「标准库确实没有对应能力」的，每条写明用途。
dependencies = [
    "filelock>=3.19",         # 所有实机实验共享跨平台进程互斥锁
    "packaging>=26.0", # PEP 508 条件依赖使用成熟解析器，不自行实现表达式求值。
    "psutil>=7.0",    # 三平台进程树 RSS / CPU / 内存测量；仪器读数不再绑 Win32。
    "typer>=0.27",      # 统一 CLI 的命令与参数解析
    "rich>=15.0",       # 终端表格与格式化输出。取代手写字符串对齐

    # ── 游戏自动化 ─────────────────────────────────────────
    # 图像处理由 pdx.game_auto 在运行时直接使用，因此属于运行期依赖。
    # GUI 输入与窗口后端当前只支持 Windows；其他平台的能力边界见工程基线。
    "Pillow>=11.0",     # game_auto.py：PNG 编解码 + 截图对象（模板匹配的输入/输出）
    "numpy>=2.1",       # game_auto.py：把截图与模板当成像素数组（PIL↔cv2 的桥）
    "opencv-python-headless>=4.10",
                        # game_auto.py：`cv2.matchTemplate` 做归一化互相关。
                        # 选 **headless** 而不是 `opencv-python`：我们只用匹配，
                        # 不用 `imshow`/`waitKey`，而 headless 轮子不带 GUI 依赖
                        # （少一层 GTK/Qt 的隐式依赖，也不会和游戏的窗口抢东西）。
                        # 模板匹配复用成熟实现，遵循 docs/principles/工程原则.md。
    "pydirectinput>=1.0.4; sys_platform == 'win32'",
                        # 扫描码键盘与鼠标输入；前台校验、授权和失败恢复由 game_auto 统一管理。
                        # 速度、暂停与控制台操作分别使用 tick、画面、回话或产物验收。
                        # 输入库返回成功不证明游戏已接受动作；实测见工具手册及其证据链接。
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
                        # 窗口枚举、标题、激活、最小化与还原，复用已有窗口库。
    "pywin32>=306; sys_platform == 'win32'",
                        # 补充客户区坐标、窗口状态、前台恢复与游戏线程键盘布局管理。
                        # 使用成熟 Win32 绑定，避免自写 ctypes 结构体和函数声明。
]

[project.optional-dependencies]
# 测试与静态检查。一次装齐，避免后续「这个库没装」的反复。
dev = [
    "types-psutil>=7.0",       # 跨平台性能测量库的类型桩
    # ── 测试框架与插件 ────────────────────────────────────
    "pytest>=9.0",
    "pytest-cov>=7.0",          # 覆盖率
    "pytest-benchmark>=5.3",    # 性能基准与回归门禁
    "pytest-timeout>=2.4",      # 卡死的测试必须失败而非永久挂住
    "pytest-randomly>=5.0",     # 随机化执行顺序，暴露用例间隐式依赖
    "pytest-regressions>=2.11", # 黄金回归（冻结产物指纹）
    "pytest-subtests>=0.15",    # 一个用例内的多组子断言
    "pytest-xdist>=3.8",        # 并行执行
    "hypothesis>=6.168",        # 属性测试与模糊测试

    # ── 性能剖析 ──────────────────────────────────────────
    "pyinstrument>=5.1",        # 采样式剖析器，输出调用树

    # ── 静态检查 ──────────────────────────────────────────
    "ruff>=0.16",               # 代码检查 + 格式化（取代 flake8/isort/black）
    "mypy>=1.14",               # 类型检查

    # ── 开发流程 ──────────────────────────────────────────
    "pre-commit>=4.0",          # 提交前自动跑 ruff/mypy
    "mutmut>=3.8",              # 变异测试（按需手动跑，配置见 [tool.mutmut]）
]

[project.scripts]
# 统一 CLI 入口；修改入口定义后重新进行可编辑安装以更新环境内的启动脚本。
# 完成可编辑安装后，也可用对应解释器的 `python -m pdx.cli` 调用。
v3 = "pdx.cli:app"

[tool.setuptools]
# Python 包源码位于 src/pdx；tools/ 放检查入口、基准、实机探针与证据输出。
# 使用标准 src 布局，避免仓库根目录的工具脚本被误当成可导入包。
package-dir = { "" = "src" }
packages = ["pdx"]

# ─────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--timeout=300",
    "--timeout-method=thread",
    # ── 并行（pytest-xdist）────────────────────────────────
    # pytest 默认**串行**；装上 xdist 只是提供能力，必须显式传 -n 才并行。
    #
    # ``loadscope`` 按模块或测试类分组，便于复用同一 worker 内的重型 fixture。
    # session fixture 和进程内解析缓存不会跨 worker 共享。
    # 完整测试的调度、速度与峰值内存复核见：
    # docs/audits/2026-10-11-工程提速.md；后续读数按日期和输入追加到结果记录。
    # 测试集合、覆盖率、worker 数和缓存状态不同的运行不能直接计算整体提速。
    #
    # ``-n auto`` 由 tests/conftest.py 的 hook 综合 CPU 与内存预算：
    # 默认给系统留 2048 MiB、按每 worker 1536 MiB 计算上限，存在或缺少游戏树
    # 都应用护栏。``SITAI_XDIST_WORKERS`` 或 xdist 官方环境变量可显式覆盖。
    # 需要串行（例如要读完整的失败上下文）时传 ``-n0`` 覆盖。
    #
    # 基准串行运行并清除普通 addopts；并发时 pytest-benchmark 会禁用计时。
    # 用例通过不能替代有效的基准表和采样结果。命令示例：
    #     python -m pytest tests/test_benchmarks.py -o addopts="" --benchmark-only
    # 历史判据与实测更正见 docs/reports/t34-CI-环境红灯-与-n0-口径更正.md。
    "-n",
    "auto",
    "--dist",
    "loadscope",
]
# 不固定 --basetemp；测试使用 pytest 的独立临时目录或系统保证唯一的目录。
# worker 之间不能用进程内计数器拼接共享目录名，避免并行写入冲突。

markers = [
    "unit: 单元测试，不依赖游戏安装",
    "integration: 集成测试，需要真实游戏目录（无游戏时自动跳过）",
    "property: 属性测试与变形测试（hypothesis）",
    "regression: 回归测试，比对固化的指纹",
    "contract: 契约测试，校验输出结构不被破坏",
    "docs: 文档一致性测试，校验文档里的数字与实际提取结果一致",
    "cli: 命令行端到端测试（subprocess 真跑）",
    "slow: 耗时较长（超过数秒）",
    "benchmark: 性能基准",
]

[tool.coverage.run]
# 口径：只统计**装进包里**的代码（pdx），不含 tools/prof 与 tests。
source = ["pdx"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
# 覆盖率门禁 —— 防止回退，不是拿来好看的。
#
# 口径说明：这里开的是**分支覆盖率**（``branch = true``），与「语句覆盖率」
# 不可直接比较。数字变低不代表测试变差，而是分母里多了
# 「只走了一个方向的分支」。
#
# 整体下限由 fail_under 定义，核心模块下限由 pdx.covgate.FLOORS 定义。
# 实测百分比、未覆盖分支与命令以对应运行的 coverage JSON 和日期化记录为准。
# 2026-10-11 完整回归及其限制见 docs/audits/2026-10-11-工程提速.md。
# 配置只维护门禁，不另存容易漂移的“当前覆盖率”或模块实测列表。
fail_under = 86
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "tools/out/coverage"

# ─────────────────────────────────────────────────────────────
# ruff —— 代码检查与格式化
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    # 排除产物与历史资料目录中可能出现的 Python 文件。
    # docstring-code-format 处理 Python 文档字符串内的代码示例，不处理独立 .md 文件。
    "tools/out",          # 产物目录，将来若落脚本也不该被 lint
    "docs/reports",      # 历史报告与独立复核
    # research/official-docs/ 是游戏官方文档的逐字镜像，不是我们的代码；
    # research/ 根下若出现自有产物则仍需检查，故不整目录排除。
    "research/official-docs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告
    "F",    # pyflakes
    "I",    # isort：导入排序
    "N",    # pep8-naming
    "UP",   # pyupgrade：用新语法替换旧写法
    "B",    # flake8-bugbear：常见陷阱
    "A",    # flake8-builtins：遮蔽内置名
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate：注释掉的代码
    "PL",   # pylint
    "RUF",  # ruff 自有规则
    # PERF 检查低效写法；FURB 提供现代 Python 写法建议。
    "PERF", # perflint
    "FURB", # refurb
]
ignore = [
    "PLR0913",  # 参数过多：dataclass 与 CLI 函数情有可原
    "PLR0917",  # 位置参数过多：同 PLR0913 —— typer 命令的每个形参就是一个
                # 命令行选项，拆成 dataclass 反而让 --help 失去参数说明
    "PLR2004",  # 魔法数字：本项目的「魔法数字」都是游戏实测值，有注释
    "PLR0912",  # 分支过多
    "PLR0915",  # 语句过多
    "PLR0911",  # return 过多
    "E501",     # 行长由 formatter 负责
    "SIM108",   # 三元表达式并非总是更清晰

    # ── 中文技术写作的必然豁免 ────────────────────────────
    # 本项目所有文档、注释、报错信息都是中文，必然出现全角标点
    # （）：「」、【】、—— 等。这三条规则把它们判为「易混淆的 Unicode
    # 字符」，在英文代码库里是对的，在中文代码库里是纯噪声：
    # 保留中文解释所需的标点；实际字符混用仍需人工审查。
    "RUF001",   # 字符串里的易混淆 Unicode 字符
    "RUF002",   # 文档字符串里的易混淆 Unicode 字符
    "RUF003",   # 注释里的易混淆 Unicode 字符
]

[tool.ruff.lint.per-file-ignores]
# 测试文件的刻意选择：
#   PT009  保留既有 unittest 风格的 self.assertXxx；迁移时按断言语义单独验证
#   PLC2401/N802/N803 中文测试函数名与 fixture 形参名（test_镜像逐字节一致(镜像文件)）
#          比拼音可读得多，失败时 pytest 直接把中文名打出来，定位比英文名更快
#   RUF012 测试里的类属性是 fixture 风格的常量，加 ClassVar 只是噪声
#   ARG001/ARG002 pytest fixture 的形参由框架注入，必然「未使用」
#   N806   fixture 里用 GAME/CONFIG 这类大写局部名指代常量，是有意为之
#   S101   断言就是测试的正文；bandit 的 S 规则集并未启用，此项为前瞻
#   PT011  pytest.raises 不带 match= 是有意的：这里只关心「抛了没抛」
#   PLC0415 少量用例在函数体内 import（如 subprocess 起 CLI），便于局部化
"tests/*" = [
    "PT009", "PLC2401", "N802", "N803", "RUF012",
    "ARG001", "ARG002", "N806",
    "S101", "PT011", "PLC0415",
]
# 已全局忽略的规则不在按文件豁免中重复登记。

[tool.ruff.lint.isort]
known-first-party = ["pdx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ─────────────────────────────────────────────────────────────
# mutmut —— 变异测试（**不进 pytest**，按需手动跑）
#
# 为什么单独一个工具：变异测试要「改一处源码 → 跑一遍测试 → 看有没有红」，
# 一轮下来是几十次全套测试。放进 CI 等于每次提交都跑几十分钟，
# 放进 pytest 更是自相矛盾（测试里再跑测试）。它的用法是**定期体检**：
#
#     .venv\Scripts\python.exe -m mutmut run     # 跑一遍，看存活率
#     .venv\Scripts\python.exe -m mutmut results # 存活下来的变异体
#
# 先只挑**纯函数、无游戏依赖**的两个模块：变异测试的价值在于
# 「测试能不能发现语义改变」，而依赖真实游戏数据的模块会让每次变异都
# 因为环境差异而失败（那种红不代表测试强）。
# ─────────────────────────────────────────────────────────────
[tool.mutmut]
paths_to_mutate = ["src/pdx/lexer.py", "src/pdx/markers.py"]
tests_dir = "tests"
runner = "python -m pytest -x -q -p no:randomly --no-header -m 'not integration and not benchmark'"

# ─────────────────────────────────────────────────────────────
# mypy —— 类型检查
# ─────────────────────────────────────────────────────────────
[tool.mypy]
# ⚠️ 3.12 而不是 3.11（`requires-python = ">=3.11"`）—— 这是被**桩文件**逼出来的一步，
# 起因与代价都写清楚，免得后人以为是随手抬的：
#
# 起因：`pdx.game_auto` 直接 import numpy（截图/模板是像素数组）与 cv2（模板匹配）。
# numpy 2.5 的 `__init__.pyi` 用了 PEP 695 的 `type X = …` 语句（第 737 行起），
# 那要求 `python_version >= 3.12`；钉在 3.11 时 mypy 会**在解析桩文件时就语法报错**
# 并直接中止整个检查：`errors prevented further checking`。也就是"不检查"，
# 比"按 3.12 检查"更糟。
#
# 试过但**不管用**的两条（都实测过，别再试）：
#   * `[[tool.mypy.overrides]] follow_imports = "skip"` —— 2.3.1 在 skip 模式下
#     照样解析桩文件，照样中止；加 `--ignore-missing-imports` 也无用。
#   * 逐模块 `python_version` —— mypy 直接拒绝：
#     `Per-module sections should only specify per-module flags (python_version)`。
#
# 代价：mypy 不再替我们拦「3.12 才有的语法」。
# 兜底不靠它：`requires-python = ">=3.11"` 与 classifiers 里的 3.11 由
# **CI 跑真实解释器**兜底（3.11 上 import 就会炸），ruff 的
# `target-version = "py311"` 也仍然只按 3.11 给建议。
# 检查范围由下面的 files 定义；实际文件数和结果记录在对应验证输出中。
python_version = "3.12"
# 覆盖范围：解析器包 + 测试。
# **不含 `tools/prof/`** —— 那是一次性的剖析脚本，只在本地手跑、不进 CI；
# 但它仍受 ruff 约束（ruff 扫全仓），不是完全无人看管。
files = ["src/pdx", "tests"]
# 渐进式收紧：先保证「不出现新错误」，再逐步加严。
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = false   # 目标：逐步收紧到 true
disallow_incomplete_defs = false
show_error_codes = true
pretty = true


# 没有类型标注、也没有 `py.typed` 的第三方库 —— 明确列出来，别用全局
# `ignore_missing_imports` 把"我们自己写错导入名"也一起放过。
[[tool.mypy.overrides]]
module = ["pydirectinput", "pygetwindow", "win32api", "win32con", "win32gui", "win32process"]
ignore_missing_imports = true
