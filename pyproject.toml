[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────
# Victoria 3 mod 开发研究工具链
#
# 本文件是**唯一**的工程配置源：
#   项目元数据 / 依赖 / 打包 / pytest / ruff / mypy / coverage
# 不再需要 pytest.ini、requirements.txt、setup.py、setup.cfg。
#
# 安装（开发模式，之后所有 sys.path 补丁都可以删掉）：
#     .venv\Scripts\python.exe -m pip install -e ".[dev]"
# ─────────────────────────────────────────────────────────────

[project]
name = "situated-ai-v3tools"
version = "0.3.0"
description = "Victoria 3 mod 开发研究工具链：PDX 脚本全量分析与信息提取"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AomaYple", email = "2890599214@qq.com" }]
keywords = ["victoria3", "paradox", "modding", "pdx", "clausewitz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 运行期依赖：只保留「标准库确实没有对应能力」的，每条写明用途。
dependencies = [
    "typer>=0.27",      # 命令行参数解析。取代 7 个入口脚本里重复的 argparse 样板
    "rich>=15.0",       # 终端表格与格式化输出。取代手写字符串对齐

    # ── 游戏自动化（`v3` 之外的第三个能力面：把游戏真的跑起来）──────
    # 为什么这三个是运行期依赖、而不是 dev：它们被 `pdx.game_auto` **直接 import**，
    # 也就是"自动化测试 Victoria 3"这条能力本身的实现，不是测试期工具。
    # 增量很小：本机实测 Pillow 7.2 MB + numpy 12.7 MB + opencv 43.8 MB（headless 轮子）。
    "Pillow>=11.0",     # game_auto.py：PNG 编解码 + 截图对象（模板匹配的输入/输出）
    "numpy>=2.1",       # game_auto.py：把截图与模板当成像素数组（PIL↔cv2 的桥）
    "opencv-python-headless>=4.10",
                        # game_auto.py：`cv2.matchTemplate` 做归一化互相关。
                        # 选 **headless** 而不是 `opencv-python`：我们只用匹配，
                        # 不用 `imshow`/`waitKey`，而 headless 轮子不带 GUI 依赖
                        # （少一层 GTK/Qt 的隐式依赖，也不会和游戏的窗口抢东西）。
                        # 为什么不手写：滑动窗口互相关自己实现只会更慢更容易错，
                        # 而"用成熟库"是本仓 P4 明确要求的。
]

[project.optional-dependencies]
# 测试与静态检查。一次装齐，避免后续「这个库没装」的反复。
dev = [
    # ── 测试框架与插件 ────────────────────────────────────
    "pytest>=9.0",
    "pytest-cov>=7.0",          # 覆盖率
    "pytest-benchmark>=5.3",    # 性能基准与回归门禁
    "pytest-timeout>=2.4",      # 卡死的测试必须失败而非永久挂住
    "pytest-randomly>=5.0",     # 随机化执行顺序，暴露用例间隐式依赖
    "pytest-regressions>=2.11", # 黄金回归（冻结产物指纹）
    "pytest-subtests>=0.15",    # 一个用例内的多组子断言
    "pytest-xdist>=3.8",        # 并行执行
    "hypothesis>=6.168",        # 属性测试与模糊测试

    # ── 性能剖析 ──────────────────────────────────────────
    "pyinstrument>=5.1",        # 采样式剖析器，输出调用树

    # ── 静态检查 ──────────────────────────────────────────
    "ruff>=0.16",               # 代码检查 + 格式化（取代 flake8/isort/black）
    "mypy>=1.14",               # 类型检查

    # ── 开发流程 ──────────────────────────────────────────
    "pre-commit>=4.0",          # 提交前自动跑 ruff/mypy
    "mutmut>=3.8",              # 变异测试（按需手动跑，配置见 [tool.mutmut]）
]

[project.scripts]
# 单一入口，取代 tools/ 下原先 7 个各自为政的脚本。
# 改动本段后需要重新 `pip install -e .`，否则 .venv/Scripts 下不会生成 v3.exe。
# 不装入口点也能用：`python -m pdx.cli` 等价。
v3 = "pdx.cli:app"

[tool.setuptools]
# 包源码在 tools/ 下（仓库既是「研究资料库」也是「工具源码库」，
# 因此没有采用 src/ 布局 —— 那样会让 tools/ 与 src/ 两份代码并存）。
package-dir = { "" = "tools" }
packages = ["pdx"]

# ─────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tools/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--timeout=300",
    "--timeout-method=thread",
    # ── 并行（pytest-xdist）────────────────────────────────
    # pytest 默认**串行**；装上 xdist 只是提供能力，必须显式传 -n 才并行。
    #
    # 这里的取值是实测出来的，不是拍的：
    #     串行                    314.2 秒
    #     -n auto --dist loadscope  132.8 秒   （-58%）
    #
    # 口径：整套测试（含基准用例与 15 MB 级的黄金回归写盘），
    # Windows 本机、`--no-cov`、连续两次运行取墙钟时间。
    # ``--dist loadscope`` 让同一个测试模块固定落在同一个 worker。这是必要的：
    # 本项目多个模块共用 session 级 fixture（ga/ma/ca 会跑一遍 16 秒的全量分析），
    # 而 **xdist 的 worker 之间不共享解析缓存**，每个 worker 都要各自重跑。
    # 按模块分组能把这份重复压到最小。
    #
    # 需要串行（例如要读完整的失败上下文）时传 ``-n0`` 覆盖。
    #
    # ⚠️ **跑基准必须加 -n0**：pytest-benchmark 在 xdist 开启时会
    # **自动禁用自己**（它无法在多个 worker 上做有意义的计时）。
    # 后果是 ``--benchmark-only`` 会直接报错，而不带该参数时基准被
    # 静默跳过 —— 实测踩过：启用并行后所有基准其实一直在跳过。
    #     pytest tools/tests/test_benchmarks.py --benchmark-only -n0
    "-n",
    "auto",
    "--dist",
    "loadscope",
]
# 说明：不设 --basetemp。pytest 的 tmp_path 在本机已可用，
# 默认落在系统 Temp 下即可，无需固定。
#
# 注：并行曾经不可用 —— 测试里的临时目录工具用「类变量计数器 + 固定前缀」
# 命名，而 worker 是独立进程、计数器各自从 0 开始，两个 worker 会撞同一个
# 目录。换用 tempfile.mkdtemp 后（它在操作系统层面保证唯一）才真正可用；
# 这个隔离缺陷正是并行时才暴露出来的。

markers = [
    "unit: 单元测试，不依赖游戏安装",
    "integration: 集成测试，需要真实游戏目录（无游戏时自动跳过）",
    "property: 属性测试与变形测试（hypothesis）",
    "regression: 回归测试，比对固化的指纹",
    "contract: 契约测试，校验输出结构不被破坏",
    "docs: 文档一致性测试，校验文档里的数字与实际提取结果一致",
    "cli: 命令行端到端测试（subprocess 真跑）",
    "slow: 耗时较长（超过数秒）",
    "benchmark: 性能基准",
]

[tool.coverage.run]
# 口径：只统计**装进包里**的代码（pdx），不含 tools/prof 与 tools/tests。
source = ["pdx"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
# 覆盖率门禁 —— 防止回退，不是拿来好看的。
#
# 口径说明：这里开的是**分支覆盖率**（``branch = true``），与「语句覆盖率」
# 不可直接比较。数字变低不代表测试变差，而是分母里多了
# 「只走了一个方向的分支」。
#
# 当前实测 87.2%，门槛钉在 86%。原始目标 95%。
#
# 已知的主要缺口（都是「重路径」，需要真跑游戏数据，故未覆盖）：
#   cli.py        73%  snapshot create/diff、analyze --profile 等分支
#   engine_log.py 77%  日志消息种类的冷门分支
#   mods.py       78%  mod 目录异常的兜底分支
#   tabular.py    80%  CSV 列数不齐等边界
# 其余模块均在 86% 以上；defines.py / cache.py 已 100%。
fail_under = 86
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "tools/out/coverage"

# ─────────────────────────────────────────────────────────────
# ruff —— 代码检查与格式化
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    # 下面三个目录当前**一个 .py 都没有**（tools/out 是 JSON 产物、
    # tools/reports 与 research/official-docs 全是 .md），而 ruff 本来
    # 就不检查非 Python 文件 —— 这两条目前是空转。留着的原因见各条注释。
    "tools/out",          # 产物目录，将来若落脚本也不该被 lint
    "tools/reports",      # 自动生成的 Markdown 报告
    # research/official-docs/ 是游戏官方文档的逐字镜像，不是我们的代码；
    # research/ 根下若出现自有产物则仍需检查，故不整目录排除。
    "research/official-docs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告
    "F",    # pyflakes
    "I",    # isort：导入排序
    "N",    # pep8-naming
    "UP",   # pyupgrade：用新语法替换旧写法
    "B",    # flake8-bugbear：常见陷阱
    "A",    # flake8-builtins：遮蔽内置名
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate：注释掉的代码
    "PL",   # pylint
    "RUF",  # ruff 自有规则
    # 后加的两组：PERF 专门抓「手写但标准写法更快更清楚」的模式
    # （实测本仓只有 2 处：一处手写 append 循环可用列表推导、
    # 一处只取 values 却用了 items）；FURB 是现代化的进一步建议，实测 0 告警。
    "PERF", # perflint
    "FURB", # refurb
]
ignore = [
    "PLR0913",  # 参数过多：dataclass 与 CLI 函数情有可原
    "PLR0917",  # 位置参数过多：同 PLR0913 —— typer 命令的每个形参就是一个
                # 命令行选项，拆成 dataclass 反而让 --help 失去参数说明
    "PLR2004",  # 魔法数字：本项目的「魔法数字」都是游戏实测值，有注释
    "PLR0912",  # 分支过多
    "PLR0915",  # 语句过多
    "PLR0911",  # return 过多
    "E501",     # 行长由 formatter 负责
    "SIM108",   # 三元表达式并非总是更清晰

    # ── 中文技术写作的必然豁免 ────────────────────────────
    # 本项目所有文档、注释、报错信息都是中文，必然出现全角标点
    # （）：「」、【】、—— 等。这三条规则把它们判为「易混淆的 Unicode
    # 字符」，在英文代码库里是对的，在中文代码库里是纯噪声：
    # 实测 848 条告警全部是中文标点，没有一条是真的字符混用。
    "RUF001",   # 字符串里的易混淆 Unicode 字符
    "RUF002",   # 文档字符串里的易混淆 Unicode 字符
    "RUF003",   # 注释里的易混淆 Unicode 字符
]

[tool.ruff.lint.per-file-ignores]
# 测试文件的刻意选择：
#   PT009  沿用 unittest 风格的 self.assertXxx —— 改成裸 assert 是独立的大
#          改造，收益是风格统一，风险是碰 179 处断言，性价比不划算
#   PLC2401/N802/N803 中文测试函数名与 fixture 形参名（test_镜像逐字节一致(镜像文件)）
#          比拼音可读得多，失败时 pytest 直接把中文名打出来，定位比英文名更快
#   RUF012 测试里的类属性是 fixture 风格的常量，加 ClassVar 只是噪声
#   ARG001/ARG002 pytest fixture 的形参由框架注入，必然「未使用」
#   N806   fixture 里用 GAME/CONFIG 这类大写局部名指代常量，是有意为之
#   S101   断言就是测试的正文；bandit 的 S 规则集并未启用，此项为前瞻
#   PT011  pytest.raises 不带 match= 是有意的：这里只关心「抛了没抛」
#   PLC0415 少量用例在函数体内 import（如 subprocess 起 CLI），便于局部化
"tools/tests/*" = [
    "PT009", "PLC2401", "N802", "N803", "RUF012",
    "ARG001", "ARG002", "N806",
    "S101", "PT011", "PLC0415",
]
# 注：这里**不再**列 lexer.py 的 PLR2004 —— 全局 ignore 里已经有了，
# 重复列一条永远不会生效（实测确认过）。
# 算法实现里的位运算与短路是刻意的

[tool.ruff.lint.isort]
known-first-party = ["pdx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ─────────────────────────────────────────────────────────────
# mutmut —— 变异测试（**不进 pytest**，按需手动跑）
#
# 为什么单独一个工具：变异测试要「改一处源码 → 跑一遍测试 → 看有没有红」，
# 一轮下来是几十次全套测试。放进 CI 等于每次提交都跑几十分钟，
# 放进 pytest 更是自相矛盾（测试里再跑测试）。它的用法是**定期体检**：
#
#     .venv\Scripts\python.exe -m mutmut run     # 跑一遍，看存活率
#     .venv\Scripts\python.exe -m mutmut results # 存活下来的变异体
#
# 先只挑**纯函数、无游戏依赖**的两个模块：变异测试的价值在于
# 「测试能不能发现语义改变」，而依赖真实游戏数据的模块会让每次变异都
# 因为环境差异而失败（那种红不代表测试强）。
# ─────────────────────────────────────────────────────────────
[tool.mutmut]
paths_to_mutate = ["tools/pdx/lexer.py", "tools/pdx/markers.py"]
tests_dir = "tools/tests"
runner = "python -m pytest -x -q -p no:randomly --no-header -m 'not integration and not benchmark'"

# ─────────────────────────────────────────────────────────────
# mypy —— 类型检查
# ─────────────────────────────────────────────────────────────
[tool.mypy]
# ⚠️ 3.12 而不是 3.11（`requires-python = ">=3.11"`）—— 这是被**桩文件**逼出来的一步，
# 起因与代价都写清楚，免得后人以为是随手抬的：
#
# 起因：`pdx.game_auto` 直接 import numpy（截图/模板是像素数组）与 cv2（模板匹配）。
# numpy 2.5 的 `__init__.pyi` 用了 PEP 695 的 `type X = …` 语句（第 737 行起），
# 那要求 `python_version >= 3.12`；钉在 3.11 时 mypy 会**在解析桩文件时就语法报错**
# 并直接中止整个检查：`errors prevented further checking`。也就是"不检查"，
# 比"按 3.12 检查"更糟。
#
# 试过但**不管用**的两条（都实测过，别再试）：
#   * `[[tool.mypy.overrides]] follow_imports = "skip"` —— 2.3.1 在 skip 模式下
#     照样解析桩文件，照样中止；加 `--ignore-missing-imports` 也无用。
#   * 逐模块 `python_version` —— mypy 直接拒绝：
#     `Per-module sections should only specify per-module flags (python_version)`。
#
# 代价：mypy 不再替我们拦「3.12 才有的语法」。
# 兜底不靠它：`requires-python = ">=3.11"` 与 classifiers 里的 3.11 由
# **CI 跑真实解释器**兜底（3.11 上 import 就会炸），ruff 的
# `target-version = "py311"` 也仍然只按 3.11 给建议。
# 实测口径变更的爆炸半径：全仓 111 个文件在 3.12 下 **0 个新错误**。
python_version = "3.12"
# 覆盖范围：解析器包 + 测试。
# **不含 `tools/prof/`** —— 那是一次性的剖析脚本，只在本地手跑、不进 CI；
# 但它仍受 ruff 约束（ruff 扫全仓），不是完全无人看管。
files = ["tools/pdx", "tools/tests"]
# 渐进式收紧：先保证「不出现新错误」，再逐步加严。
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = false   # 目标：逐步收紧到 true
disallow_incomplete_defs = false
show_error_codes = true
pretty = true

