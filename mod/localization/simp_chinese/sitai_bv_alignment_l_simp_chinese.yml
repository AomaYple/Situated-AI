 je_sitai_bv_alignment_window:0 "倒向谁：选边的窗口"
 je_sitai_bv_alignment_window_reason:0 "维也纳与柏林都在拉我们，而且两边出的价一样。不管我们愿不愿意，人已经在普鲁士的关税同盟里了；朝廷对维也纳的那点热络也还在；而我们自己写下的唯一一条关系，是跟符腾堡。一个中等王国不可能永远待在两个阵营里：靠上哪一边，关税就由哪一边定、票就跟着哪一边投、话也就由哪一边替我们说。\n\n窗口已经打开：选边一旦记进账，朝廷的威信就花在这上头，我们在欧洲自己的声音也不再只属于自己，靠保护吃饭的地主一派会失势 —— 而靠德意志市场吃饭的那批人会抬头。等国家重新自己站住，这扇窗就会关上。\n\n当前目标：趁两边都还在出价，先弄清楚我们能活在谁家的秩序里 —— 同时把这个王国保住。\n\n最大压力与阻力：压力 = 我们在欧洲自己的声音不再只属于自己、朝廷的威信花在这个选择上、靠保护吃饭的地主一派失势；阻力 = 两个大国本身，以及一个哪个都得罪不起的王国。\n\n上次改主意的原因：因为倒向哪一边这件事被记进了账 —— 是「必须挑一个靠山」这件事挪动了 AI 读到的那些输入，不是家里自己长出来的改革。"
