 je_sitai_sp_empire_remnant_window_reason:0 "王位是打出来的，账单还在桌上。从前替这个国家出钱的那个帝国已经没了 —— 剩下的只有古巴、菲律宾和几处驻防地 —— 所以这场内战是借钱打的，而借钱的价钱很贵。给另一位王位争夺者加冕的教会，教产已经被卖掉抵了战费；两派都不得不倚靠的军队，如今就站在屋子正中。\n\n窗口已经打开：王冠的威信被撕成两半、一直拦着改革的教会又失了势之时，那些在战争里一直主张建立一个现代国家的人，可以把旧秩序拦了几十年的东西推过去。等王冠重新自己站住，这扇窗就会关上。\n\n当前目标：趁王位威信扫地、教会又失了势的时候，把那套能把这个国家重新拼起来的改革推过去。\n\n最大压力与阻力：压力 = 王位被两个争夺者撕着、给另一边加冕的教会连教产都被卖掉抵了战费、两派都倚靠的军队如今站在屋子正中、帝国没了这场仗只能借钱打；阻力 = 等王冠重新自己站住。\n\n上次改主意的原因：因为这场内战与没了帝国的这件事被记进了账 —— 是「王位被两头撕、仗只能借钱打」这两件事挪动了 AI 读到的那些输入。"
