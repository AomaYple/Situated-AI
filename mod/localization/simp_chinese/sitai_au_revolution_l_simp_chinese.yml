 je_sitai_au_revolution_window_reason:0 "帝国正从内部裂开。王权的威信已经崩塌，而它每失去一分合法性，就多出一分激进派。支撑旧秩序的土地贵族正在失去对朝堂的掌控。\n\n窗口已经打开：政府合法性动摇、旧势力虚弱之时，改革是可能的。等国家重新站稳，这扇窗就会关上。\n\n当前目标：趁窗口开着，把旧势力一直拦着的那项改革推过去。\n\n最大压力与阻力：压力 = 合法性崩塌、它喂出来的激进派在涨，而土地贵族仍不肯松手；阻力 = 等国家重新自己站稳。\n\n上次改主意的原因：因为革命危机被记进了账 —— 是合法性塌下来这件事挪动了 AI 读到的那些输入。"
