 je_sitai_brz_market_loss_window:0 "商路断了：改革窗口"
 je_sitai_brz_market_loss_window_reason:0 "我们的咖啡和糖，走的是别人的路。庄园还在、人手还在、船也照来 —— 可是价钱定在我们坐不上的那张桌子上，而今年这条路正在关上。一个只靠一样作物的国家，刚刚明白了这句话是什么意思：替朝廷、军队和王冠体面付账的那笔出口，正是随时会被拿走的那一笔。\n\n窗口已经打开：靠出口吃饭的那一侧失了势、王冠的威信又花在一条它做不了主的路上之时，那些一直主张这个国家不能只靠一样作物的人，可以把种植园主拦了几十年的东西推过去。等王冠重新自己站住，这扇窗就会关上。\n\n当前目标：趁庄园那一侧失势、王冠威信也花掉了的时候，把那套能让这个国家不再只靠一样作物的改革推过去。\n\n最大压力与阻力：压力 = 替这个国家付账的那笔出口走的是别人家的路、靠它吃饭的庄园那一侧失了势、王冠又把威信花在一条自己做不了主的路上；阻力 = 等王冠重新自己站住。\n\n上次改主意的原因：因为路断了这件事被记进了账 —— 是「买家」而不是「战场」挪动了 AI 读到的那些输入。"
