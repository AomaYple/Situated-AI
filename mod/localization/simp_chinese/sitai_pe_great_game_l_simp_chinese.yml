 je_sitai_pe_great_game_window:0 "大博弈：改革窗口"
 je_sitai_pe_great_game_window_reason:0 "两强正从两个方向同时施压。俄国从北面取，英国从海湾取，而两边都不想要一个强到能拒绝他们的波斯。打垮我们的不是哪一场仗 —— 是这场漫长的挤压，和一个付不起战争、只能一次次拿特权去换的朝廷。国库靠高昂利息的外债撑着，而那些断言「关起门来就没事」的教士与部落长老，信用已经破产。\n\n窗口已经打开：国家被两边夹住、旧秩序威信扫地之时，改革派可以把教士们拦了几十年的那点有限现代化推过去。等国家重新站稳，这扇窗就会关上。\n\n当前目标：趁窗口开着，把教士与部落长老一直拦着的那点有限现代化推过去。\n\n最大压力与阻力：压力 = 两强从两个方向同时挤压、朝廷的威信在「总得对一边让步」里被磨掉、国库只靠高息外债撑着，而断言关起门就没事的教士已经信用破产；阻力 = 等国家重新自己站稳。\n\n上次改主意的原因：因为这场漫长的夹击被记进了账 —— 是被两边同时压着这件事挪动了 AI 读到的那些输入。"
