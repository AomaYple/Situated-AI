 je_sitai_pe_great_game_window:0 "The Great Game: A Window for Reform"
 je_sitai_pe_great_game_window_reason:0 "The two great powers press from both sides. Russia takes from the north, Britain from the Gulf, and neither wants a Persia strong enough to refuse either of them. There was no single battle that broke us — only the long squeeze, and a court that keeps paying in privileges because it cannot afford to fight. The treasury is kept alive on foreign loans at ruinous rates, and the ulama and tribal elders who promised that closing the door would keep us safe have lost their credit.\n\nA window is open: while the state is squeezed from both sides and the old order is discredited, the reformers can push through the limited modernization the clergy spent decades blocking. It closes again once the state stands firm.\n\nCurrent goal: while the window is open, push through the limited modernization that the clergy and the tribal elders have been blocking.\n\nBiggest pressure and resistance: pressure — the two powers press from both sides, the court's authority is worn down by having to yield to one or the other, the treasury survives only on foreign loans at ruinous rates, and the clergy who promised that closing the door would keep us safe have lost their credit; resistance — the state standing firm on its own again.\n\nWhy it changed its mind: because the long squeeze was written into the books — being pressed from both sides is what moved the inputs the AI reads."
