 je_sitai_bv_alignment_window:0 "Which Way to Lean: A Window to Choose"
 je_sitai_bv_alignment_window_reason:0 "Vienna and Berlin are both courting us, and both are paying the same price. We are already inside Prussia's customs union whether we like it or not, our court still keeps its warmth for Vienna, and the only tie we ever wrote down for ourselves is with Wurttemberg. A middle kingdom cannot stay in both camps forever: whoever we lean on will set our tariffs, carry our votes, and speak for us.\n\nA window is open: once the choice is on the books, the court's authority is spent on it, our own voice in Europe is no longer ours alone, and the landed interest that lives off protection loses its grip — while the men who live off the German market gain. It closes again once the state stands on its own feet.\n\nCurrent goal: while both great powers are still bidding for us, settle which one we can live under — and keep the kingdom while doing it.\n\nBiggest pressure and resistance: pressure — our own voice in Europe is no longer ours alone, the court's authority is spent on the choice, and the landed interest that lives off protection loses its grip; resistance — the two great powers, and a kingdom that cannot afford to offend either of them.\n\nWhy it changed its mind: because the choice of sides was written into the books — having to pick a patron, not a reform at home, is what moved the inputs the AI reads."
