 je_sitai_sp_empire_remnant_window:0 "The Empire's Remnant: A Window for Reform"
 je_sitai_sp_empire_remnant_window_reason:0 "The throne was fought over, and the bill is still on the table. The empire that used to pay for everything is gone — what is left is Cuba, the Philippines and a few garrisons — so the war was fought on borrowed money, and the money is dear. The church that blessed the other claimant has had its lands sold to pay for it; the army that both sides had to lean on now stands in the middle of the room.\n\nA window is open: while the crown's authority is torn in two and the church that blocked every reform has lost its grip, the men who spent the war arguing for a modern state can push through what the old order spent decades blocking. It closes again once the crown stands on its own.\n\nCurrent goal: while the throne is discredited and the church has lost its grip, push through the reform that would put this country back together.\n\nBiggest pressure and resistance: pressure — the throne is torn between two claimants, the church that blessed the other one has had its lands sold to pay for the war, the army both sides leaned on now stands in the middle of the room, and with the empire gone the war could only be fought on borrowed money; resistance — the crown standing on its own again.\n\nWhy it changed its mind: because the civil war and the lost empire were written into the books — a throne split two ways, and a war that had to be paid for with borrowed money, are what moved the inputs the AI reads."
