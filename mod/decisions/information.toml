[[rules]]
id = "lj04_welfare_zero_administration_foundation"
domain = "political"
field = "institution_scores.institution_social_security"
contribution_group = "social_security_need"
priority = 46
value = 1.02
conditions = [
  { fact = "default", op = "=", value = false },
  { fact = "average_sol", op = "<", value = 8 },
  { fact = "population", op = ">", value = 0 },
  { fact = "bureaucracy", op = "=", value = 0 },
]
why = "行政缺口实际修复到零且民生需求仍在时提供低强度制度关注，正余量继续使用既有档；不以行政候选当作已修复"
counterexample = "零余量不创造制度等级或资格，原版实际成本仍优先；负余量、未知、玩家或无民生需求时保留原版，不写持久完成状态"

[[rules]]
id = "social_welfare_population_pressure"
domain = "political"
field = "institution_scores.institution_social_security"
contribution_group = "social_security_need"
priority = 45
value = 1.10
conditions = [
  { fact = "default", op = "=", value = false },
  { fact = "war", op = "=", value = false },
  { fact = "average_sol", op = "<", value = 8 },
  { fact = "population", op = ">=", value = 2000000 },
  { fact = "bureaucracy", op = ">", value = 0 },
]
why = "大人口国家生活水平较低且有行政承载时，提高社会保障制度的原版投资相对权重"
counterexample = "人口、生活水平或行政能力未知时回退原版；不直接改变福利支付、人口或制度等级"

[[rules]]
id = "social_welfare_local_foundation"
domain = "political"
field = "institution_scores.institution_social_security"
contribution_group = "social_security_need"
priority = 44
value = 1.05
conditions = [
  { fact = "default", op = "=", value = false },
  { fact = "average_sol", op = "<", value = 8 },
  { fact = "population", op = ">", value = 0 },
  { fact = "bureaucracy", op = ">", value = 0 },
]
why = "已知有居民、生活水平较低且具备财政和行政承载时，提供低强度社会保障投资倾向；不以大国或和平为前提"
counterexample = "违约、需求不成立或承载不足时不介入；未知保留原版；不直接支付福利或改变制度等级，原版资格、成本和政治支持仍由原版处理"

[[rules]]
id = "lj07_grain_social_foundation"
domain = "political"
field = "institution_scores.institution_social_security"
contribution_group = "social_security_need"
priority = 42020
operation = "multiply"
value = 1.06
conditions = [
  { fact = "bureaucracy", op = ">=", value = 0 },
  { fact = "net_surplus", op = ">=", value = 0 },
  { fact = "grain_price", op = ">", value = 0.5 },
  { fact = "grain_balance", op = "<", value = 0 },
  { fact = "default", op = "=", value = false },
]
why = "根市场粮食价格和供需余额同时显示短缺时，提高社会保障制度的有限基础倾向；原版资格、行政承载、维护和执行继续优先"
counterexample = "不把粮食压力改写成治安或免费福利；任一粮食事实、违约或市场作用域未知时回退原版，不改变生活水平或制度等级"

[[rules]]
id = "lj07_grain_social_capacity"
domain = "political"
field = "institution_scores.institution_social_security"
contribution_group = "social_security_need"
priority = 42021
operation = "multiply"
value = 1.12
conditions = [
  { fact = "grain_price", op = ">", value = 0.5 },
  { fact = "grain_balance", op = "<", value = 0 },
  { fact = "average_sol", op = "<", value = 8 },
  { fact = "bureaucracy", op = ">", value = 0 },
  { fact = "net_surplus", op = ">", value = 0 },
  { fact = "insurrection", op = "=", value = false },
  { fact = "default", op = "=", value = false },
]
why = "粮食短缺与低生活水平、行政和净收入承载同时存在且无叛乱时，社会保障倾向有限升档；健康、稳定和粮食仍由不同消费者表达"
counterexample = "缺少任一社会、行政、财政或政治事实时不升档；候选制度不等于已实施，不免费修正民生、稳定或财政，原版资格和成本保持"

[[rules]]
id = "navy_existing_capacity"
contribution_group = "military_target_demand"
domain = "military"
field = "wanted_navy_size"
priority = 75
value = 1.10
conditions = [
  { fact = "navy", op = "<", value = 10 },
  { fact = "gdp", op = ">", value = 0 },
  { fact = "gold_reserves", op = ">=", value = 100 },
  { fact = "default", op = "=", value = false },
]
why = "经济与储备可承受且海军规模偏低时提高原版海军目标"
counterexample = "不直接创建舰船、港口或海军资格；事实未知、违约或原版军费约束不满足时回退原版"

[[rules]]
id = "army_threat_capacity"
contribution_group = "military_target_demand"
domain = "military"
field = "wanted_army_size"
priority = 75
value = 1.10
conditions = [
  { fact = "army", op = "<", value = 50 },
  { fact = "infamy", op = ">", value = 25 },
  { fact = "gdp", op = ">", value = 0 },
  { fact = "default", op = "=", value = false },
]
why = "军力偏低、外部代价较高且经济可承受时提高原版常备军目标"
counterexample = "不直接创建军队或改变战斗数值；财政危机、事实未知或原版军制资格不满足时保留原版"

[[rules]]
id = "political_default_risk"
contribution_group = "political_crisis_aversion"
domain = "political"
field = "revolution_aversion"
priority = 50
value = 1.2
conditions = [
  { fact = "default", op = "=", value = true },
]
why = "财政违约提高避免革命的原版倾向，不禁止立法"
counterexample = "非违约国家保持原版；不修改真实法律资格"

[[rules]]
id = "political_insurrection_aversion"
domain = "political"
field = "revolution_aversion"
contribution_group = "political_crisis_aversion"
priority = 300
value = 1.2
conditions = [ { fact = "insurrection", op = "=", value = true } ]
why = "当前真实政治危机提高避免革命的有限倾向；战争不屏蔽国内风险"
counterexample = "局部未知退出本项，不禁止立法、不改变原版资格；不保留旧全国路线25至35迟滞或跨域互斥"

[[rules]]
id = "political_legitimacy_crisis_aversion"
domain = "political"
field = "revolution_aversion"
contribution_group = "political_crisis_aversion"
priority = 299
value = 1.2
conditions = [ { fact = "legitimacy", op = "<", value = 25 } ]
why = "当前真实政治危机提高避免革命的有限倾向；战争不屏蔽国内风险"
counterexample = "局部未知退出本项，不禁止立法、不改变原版资格；不保留旧全国路线25至35迟滞或跨域互斥"

[[rules]]
id = "administrative_cost_guard"
intent = "fiscal_recovery"
domain = "economy"
field = "institution_scores.institution_social_security"
contribution_group = "institution_financing_pressure"
priority = 50
value = 0.8
conditions = [
  { fact = "default", op = "=", value = true },
  { fact = "war", op = "=", value = false },
]
why = "违约且和平时降低新增社会保障制度的支出倾向"
counterexample = "不减少实际福利、不修改制度或人口属性"

[[rules]]
id = "subject_defense_cooperation"
domain = "subjects"
field = "treaty_category_scores.military_defense"
priority = 50
value = 1.2
conditions = [
  { fact = "subject", op = "=", value = true },
  { fact = "default", op = "=", value = false },
]
why = "属国在可负担时稍重视防御合作类别"
counterexample = "不制造独立资格或改变宗属关系；不可行条约仍由原版拒绝"

[[rules]]
id = "diplomatic_overextension"
intent = "fiscal_recovery"
domain = "diplomacy"
field = "max_active_stances"
priority = 50
value = 0.8
conditions = [
  { fact = "default", op = "=", value = true },
]
why = "违约时适度收缩同时维持的战略立场数量"
counterexample = "非违约保持原版；不直接退出条约或战争"

[[rules]]
# Keep the historical rule identity for migration; default cost now also applies at war.
id = "military_peacetime_budget"
domain = "military"
field = "wanted_army_size"
priority = 50
value = 0.85
conditions = [
  { fact = "default", op = "=", value = true },
]
why = "违约使新增常备军目标承担独立财政代价；战争需求仍在同一消费者中联合评估，不因战争而删除已知成本"
counterexample = "仅降低新增目标的相对倾向，不删除军队、不改战斗属性或实际军费；违约未知只跳过成本，不假设财政健康，不关闭已证战争需求，原版基值、资格和执行保持"

[[rules]]
id = "lj10_defensive_pact_flow_pressure"
domain = "military"
field = "wanted_army_size"
priority = 60
value = 0.95
conditions = [
  { fact = "war", op = "=", value = false },
  { fact = "default", op = "=", value = false },
  { fact = "net_surplus", op = "<", value = 0 },
  { fact = "defensive_pact_articles", op = ">=", value = 1 },
  { fact = "native_army_capacity", op = ">", value = { fact = "native_marine_capacity" } },
]
why = "和平且净流量承压时，本国已关联的防御协定标记条款作为小幅减少重复新增军备承诺的信号；高优先防御及明确威胁仍优先"
counterexample = "条款数不等于伙伴数、履约、军力或完全安全，不保证active/ratified状态；不按数量累乘，不删除军队，不把提案或选中条约当当前关系；核心未知回退原版，玩家与关闭不变"

[[rules]]
# Historical identity retained; the default cost is independent of peace/war.
id = "naval_peacetime_budget"
domain = "military"
field = "wanted_navy_size"
priority = 50
value = 0.8
conditions = [
  { fact = "default", op = "=", value = true },
]
why = "违约独立压低新增海军目标，战争只增加有界需求而不取消财政代价；实际海军目标仍由原版数量基值求值"
counterexample = "不删除舰船、不改变已有舰队、实际军费或海军资格；违约未知只跳过相关成本，战争未知不抹去已知违约，原版零基值经正倍率仍为零"

[[rules]]
id = "naval_design_affordability"
domain = "military"
field = "max_ship_design_complexity"
priority = 50
value = 0.85
conditions = [
  { fact = "default", op = "=", value = true },
]
why = "真实违约独立降低新舰设计复杂度目标；和平、战争或战争未知均保留这项新增设计融资机会成本"
counterexample = "违约未知局部回原版；正常借款不扣；不改变既有舰船、战斗数值或实际军费；原版国家等级、法律和零值保留"

[[rules]]
id = "military_artillery_affordability"
intent = "fiscal_recovery"
domain = "military"
field = "combat_unit_group_weights.combat_unit_group_artillery"
priority = 50
value = 0.85
conditions = [
  { fact = "default", op = "=", value = true },
  { fact = "war", op = "=", value = false },
  { fact = "artillery_tech", op = "=", value = true },
]
why = "已有炮兵科技但和平违约时调整昂贵编制的相对权重"
counterexample = "未解锁科技时不新增炮兵权重；战争保持原版"

[[rules]]
id = "identity_expansion_defense"
domain = "identity"
field = "treaty_category_scores.military_defense"
priority = 40
value = 1.15
conditions = [
  { fact = "default", op = "=", value = false },
  { fact = "war", op = "=", value = false },
  { fact = "expansion_route", op = "=", value = true },
]
why = "沿原有扩张路线时保留可负担的防御合作关注"
counterexample = "不提高宣战成功率、兵力或免费外交资格"


[[rules]]
# A single demand envelope chooses the strongest proven tier. Capacity observations
# upgrade an existing war need; neither positive flow nor administration is its gate.
id = "wartime_army_foundation"
contribution_group = "military_target_demand"
domain = "military"
field = "wanted_army_size"
priority = 70
value = 1.08
conditions = [{ fact = "war", op = "=", value = true }]
why = "已知战争独立证明基础防御需求，常备军目标小幅提高；财政盈余、行政余量与非违约不再成为全部需求的共同门"
counterexample = "战争未知不制造防御需求；违约成本独立参加，不能把目标当已建部队、资源预留或真实军力；正倍率保留原版非陆战队常备军基值、零值、资格与实际费用"

[[rules]]
id = "wartime_army_fiscal_capacity"
contribution_group = "military_target_demand"
auxiliary_facts = ["net_surplus"]
domain = "military"
field = "wanted_army_size"
priority = 79
value = 1.12
conditions = [
  { fact = "war", op = "=", value = true },
  { fact = "default", op = "=", value = false },
  { fact = "net_surplus", op = ">", value = 0 },
]
why = "战争需求在已证非违约且净流量为正时使用财政承载中档，不要求行政余量同时为正；只选最强档，不与基础档累乘或累加"
counterexample = "净流量、违约未知或无盈余时不升财政档，但保留独立战争基础需求与其他已证行政档；不赠军费或建造能力"

[[rules]]
id = "wartime_army_administrative_capacity"
contribution_group = "military_target_demand"
auxiliary_facts = ["bureaucracy"]
domain = "military"
field = "wanted_army_size"
priority = 78
value = 1.11
conditions = [
  { fact = "war", op = "=", value = true },
  { fact = "bureaucracy", op = ">", value = 0 },
