# 全域规则的唯一参数来源；方向和倍率仍待用户长期行为与平衡验收。
# 只补充原版数值消费者，不能把静态用例或继承的原版能力写成新增实现。
schema = 1
baseline_sha256 = "6d0b4569b3f3b35f2ca1aab51ff71f2417b41e51c01379ee340394dee1f5f431"

