# 31.3 逐领域深化：每条规则只使用一个局部事实组合；未知时由原版消费者回退。
[[rules]]
id = "education_literacy_capacity"
domain = "political"
field = "institution_scores.institution_schools"
priority = 40
value = 1.10
conditions = [{ fact = "literacy", op = "<", value = 0.35 }]
why = "识字率极低时提供低强度教育基础倾向；不要求先满足财政或行政能力组合"
counterexample = "不直接提高识字率、学校等级或财政；原版资格和制度成本仍由原版处理"

[[rules]]
id = "lj04_welfare_zero_administration_foundation"
domain = "political"
field = "institution_scores.institution_social_security"
priority = 46
value = 1.02
conditions = [
  { fact = "default", op = "=", value = false },
  { fact = "average_sol", op = "<", value = 8 },
  { fact = "population", op = ">", value = 0 },
  { fact = "bureaucracy", op = "=", value = 0 },
]
why = "行政缺口实际修复到零且民生需求仍在时提供低强度制度关注，正余量继续使用既有档；不以行政候选当作已修复"
counterexample = "零余量不创造制度等级或资格，原版实际成本仍优先；负余量、未知、玩家或无民生需求时保留原版，不写持久完成状态"

[[rules]]
id = "social_welfare_population_pressure"
domain = "political"
field = "institution_scores.institution_social_security"
priority = 45
value = 1.10
conditions = [
  { fact = "default", op = "=", value = false },
  { fact = "war", op = "=", value = false },
  { fact = "average_sol", op = "<", value = 8 },
  { fact = "population", op = ">=", value = 2000000 },
  { fact = "bureaucracy", op = ">", value = 0 },
]
why = "大人口国家生活水平较低且有行政承载时，提高社会保障制度的原版投资相对权重"
counterexample = "人口、生活水平或行政能力未知时回退原版；不直接改变福利支付、人口或制度等级"

[[rules]]
id = "social_welfare_local_foundation"
domain = "political"
field = "institution_scores.institution_social_security"
priority = 44
value = 1.05
conditions = [
  { fact = "default", op = "=", value = false },
  { fact = "average_sol", op = "<", value = 8 },
  { fact = "population", op = ">", value = 0 },
  { fact = "bureaucracy", op = ">", value = 0 },
]
why = "已知有居民、生活水平较低且具备财政和行政承载时，提供低强度社会保障投资倾向；不以大国或和平为前提"
counterexample = "违约、需求不成立或承载不足时不介入；未知保留原版；不直接支付福利或改变制度等级，原版资格、成本和政治支持仍由原版处理"

[[rules]]
id = "lj07_grain_social_foundation"
domain = "political"
field = "institution_scores.institution_social_security"
priority = 42020
operation = "multiply"
value = 1.06
conditions = [
  { fact = "bureaucracy", op = ">=", value = 0 },
  { fact = "net_surplus", op = ">=", value = 0 },
  { fact = "grain_price", op = ">", value = 0.5 },
  { fact = "grain_balance", op = "<", value = 0 },
  { fact = "default", op = "=", value = false },
]
why = "根市场粮食价格和供需余额同时显示短缺时，提高社会保障制度的有限基础倾向；原版资格、行政承载、维护和执行继续优先"
counterexample = "不把粮食压力改写成治安或免费福利；任一粮食事实、违约或市场作用域未知时回退原版，不改变生活水平或制度等级"

[[rules]]
id = "lj07_grain_social_capacity"
domain = "political"
field = "institution_scores.institution_social_security"
priority = 42021
operation = "multiply"
value = 1.12
conditions = [
  { fact = "grain_price", op = ">", value = 0.5 },
  { fact = "grain_balance", op = "<", value = 0 },
  { fact = "average_sol", op = "<", value = 8 },
  { fact = "bureaucracy", op = ">", value = 0 },
  { fact = "net_surplus", op = ">", value = 0 },
  { fact = "insurrection", op = "=", value = false },
  { fact = "default", op = "=", value = false },
]
why = "粮食短缺与低生活水平、行政和净收入承载同时存在且无叛乱时，社会保障倾向有限升档；健康、稳定和粮食仍由不同消费者表达"
counterexample = "缺少任一社会、行政、财政或政治事实时不升档；候选制度不等于已实施，不免费修正民生、稳定或财政，原版资格和成本保持"

[[rules]]
id = "administrative_bureaucracy_repair"
domain = "economy"
field = "wanted_construction_output"
priority = 613
value = 0.85
conditions = [
  { fact = "bureaucracy", op = "<", value = 0 },
  { fact = "default", op = "=", value = false },
  { fact = "war", op = "=", value = false },
]
why = "行政赤字且和平时降低新增建设目标，把有限承载优先留给行政修复"
counterexample = "不删除已有建设、不创造官僚；战争、违约或任一事实未知时保留原版"

[[rules]]
id = "population_employment_capacity"
domain = "economy"
field = "wanted_construction_output"
priority = 55
value = 1.10
conditions = [
  { fact = "population", op = ">=", value = 5000000 },
  { fact = "average_sol", op = "<", value = 9 },
  { fact = "gdp", op = ">", value = 0 },
  { fact = "default", op = "=", value = false },
]
why = "大人口、低生活水平且有经济能力时提高原版建设目标，缓解就业与供给压力"
counterexample = "不指定建筑、不创造就业或商品；战争、违约、经济或人口事实未知时不增量"

[[rules]]
id = "navy_existing_capacity"
contribution_group = "military_target_demand"
domain = "military"
field = "wanted_navy_size"
priority = 75
value = 1.10
conditions = [
  { fact = "navy", op = "<", value = 10 },
  { fact = "gdp", op = ">", value = 0 },
  { fact = "gold_reserves", op = ">=", value = 100 },
  { fact = "default", op = "=", value = false },
]
why = "经济与储备可承受且海军规模偏低时提高原版海军目标"
counterexample = "不直接创建舰船、港口或海军资格；事实未知、违约或原版军费约束不满足时回退原版"

[[rules]]
id = "army_threat_capacity"
contribution_group = "military_target_demand"
domain = "military"
field = "wanted_army_size"
priority = 75
value = 1.10
conditions = [
  { fact = "army", op = "<", value = 50 },
  { fact = "infamy", op = ">", value = 25 },
  { fact = "gdp", op = ">", value = 0 },
  { fact = "default", op = "=", value = false },
]
why = "军力偏低、外部代价较高且经济可承受时提高原版常备军目标"
counterexample = "不直接创建军队或改变战斗数值；财政危机、事实未知或原版军制资格不满足时保留原版"

[[rules]]
id = "overseas_naval_projection"
domain = "geography"
field = "colonial_interest_ratio"
priority = 75
value = 1.10
conditions = [
  { fact = "navy", op = ">=", value = 50 },
  { fact = "gdp", op = ">", value = 0 },
  { fact = "infamy", op = "<", value = 25 },
  { fact = "default", op = "=", value = false },
]
why = "海军投射、经济能力和恶名约束同时满足时提高原版海外利益分配倾向"
counterexample = "不创造殖民资格、海外州或航线；事实未知、违约或原版资格不满足时回退原版"

[[rules]]
id = "market_access_state_value"
domain = "market"
field = "state_value"
priority = 45
value = 1.10
conditions = [
  { fact = "target_market_access", op = ">=", value = 0.80 },
  { fact = "target_isolated", op = "=", value = false },
  { fact = "target_owned", op = "=", value = false },
]
why = "目标州市场接入良好且非孤立时提高原版州价值的有限相对权重"
counterexample = "不授予市场接入、所有权或战争目标；目标事实未知、孤立或原版资格不满足时保留原版"

[[rules]]
id = "trade_low_living_standard"
domain = "market"
field = "treaty_category_scores.trade"
priority = 58
value = 1.10
conditions = [
  { fact = "average_sol", op = "<", value = 12 },
  { fact = "gdp", op = ">", value = 0 },
  { fact = "war", op = "=", value = false },
]
why = "和平且有经济活动、生活水平偏低时提高原版贸易合作类别的相对关注"
counterexample = "不创建贸易路线、商品或条约资格；战争、未知事实或无可行条约时由原版保留"

[[rules]]
id = "fiscal_construction_guard"
intent = "fiscal_recovery"
domain = "fiscal"
field = "wanted_construction_output"
priority = 100
value = 0.75
conditions = [
  { fact = "default", op = "=", value = true },
  { fact = "war", op = "=", value = false },
]
why = "和平且违约时降低新增建设目标；不取消已有施工或创造资金"
counterexample = "战争时保留原版建设目标；原版零目标保持为零"

[[rules]]
id = "route_fiscal_recovery_construction"
domain = "fiscal"
field = "wanted_construction_output"
priority = 310
value = 0.75
conditions = [ { fact = "route_fiscal_recovery", op = "=", value = true } ]
why = "财政整固路线占用影子预算时降低新增建设目标，保留原版资格、成本和执行"
counterexample = "路线变量缺失、未知、玩家或状态模块关闭时不调整；不取消已有施工或创造资金"

[[rules]]
id = "war_defeat_reconstruction"
intent = "supported_development"
domain = "economy"
field = "wanted_construction_output"
priority = 75
value = 1.2
conditions = [
  { fact = "default", op = "=", value = false },
  { fact = "war", op = "=", value = false },
  { fact = "war_defeat", op = "=", value = true },
  { fact = "income", op = ">", value = 0 },
]
why = "原版失败记忆有效、和平、未违约且收入为正时提高复原建设目标"
counterexample = "仅覆盖原版 on_capitulation/on_lost_war 写入且持续1825日的 recently_lost_war；记忆缺失、在战、违约或收入非正/未知时不应用本规则，更高优先级的同字段规则仍优先，不推断所有战败历史"

[[rules]]
id = "economic_development"
intent = "supported_development"
domain = "economy"
field = "wanted_construction_output"
priority = 50
value = 1.15
conditions = [
  { fact = "default", op = "=", value = false },
  { fact = "war", op = "=", value = false },
