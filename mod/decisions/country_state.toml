schema = 1
variable_ttl_days = 100
switch_cooldown_days = 62
update_days = 30
enabled = true

# 承受能力与领域需求分离：低债务借款、负行政或低合法性不再关闭基础发展。
# 仅严重违约/高债务进入恢复；研究候选本身不增加经常财政支出。
[coordination.capacities.recovery]
when = [[{ fact = "default", op = "=", value = true }], [{ fact = "debt_ratio", op = ">=", value = 0.75 }]]
why = "严重偿付压力限制新增长期承诺，但允许寻找恢复能力的研究与合作"
[coordination.capacities.development]
when = [[{ fact = "default", op = "=", value = false }, { fact = "war", op = "=", value = false }, { fact = "debt_ratio", op = "<", value = 0.75 }, { fact = "income", op = ">", value = 0 }]]
why = "基础发展不要求净盈余、行政富余、高合法性或既有工业路线；原版仍决定是否花钱"
[coordination.capacities.stable_capacity]
when = [[{ fact = "default", op = "=", value = false }, { fact = "war", op = "=", value = false }, { fact = "debt_ratio", op = "<=", value = 0.5 }, { fact = "income", op = ">", value = 0 }, { fact = "net_surplus", op = ">=", value = 0 }, { fact = "bureaucracy", op = ">=", value = 0 }]]
why = "财政可持续且行政不欠账时扩大稳健投资，政治门槛留给改革消费者"
[coordination.capacities.expansion_capacity]
when = [[{ fact = "default", op = "=", value = false }, { fact = "war", op = "=", value = false }, { fact = "debt_ratio", op = "<=", value = 0.2 }, { fact = "income", op = ">", value = 0 }, { fact = "net_surplus", op = ">", value = 0 }, { fact = "bureaucracy", op = ">=", value = 100 }, { fact = "legitimacy", op = ">=", value = 60 }, { fact = "insurrection", op = "=", value = false }]]
why = "强财政、行政和政治容量才提高昂贵或长期扩张强度"

[coordination.needs.fiscal]
when = [[{ fact = "default", op = "=", value = true }], [{ fact = "debt_ratio", op = ">=", value = 0.5 }], [{ fact = "loans", op = "=", value = true }, { fact = "net_surplus", op = "<", value = 0 }]]
why = "区分融资与危机，持续赤字借款或高债务需要修复偿付能力"
[coordination.needs.administrative]
when = [[{ fact = "bureaucracy", op = "<", value = 0 }]]
why = "负行政容量转向行政建设和行政研究，不永久禁止补瓶颈"
[coordination.needs.political]
when = [[{ fact = "legitimacy", op = "<", value = 35 }], [{ fact = "insurrection", op = "=", value = true }]]
why = "政治危机改变改革机会成本，不能统一推导意识形态"
[coordination.needs.education]
when = [[{ fact = "literacy", op = "<", value = 0.5 }, { fact = "population", op = ">", value = 0 }]]
why = "教育差距按识字率而非国家规模识别，学校、大学和研究分别受消费者约束"
[coordination.needs.industry]
when = [[{ fact = "industrial_route", op = "=", value = true }], [{ fact = "resource_route", op = "=", value = true }], [{ fact = "war_defeat", op = "=", value = true }]]
why = "原版产业路线或可观察战败恢复提高生产能力关注，不是工业发展的唯一资格"
[coordination.needs.security]
when = [[{ fact = "war", op = "=", value = true }]]
why = "战争下军需与生存优先，财政约束只限制新增承诺"
[coordination.needs.reconstruction]
when = [[{ fact = "war_defeat", op = "=", value = true }, { fact = "war", op = "=", value = false }]]
why = "仅原版 recently_lost_war 正面证据支持战后恢复，不推断所有战争历史"
[coordination.needs.overseas]
when = [[{ fact = "expansion_route", op = "=", value = true }, { fact = "navy", op = ">=", value = 25 }, { fact = "subject", op = "=", value = false }]]
why = "海外需求需要既有投射和原版路线，财政强度由独立能力层控制"

[readers]
war = { engine = "is_at_war", kind = "boolean", unit = "boolean" }
default = { engine = "in_default", kind = "boolean", unit = "boolean" }
loans = { engine = "taking_loans", kind = "boolean", unit = "boolean" }
debt_ratio = { engine = "scaled_debt", kind = "number", unit = "debt_to_credit_ratio", min = 0 }
net_surplus = { engine = "net_total_income", kind = "number", unit = "currency_per_week" }
bureaucracy = { engine = "bureaucracy", kind = "number", unit = "capacity_balance" }
legitimacy = { engine = "legitimacy", kind = "number", unit = "legitimacy_0_100", min = 0, max = 100 }
literacy = { engine = "literacy_rate", kind = "number", unit = "ratio", min = 0, max = 1 }
population = { engine = "total_population", kind = "number", unit = "persons", min = 0 }
navy = { engine = "navy_size", kind = "number", unit = "ships", min = 0 }
industrial_route = { engine = "has_strategy", kind = "boolean", unit = "boolean", argument = "ai_strategy_industrial_expansion" }
resource_route = { engine = "has_strategy", kind = "boolean", unit = "boolean", argument = "ai_strategy_resource_expansion" }
expansion_route = { engine = "has_strategy", kind = "boolean", unit = "boolean", argument = "ai_strategy_territorial_expansion" }
insurrection = { engine = "has_insurrectionary_interest_groups", kind = "boolean", unit = "boolean" }
war_defeat = { engine = "has_variable", kind = "boolean", unit = "boolean", argument = "recently_lost_war" }
subject = { engine = "is_subject", kind = "boolean", unit = "boolean" }
income = { engine = "fixed_income", kind = "number", unit = "currency_per_week" }
artillery_tech = { engine = "has_technology_researched", kind = "boolean", unit = "boolean", argument = "artillery" }

# 同一档位谓词同时编译到 Python 参考预算和 PDX 路线资格。
# 零成本不依赖该预算事实；未知值只允许已被证明的最低能力。
[budgets.fiscal]
1 = [[{ fact = "debt_ratio", op = "<", value = 0.7 }]]
2 = [[{ fact = "debt_ratio", op = "<", value = 0.4 }, { fact = "net_surplus", op = ">", value = 0 }]]

[budgets.administrative]
1 = [[{ fact = "bureaucracy", op = ">=", value = 0 }]]
2 = [[{ fact = "bureaucracy", op = ">=", value = 100 }]]

[budgets.security]
1 = [[{ fact = "navy", op = ">", value = 0 }]]
2 = [[{ fact = "navy", op = ">=", value = 25 }, { fact = "artillery_tech", op = "=", value = true }]]

[dimensions]
fiscal = { facts = ["debt_ratio", "net_surplus", "default", "loans"] }
administrative = { facts = ["bureaucracy"] }
political = { facts = ["legitimacy", "insurrection", "subject"] }
social = { facts = ["population"] }
industry = { facts = ["industrial_route", "resource_route", "net_surplus", "war_defeat"] }
market = { facts = ["net_surplus"] }
diplomacy = { facts = ["subject"] }
military = { facts = ["navy", "war"] }
education = { facts = ["literacy", "artillery_tech"] }
overseas = { facts = ["navy"] }
identity = { facts = ["subject"] }
crisis = { facts = ["war", "default", "insurrection", "war_defeat"] }

[routes.fiscal_recovery]
priority = 100
emergency = true
enter = [
  [{ fact = "default", op = "=", value = true }],
  [{ fact = "loans", op = "=", value = true }, { fact = "net_surplus", op = "<", value = 0 }, { fact = "debt_ratio", op = ">=", value = 0.4 }],
  [{ fact = "debt_ratio", op = ">=", value = 0.6 }],
]
hold = [
  [{ fact = "default", op = "=", value = true }],
  [{ fact = "loans", op = "=", value = true }, { fact = "net_surplus", op = "<", value = 0 }, { fact = "debt_ratio", op = ">=", value = 0.4 }],
  [{ fact = "debt_ratio", op = ">=", value = 0.4 }],
]
cost = { fiscal = 1, administrative = 1, security = 0 }

[routes.stability]
priority = 90
emergency = true
enter = [
  [{ fact = "insurrection", op = "=", value = true }],
  [{ fact = "legitimacy", op = "<", value = 25 }],
]
hold = [
  [{ fact = "insurrection", op = "=", value = true }],
  [{ fact = "legitimacy", op = "<", value = 35 }],
]
cost = { fiscal = 0, administrative = 1, security = 1 }

[routes.defense]
priority = 110
emergency = true
enter = [[{ fact = "war", op = "=", value = true }]]
hold = [[{ fact = "war", op = "=", value = true }]]
cost = { fiscal = 1, administrative = 1, security = 2 }

[routes.industry]
priority = 50
emergency = false
enter = [
  [
    { fact = "war", op = "=", value = false },
    { fact = "default", op = "=", value = false },
    { fact = "industrial_route", op = "=", value = true },
    { fact = "net_surplus", op = ">", value = 0 },
  ],
  [
    { fact = "war", op = "=", value = false },
    { fact = "default", op = "=", value = false },
    { fact = "resource_route", op = "=", value = true },
    { fact = "net_surplus", op = ">", value = 0 },
  ],
  [
    { fact = "war", op = "=", value = false },
    { fact = "default", op = "=", value = false },
    { fact = "war_defeat", op = "=", value = true },
    { fact = "income", op = ">", value = 0 },
    { fact = "net_surplus", op = ">", value = 0 },
  ],
]
hold = [
  [
    { fact = "war", op = "=", value = false },
    { fact = "default", op = "=", value = false },
    { fact = "industrial_route", op = "=", value = true },
    { fact = "net_surplus", op = ">", value = 0 },
  ],
  [
    { fact = "war", op = "=", value = false },
    { fact = "default", op = "=", value = false },
    { fact = "resource_route", op = "=", value = true },
    { fact = "net_surplus", op = ">", value = 0 },
  ],
  [
    { fact = "war", op = "=", value = false },
    { fact = "default", op = "=", value = false },
    { fact = "war_defeat", op = "=", value = true },
    { fact = "income", op = ">", value = 0 },
    { fact = "net_surplus", op = ">", value = 0 },
  ],
]
cost = { fiscal = 1, administrative = 1, security = 0 }

[routes.education]
priority = 60
emergency = false
enter = [[
  { fact = "war", op = "=", value = false },
  { fact = "default", op = "=", value = false },
  { fact = "literacy", op = "<", value = 0.5 },
  { fact = "population", op = ">", value = 0 },
  { fact = "net_surplus", op = ">", value = 0 },
]]
hold = [[
  { fact = "war", op = "=", value = false },
  { fact = "default", op = "=", value = false },
  { fact = "literacy", op = "<", value = 0.6 },
  { fact = "population", op = ">", value = 0 },
  { fact = "net_surplus", op = ">", value = 0 },
]]
