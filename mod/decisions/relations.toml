schema = 1

# 关系只消费当下世界事实，不把目标卡资格或预算偏好视为已执行。
# 以下是已生效公校法、实际制度存在与识字状态的现实互补；
# 不能据此断言识字由这项法律造成，也不代替制度投资或具体研究消费者。

[[relations]]
source = "industrial_foundation"
target = "education_and_research"
kind = "complements"
strength = 0.025
scope = "root"
# 已有公校制度且当前识字达标时，知识基础支持有限生产配置。
# 同一实际制度在低识字时不会提前获得这项知识基础贡献。
condition_facts = ["current_public_schools", "schools_present", "literacy_ready"]
unknown_policy = "vanilla"
cause_id = "school_knowledge_foundation"
origins = ["current_public_schools", "schools_present", "literacy_ready"]

[[relations]]
source = "education_and_research"
target = "industrial_foundation"
kind = "complements"
strength = 0.025
scope = "root"
# 已有公校制度但当前低识字时，存在可投入的教育渠道；
# 在既有负方向教育项内增加有限政府配置偏好，实际支出仍由原版决定。
# 识字达标后来源教育项及本贡献退出；未知只撤回本关系增量。
condition_facts = ["current_public_schools", "schools_present", "literacy_low"]
unknown_policy = "vanilla"
cause_id = "school_education_channel"
origins = ["current_public_schools", "schools_present", "literacy_low"]
