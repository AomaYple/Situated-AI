why = "当前只保留已完成评分通道复核的中立偏置：财政危机叠加战争，或作为发起方、目标方、承诺参与方及尚未选边的合法参与方暴露于外交博弈时，提高第三方中立倾向。未决定参与表示风险暴露，不表示已经承诺。aggression 的自然机会分母和单字段反事实出口尚未具备，因此生产值为0并不会写入默认策略；保留字段仅用于版本兼容和隔离实验。保留原版持牌、国家身份和防御选择，不改财政/IG/法律/军力。"
