# The existing observed knowledge relation projects into a separate physical
# construction consumer only when its own actual industrial need is proven.
# Its dimensionless strength becomes a multiplier delta, not extra output,
# employment, qualifications or a completed education/industrial action.
[[uses]]
source = "mod/decisions/information.toml"
definition = "remaining_industrial_construction_need"
port = "education_production_feedback"
role = "relation"
selector = ["current_public_schools", "schools_present", "literacy_ready"]
relation_cause = "school_knowledge_foundation"
output_unit = "multiplier_delta"
dependency_domain = "political"

