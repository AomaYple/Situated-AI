# A3 最小现实纵切；compiler 将这些 guard 绑定具体生产 rule/card term。
# 完整 reader 身份来自现有 information/adapters policy，禁止自由 PDX 或 caller alias。
# 成本 unknown 不生成检测器：共同程序 if proven_cheap else conservative。
schema = 1

[limits]
nodes = 32
depth = 6
expanded_leaves = 16
evaluation_cost = 64

[ports.literacy_low]
domain = "education"
entity = "root"
entity_kind = "country"
unit = "flag"
direction = "need"
refresh = "consumer"
unknown = "vanilla"
cost = 1
reader_source = "mod/decisions/information.toml"
reader_key = "literacy"
op = "<"
value = 0.5
[ports.literacy_low.reader]
engine = "literacy_rate"
scope = "root"
unit = "ratio"
kind = "number"
minimum = 0
maximum = 1
path = []
parameters = []

