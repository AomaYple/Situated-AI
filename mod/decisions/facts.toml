schema = 1

# 行动内核只登记已在 1.14.5 生产接线中核实过的根国家事实。
# trigger 是生成期降低用的原版条件；unknown 不等于零值，未知时保留原版消费者。
[facts.is_ai]
domain = "identity"
source = "common/ai_strategies/00_default_strategy.txt"
scope = "root"
kind = "boolean"
unit = "flag"
refresh = "consumer"
unknown = "vanilla"
trigger = "is_ai = yes"

[facts.peace]
domain = "military"
source = "common/ai_strategies/00_default_strategy.txt"
scope = "root"
kind = "boolean"
unit = "flag"
refresh = "shock"
unknown = "vanilla"
trigger = "is_at_war = no"

[facts.war]
domain = "military"
source = "common/ai_strategies/00_default_strategy.txt"
scope = "root"
kind = "boolean"
unit = "flag"
refresh = "shock"
unknown = "vanilla"
trigger = "is_at_war = yes"

[facts.default]
domain = "fiscal"
source = "common/ai_strategies/00_default_strategy.txt"
scope = "root"
kind = "boolean"
unit = "flag"
refresh = "shock"
unknown = "vanilla"
trigger = "in_default = yes"

[facts.no_default]
domain = "fiscal"
source = "common/ai_strategies/00_default_strategy.txt"
scope = "root"
kind = "boolean"
unit = "flag"
refresh = "shock"
unknown = "vanilla"
trigger = "in_default = no"

[facts.stable_legitimacy]
domain = "political"
source = "common/ai_strategies/00_default_strategy.txt"
scope = "root"
kind = "boolean"
unit = "flag"
refresh = "monthly"
unknown = "vanilla"
trigger = "AND = { legitimacy >= 0 legitimacy <= 100 legitimacy >= 50 }"

[facts.strong_legitimacy]
domain = "political"
source = "common/ai_strategies/00_default_strategy.txt"
scope = "root"
kind = "boolean"
unit = "flag"
refresh = "monthly"
unknown = "vanilla"
trigger = "AND = { legitimacy >= 0 legitimacy <= 100 legitimacy >= 75 }"

