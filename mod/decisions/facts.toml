schema = 1

# 行动内核只登记已在 1.14.5 生产接线中核实过的根国家事实。
# trigger 是生成期降低用的原版条件；unknown 不等于零值，未知时保留原版消费者。
[facts.is_ai]
domain = "identity"
source = "common/ai_strategies/00_default_strategy.txt"
scope = "root"
kind = "boolean"
unit = "flag"
refresh = "consumer"
unknown = "vanilla"
trigger = "is_ai = yes"

[facts.peace]
domain = "military"
source = "common/ai_strategies/00_default_strategy.txt"
scope = "root"
kind = "boolean"
unit = "flag"
refresh = "shock"
unknown = "vanilla"
trigger = "is_at_war = no"

