[[localization]]
key = "je_sitai_sp_empire_remnant_window"
english = "The Empire's Remnant: A Window for Reform"
simp_chinese = "帝国残骸：改革窗口"
why = "G3 要求试玩者能复述「当前目标 + 主因」。标题只写目标（改革窗口）与来由（帝国残骸），不写机制 —— 与既有六份并列时，这个标题一眼能分出是「**帝国没了、本土还在打内战**」这一种处境（既不是打输了、内部裂开、被人撬开门，也不是破产或被两边夹住）。"

[[localization]]
key = "je_sitai_sp_empire_remnant_window_reason"
english = "The throne was fought over, and the bill is still on the table. The empire that used to pay for everything is gone — what is left is Cuba, the Philippines and a few garrisons — so the war was fought on borrowed money, and the money is dear. The church that blessed the other claimant has had its lands sold to pay for it; the army that both sides had to lean on now stands in the middle of the room.\\n\\nA window is open: while the crown's authority is torn in two and the church that blocked every reform has lost its grip, the men who spent the war arguing for a modern state can push through what the old order spent decades blocking. It closes again once the crown stands on its own."
simp_chinese = "王位是打出来的，账单还在桌上。从前替这个国家出钱的那个帝国已经没了 —— 剩下的只有古巴、菲律宾和几处驻防地 —— 所以这场内战是借钱打的，而借钱的价钱很贵。给另一位王位争夺者加冕的教会，教产已经被卖掉抵了战费；两派都不得不倚靠的军队，如今就站在屋子正中。\\n\\n窗口已经打开：王冠的威信被撕成两半、一直拦着改革的教会又失了势之时，那些在战争里一直主张建立一个现代国家的人，可以把旧秩序拦了几十年的东西推过去。等王冠重新自己站住，这扇窗就会关上。"
why = "三行解释里的「最大压力与阻力」写在这里（P11 可观测）：压力 = **王位被两头撕**（合法性）+ **为打仗变卖教产、教会失势** + **军队坐大** + **帝国残骸撑不起一场内战、只能借贵钱**，阻力 = 「等王冠重新自己站住」—— 与 `complete` 的 `legitimacy >= 75` 是同一条判据的两种说法，数值改了文案也要改（P9：改一处、三处同步）。第二句刻意把 `country_loan_interest_rate_add` 的语义翻成人话（「这场内战是借钱打的，而借钱的价钱很贵」），并**把「帝国没了」与「内战」这两件事分开写**，因为「帝国残骸的后果」与「内战的代价」的区分是本档案的判据核心；文案里不出现「战败」「革命」「被打穿」「被两边夹住」这些别份档案的词。"

[[localization]]
key = "sitai_sp_empire_remnant_pressure"
english = "The Empire's Remnant"
simp_chinese = "帝国残骸"
why = "静态修正的名字（键 = 修正名）。玩家在修正列表里看到的就是这一行，所以写「帝国残骸」而不是机制名，也不写「合法性 -35 / 借债 +0.35」。原版同族写法见 ip4_misc_01_l_simp_chinese.yml 的 modifier_regency_landowners；同族的原版修正名可参照原版这场内战的 `carlist_war_guerilla_warfare`、`spa_carlist_terror_expenses`（common/static_modifiers/00_ip4_04_modifiers.txt:345 与 :416）这一族。"
[[localization]]
key = "sitai_sp_reform_inputs"
english = "Reformers Gain Influence"
simp_chinese = "改革派抬头"
why = "第二处修正同样要文案，否则它挂在国家上时在修正列表里是一行空名（闸门 ② 也会点名缺键）。写「改革派抬头」而不是「知识界/小资产阶级政治力量 +50%」：玩家看到的应当是处境，不是我们的字段名。与既有六份同键名同文案是有意的 —— 这一处表达的是**同一件事**（改革侧输入被抬起来），不是六种处境。"

# ── ⑦ 三行解释（P11 / G3）──────────────────────────────────
#
# 与 `tr_defeat` / `au_revolution` / `eg_debt` / `pe_great_game` 同款：三行接进 JE 说明后
# 才真的上屏，所以 `[panel]` 与上面那条 `<JE 名>_reason` 必须**同时**存在（生成器会报错点名）。
# ⚠️ 三行的本地化键（`<JE 名>_goal` / `_pressure` / `_last_change`）由生成器**派生**，
# 不在这里手写 `[[localization]]` —— 写了就会与派生出来的那三条**重键**（P9 的反面）。
[panel]
why = "三行是 G3 的判据载体：目标 / 最大压力与阻力 / 上次改主意的原因。放同一张表是为了让「缺哪一行」当场可见（生成器要求三行齐全，缺一行即退 2）。"

[panel.goal]
english = "Current goal: while the throne is discredited and the church has lost its grip, push through the reform that would put this country back together."
simp_chinese = "当前目标：趁王位威信扫地、教会又失了势的时候，把那套能把这个国家重新拼起来的改革推过去。"
why = "第一行 = **当前目标**。写「把这个国家重新拼起来」而不是点名某条法律：改哪条法由 AI 与原版牌池决定（§0「让 AI 自己推导」），而这正是 01a §K 给西班牙推出的最优解原文「**保住残存帝国 + 内部整合**」（docs/design/01a-依据与参考.md:279）里那半句「内部整合」。这一行与 `[pressure.effects]` 里减教会的那一条是同一个因果的两端。"

[panel.pressure]
english = "Biggest pressure and resistance: pressure — the throne is torn between two claimants, the church that blessed the other one has had its lands sold to pay for the war, the army both sides leaned on now stands in the middle of the room, and with the empire gone the war could only be fought on borrowed money; resistance — the crown standing on its own again."
simp_chinese = "最大压力与阻力：压力 = 王位被两个争夺者撕着、给另一边加冕的教会连教产都被卖掉抵了战费、两派都倚靠的军队如今站在屋子正中、帝国没了这场仗只能借钱打；阻力 = 等王冠重新自己站住。"
why = "第二行 = **最大压力与阻力**。压力项与 `[pressure.effects]` 的四条字段一一对应（合法性 / 教会 / 军队 / 借债），并且**按本档案的判据把两类东西分开写**：前三条是**内战**的（王位之争、卖教产、军队坐大），最后一条是**帝国残骸**的（没有帝国收入只能借贵钱）—— 这一行是玩家唯一能读到这条区分的地方，所以两句都要在。阻力项与 `complete = { legitimacy >= 75 }` 是同一条判据的两种说法 —— 数值改了这行也要改（P9：一处改、三处同步）。"

[panel.last_change]
english = "Why it changed its mind: because the civil war and the lost empire were written into the books — a throne split two ways, and a war that had to be paid for with borrowed money, are what moved the inputs the AI reads."
simp_chinese = "上次改主意的原因：因为这场内战与没了帝国的这件事被记进了账 —— 是「王位被两头撕、仗只能借钱打」这两件事挪动了 AI 读到的那些输入。"
why = "第三行 = **上次改主意的原因**（G3 里最容易被跳过、却最关键的一行）：没有它，玩家只能看到「它在改革」，看不到「**为什么是现在**」。与既有六份的区别正在这里：ru/tr 的起点是「外部打进来」，au 是「内部裂开」，cn 是「被人撬开门」，eg 是「钱不是自己的了」，pe 是「被两边夹着」—— 本档案的起点是「**帝国已经没了，本土还在为谁来当国王打仗**」，玩家从这一行读得出因果链的起点。"

# ── ⑧ 递牌：本档案一张都不递 ───────────────────────────────
[cards]
why = "**为什么是零张，以及为什么这次的零张是判据性的（不是「懒得写」）** —— 有判据可写的递牌法是 `ru_defeat` 那一套：「窗口开时递进步牌、窗口关时递回**该国 1836 年的初始政治牌**」（见 `ru_defeat.toml` 的 `[journal_entry.signals]`）。它对西班牙**写不出来**，理由是查实过的：`common/history/ai/00_strategy.txt` 里一共 27 个具名国家块（:22 的 `c:SWE` 一直排到 :171 的 `c:MON`，其中 :87-91 是 `c:RUS`），**没有 `c:SPA` 块**；西班牙在这个目录里只出现一次，且是一句「没有秘密目标」—— common/history/ai/00_secret_goals.txt:278-281 的 `set_mutual_secret_goal = { country = c:SPA  secret_goal = none }`（:279 是那一行 `country = c:SPA`、:280 是 `secret_goal = none`）。照抄俄国那三行（:87-91）就等于把西班牙递到一个它从没站过的路线上 —— 那不是「让 AI 自己推导」，是我们替它选。查不到初始落点就不递牌，比递一张编的牌诚实（与 `au_revolution`、`pe_great_game` 同一种情况）。**另外两条判据性的理由**（即使将来查到了落点，也要先过这两条）：① **实验要能归因**：本档案的 `[pressure]` 与 `[reform_inputs]` 是**两处可分两处可关**的处理段，再叠一层递牌就等于在同一个实验单元里同时动世界状态与意图层，出了差分也说不清是哪一层起的作用（这正是 `阶段5-批次1-结果.md` §二·补 那条读数最需要保持干净的变量）；② **同一件事不占两个通道**（F5：能改世界就不占槽）：`[reform_inputs]` 抬的正是原版 `ai_strategy_progressive_agenda` 所读的那两个 IG（common/ai_strategies/03_political_strategies.txt:528-544），意图位移已经由**世界状态**产生；再递一张牌是用第二个通道做同一件事，而那个通道有价格（每国同时只有一张政治牌在用，阶段 2 实测 1.05%/国·月；S≈33 时权重 10 吃掉 23% 的份额）。⚠️ 这两条是**排序**判断，不是「递牌不可能」：等本档案有了一次「只动世界状态」的 A/B 读数（G-EXIT-5.2/5.3），再决定要不要加那一层 —— 到那时落点得先在原版里找到（`c:SPA` 块不存在这件事就是那时要解决的第一件事）。**一张都不递**比在能写判据的地方硬塞一张、把一个可归因的实验单元搅浑要诚实。"

