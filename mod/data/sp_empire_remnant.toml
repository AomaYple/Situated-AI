# ── ⑩ 探针口径（B80：本档案盯哪条法）────────────────────────
#
# 为什么要有这张表：探针的行为层②原来写死 `NOT = { has_law = law_type:law_serfdom }`，
# 而**对没有农奴制的国家它立刻为真** ⇒ 会报出一个假的「法律换了」（奥斯曼/埃及实测踩到）。
# 现在按档案声明：查实了就写，没查实就留空（留空时那条判据**不产出**）。
[probe]
why = "西班牙的开局土地法是**伊比利亚专有的那一条** `law_latifundias` —— 依据：`common/history/countries/spa - spain.txt:35` 的 `activate_law = law_type:law_latifundias`（逐行打开确认；同块还有 :30 的 `law_state_religion`、:41 的 `law_oligarchy`）。该法属于 `lawgroup_land_reform`（common/laws/01_land_reform.txt:238 的 `group = lawgroup_land_reform`），且原版在文件里明写它是伊比利亚专用变体：common/laws/01_land_reform.txt:236 的注释 `# Special tenant farmer variant for Iberia`。**为什么它正好能当「改革真的发生了」的判据**：这条法本身就是大土地所有者的法 —— 它给 `country_aristocrats_pol_str_mult = 0.4`（common/laws/01_land_reform.txt:268），也就是本档案压着的那条守旧线的制度底座；它被换掉，就是「土地法真的动了」。⚠️ **B80 的教训在这份档案上会立刻应验**：如果照抄俄/大清的 `law_serfdom`（或波斯的同一条），西班牙**没有**农奴制、开局是 latifundias ⇒ 那条判据当场为真，报出一个假的「法律换了」（奥斯曼/埃及就是这么踩到的）。⚠️ 一处需要说清的边界：同组里还有一条 `law_expanded_latifundias`（common/laws/01_land_reform.txt:291 的注释 `# Special tenant farmer variant for Iberia (Upgraded by JE)`、:292 是法名），它是原版自己的 JE 升级路径；探针渲染出来的是 `NOT = { has_law = law_type:law_latifundias }`（tools/pdx/ab_probe.py:852-867，渲染 `law_changed` 的那个块），所以升级到那一条也会让判据为真 —— 那是土地法确实被换过的另一种形态，**本档案不额外排除它**（排除要靠块形式判据，本 schema 表达不出来，见 `[journal_entry]` 的 conditions 那两条 why）。　【牌口径 · B86】`reform_card` =「意图层动没动」看哪张牌（判据是它**出现过**）：本档案开局那张政治牌不是它（八份逐份核过 common/history/ai/00_strategy.txt —— AUS/EGY 是 conservative、RUS 是 reactionary、TUR/CHI/PER/SPA/BAV 没有块），所以它出现就是真的位移。"
reform_law = "law_latifundias"
reform_card = "ai_strategy_progressive_agenda"
