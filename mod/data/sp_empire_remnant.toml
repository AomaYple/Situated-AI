# 档案数据源 · 西班牙 单国「帝国残骸与内战」（阶段 5 的第五种失败模式）
#
# ⚠️ 为什么要有这一份：已入库的六份里**没有「帝国残骸 + 内战」这种失败模式**。
#   `ru_defeat` / `tr_defeat` 是「战败」（外部敌人打进来）、`au_revolution` 是「革命潮」
#   （多民族帝国从内部裂开）、`cn_intervention` 是「列强干涉」（海上被一次打穿）、
#   `eg_debt` 是「破产」（财政主权被债主拿走）、`pe_great_game` 是「被两强夹击」
#   （陆上长期双向挤压）。西班牙这一份不是它们任何一个换个名字：
#
#     * **帝国已经丢光，本土还在打**。1836 年的西班牙不是「正在丢殖民地」，是**已经丢了**：
#       原版自己的用词就是「重新建立 / 再征服」—— `je_reconquista` 的五个按钮全叫
#       `button_reestablish_*`（common/journal_entries/06_spanish_new_world.txt:110 是 JE 名、
#       :115-119 是那五个按钮），而 `je_hispanoamerica` 数的是**已经存在**、带着
#       `modifier_not_recognized_by_spain` 的美洲国家（同文件 :181-204）。原版还顺手说了
#       帝国剩下什么：开局那场王位内战的外交博弈要「解决」的对象就是
#       `c:CUB` / `c:PHI` / `c:PCO`（common/history/diplomatic_plays/00_carlist_war.txt:20-22）
#       —— 古巴、菲律宾、波多黎各，就是 1836 年西班牙还攥着的那几块。
#     * **王位被两头撕**。开局就有一场王位内战在打：`first_carlist_war` 外交博弈
#       （common/history/diplomatic_plays/00_carlist_war.txt:3-12，:11 是 `type = dp_revolution`、
#       :9 是 `annex_as_civil_war = yes`），战争本体挂在 `je_the_first_carlist_war` 上
#       （common/journal_entries/06_the_carlist_wars.txt:1）。
#     * **原版把战争的账记得很细，战后的账一个字都没有**。战争期间有游击战修正
#       （`carlist_war_guerilla_warfare`，common/static_modifiers/00_ip4_04_modifiers.txt:345-350）、
#       有卡洛斯恐怖开支（`spa_carlist_terror_expenses`，同文件 :416-419）；战争一结束，
#       `on_complete_all_involved` 把这一整套**逐一撤掉**（06_the_carlist_wars.txt:136-213，
#       :145 连开局写死的 `set_immune_to_revolutions = yes`（common/history/countries/spa - spain.txt:82）
#       也改回 `no`），只给胜方挂一个 20 年递减的**奖励**
#       （同文件 :129-133 的 `carlist_war_spa_reward`，事件侧同一笔见
#       events/iberia_events/carlist_war_events.txt:240-245）。也就是说：
#       **谁赢了这一仗原版记；赢了之后这个国家靠什么活，原版不记** —— 帝国没了、内战打完了，
#       合法性照旧、教会与军队的势力照旧、财政照旧，世界回到基线。本档案补的就是这一格。
#
# 口径（P9 单一数据源 / P10 每个数字有依据 / F10 生成器优先）：
#
#   * 产物（`mod/` 下的脚本、本地化、档案文档）**全部由 `v3 modgen` 从本文件生成**，
#     手改产物没有用 —— 下次生成会被覆盖，闸门 ④ 也会报红；
#   * **每一张表都必须带非空 `why`**（数字、判据、文案、容器表一律如此）：空 `why` 由
#     `v3 modgen` 当场报错、闸门 ⑤ 复核 —— 这是 P10 从「纪律」变成「可执行检查」的那一步；
#   * 数字一律写成 `amount = N`（同表内配 `why`），缩写形式只有一个来源，
#     `why_report()` 与闸门 ⑤ 才能机械地枚举「每个数字 + 它的依据」。
#
# 为什么是 TOML：Python 3.11+ 标准库自带 `tomllib`，不新增依赖（P4），
# 而它同时有「表」与「数组」两种结构，正好表达「一组带依据的条目」。
#
# 本档案只做一件事：把**帝国残骸与内战**变成真实世界状态（A 级：变量 + 修正 + JE），
# 让原版自己的权重公式转向改革。**一张牌都不递**（见 `[cards]`）。
#
# 为什么**没有** `[tempo]`、也**没有** `[difficulty]`：这两张都是 **mod 级**表
# （`defines` 没有单国写法；难度三档是对外契约，档位集合由生成器钉死），全仓各只允许
# 一份 —— 「恰好一份」由 `_check_tempo`（tools/pdx/modgen.py:1635-1653）与
# `_check_difficulty`（tools/pdx/modgen.py:1609-1632）在全仓范围上当场判死。
# 那两份都在 `ru_defeat.toml` 里。本档案**复用**它们，不复制。

schema_version = 1

[archive]
id = "sp_empire_remnant"
title = "西班牙 · 帝国残骸与内战"
country = "SPA"
# 档案对哪个引擎版本有效（写进 mod 元数据的 supported_game_version）。
# 钉住 1.14.3 = 阶段 2 三次探针局与本仓库知识库的口径版本；官方升级后
# 闸门 ①/② 会先红（原版键名变了），届时改这里而不是改产物。
game_version = "1.14.4"
why = "**修的是什么毛病**：原版 1.14.3 对这场王位内战**记账记到战争结束那一刻为止**。开始与结束都有账：开局就有一场外交博弈 `first_carlist_war`（common/history/diplomatic_plays/00_carlist_war.txt:3-12，:11 是 `type = dp_revolution`、:9 是 `annex_as_civil_war = yes`），战争本体挂在 `je_the_first_carlist_war`（common/journal_entries/06_the_carlist_wars.txt:1，weight 10000 见 :216）；结束时 `on_complete_all_involved` 把战争期间的所有修正**逐一撤掉**（同文件 :136-213，:145 连开局写死的 `set_immune_to_revolutions = yes`（common/history/countries/spa - spain.txt:82）也改回 `no`），只给胜方挂一个 20 年递减的**奖励**（同文件 :129-133 的 `carlist_war_spa_reward`）。**战后的账没有**：帝国已经丢光（1836 年只剩古巴、菲律宾、波多黎各 —— 原版开局那场博弈要解决的对象就是 `c:CUB` / `c:PHI` / `c:PCO`，common/history/diplomatic_plays/00_carlist_war.txt:20-22；`PCO` 就是波多黎各：common/country_definitions/00_countries.txt:2763 是 `PCO = {`、:2771 是 `capital = STATE_PUERTO_RICO`），本土打完一场王位内战后，合法性靠什么重新站起来、教会与军队的势力各自落到哪里、这笔打仗的钱怎么还 —— 这三件事在原版里一个字都没有。本档案不替 AI 决定改什么，只把这笔账记成真实世界状态（记忆变量 + 四条压力 + 一条改革侧输入），让原版自己那张**读改革派 IG 的**权重公式（`ai_strategy_progressive_agenda`，common/ai_strategies/03_political_strategies.txt:528-544）自己转向。**为什么主角是西班牙**：01a §K「西班牙」那一行（docs/design/01a-依据与参考.md:279）写的是**帝国残骸、卡洛斯战争、教会与军队势力强**，外部是**殖民地所剩无几、英法主导拉美、摩洛哥机会**，推出的最优解是**保住残存帝国 + 内部整合**（有限北非扩张）—— 这是一份以「帝国没了、本土还在打」为机制的档案。主角身份**本机实测确认**（不是猜）：tag = `SPA`（common/country_definitions/00_countries.txt:429 的 `SPA = {`，该文件的顶层键就是国家 tag），`country_type = recognized`（:436）、`tier = kingdom`（:438）、`cultures = { spanish }`（:440）、`capital = STATE_NEW_CASTILE`（:441）。⚠️ **与既有六份的结构差别（这一条会直接影响探针）**：西班牙开局的土地法是**伊比利亚专有的那一条** `law_latifundias`（common/history/countries/spa - spain.txt:35），不是俄/大清的农奴制、也不是奥地利的庄园制 —— 照抄 `law_serfdom` 会让判据当场为真、报出假的「法律换了」（详见 `[probe]`）。⚠️ 依据已于 2026-09-22 更正（沿用既有六份的共同结论）：原版 212 处 has_journal_entry 全部硬编码具名 JE，没有「读任意 JE」的通用谓词 ⇒ 我们自己的 JE 一张原版牌也喂不到（backlog B52）；真正把压力变成意图位移的通道是递牌（set_strategy，B58）与法律承诺（law commitment，B56/B57）—— 本档案一条都不用，理由见 `[cards]`。　【沿用·口径】本表的数值**原样沿用** `ru_defeat.toml` 的实测档位（阶段 3 的 A/B 读数），**未针对本条处境独立校准**；本档案**独立取字段**的有三处（教会、军队、改革侧输入落在小资产阶级），字段名与档位都取自原版自己的西班牙内容，见各自的 why。"


# ── ② 内战与帝国残骸的记忆：真实世界状态的第一步 ──────────────
# 为什么字段名叫 memory 而不是「帝国残骸记忆」：schema v1 的这张表就是「处境发生过」
# 的那张账（变量 + 写它的效果），本档案往里记的是**这场王位内战 + 帝国已经丢光**。
[memory]
variable = "sitai_sp_empire_remnant_memory"
effect = "sitai_sp_empire_remnant_shock"
why = "记忆本身不产生任何数值效果 —— 它是**判据**：JE 的 is_shown_when_inactive / possible 读它，于是「这场内战与帝国残骸已经发生过」变成可查的世界状态（阶段 1 已证：牌直接读 has_variable）。**谁把这件事判成这件事，本档案不猜、也确实不能猜**：原版记这场内战结束的地方不是任何一个 on_action，而是 JE 自己的 `complete`（common/journal_entries/06_the_carlist_wars.txt:89-97 的 `NAND = { exists = c:SPC  exists = c:SPA }`）加 `on_complete_all_involved`（:99）；`on_war_end` 只给 actor / target、不带胜负（common/on_actions/00_code_on_actions.txt:7043），而 `on_civil_war_won`（同文件 :5772）管的是**叛乱型内战**，不是这场以 `dp_revolution` 外交博弈开打的王位战争（common/history/diplomatic_plays/00_carlist_war.txt:11）。所以判定留在**施加方**：`sitai_sp_empire_remnant_shock` 由调用方显式执行，本档案**不绑任何 on_action**（与 tr/au/eg/pe 同口径：A/B 实验要求两处处理段能分开施加、单独关掉，绑上就等于替 AI 决定「什么时候算打完」）。　【沿用·口径】判据形状沿用 `ru_defeat.toml`（变量 + 显式冲击效果），**未针对本条处境独立校准**；「原版用 JE 的 complete 而不是 on_action 记这场战争的结束」是本机实测结论（命令见上面那一串文件与行号）。"

[[memory.params]]
key = "value"
amount = 1
why = "变量在判据里只被 has_variable 读，值不参与任何运算；写 1 而不是 yes，是为了将来要用 change_variable 记「第几场内战」时不用换类型（原版 `set_variable = { name = recently_had_war value = yes }` 用的是 yes，见 common/on_actions/00_code_on_actions.txt:7046）。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

[[memory.params]]
key = "days"
amount = 3650
why = "10 年，与压力修正的 `years = 10` 同一时间尺度（两处必须一起改，否则会出现「记忆还在、压力已经没了」的半截状态）。**这个尺度在西班牙身上有原版先例**：原版给内战胜方的奖励是 `years = 20`（common/journal_entries/06_the_carlist_wars.txt:129-133 的 `carlist_war_spa_reward`，`is_decaying = yes`）—— 也就是说原版自己认为「内战留下的东西」要按**十年到二十年**计；对照原版给 `recently_had_war` 的 `days = 1825`（5 年，common/on_actions/00_code_on_actions.txt:7048），本档案取十年，恰好落在原版这场战争的两档之间。　【沿用·口径】3650 **沿用 `ru_defeat.toml` 的实测档位**（该值在其 why 里写作「战败比打过仗更该留得久，故取两倍」），**未针对本条处境独立校准**；这里只是换了一条更贴题的原版先例来支撑同一个数。"

# ── ③ 压力：真实的合法性 / 教会 / 军队 / 财政（A 级）──────────
#
# 四条字段表达的是**两件不同的事**，不许混读（这是本档案的判据核心）：
#   * 合法性 -35      = **内战的代价**（王位被两头撕：一边是伊莎贝尔，一边是卡洛斯）；
#   * 教会 -0.30      = **内战逼出来的那一刀**（为筹战费变卖教产 → 一直拦着改革的
#                        那一侧被削掉）—— 这是窗口之所以开的原因；
#   * 军队 +0.25      = **内战让军队坐大**（两派都必须倚靠它）—— 这是窗口里的**阻力**；
#   * 借债 +0.35      = **帝国残骸的后果**（殖民地收入早就没了，内战只能借钱打）。
[pressure]
name = "sitai_sp_empire_remnant_pressure"
icon = "gfx/interface/icons/timed_modifier_icons/modifier_rifle_negative.dds"
why = "压力必须是真的世界状态，不是我们的私有计数器 —— 只有真实变化才会进原版自己的公式（01a D 节：A 级被严重低估）。**这张表与既有六份的差别**：它不是把 ru/tr 那三条换个国家名再写一遍 —— ① 守旧侧换成了**教会**（devout），理由是西班牙的开局政府里**地主、虔诚派、军队三个 IG 同时在朝**（common/history/countries/spa - spain.txt:67-78），而这场内战把「教产还给教会还是卖掉打仗」变成了二选一（原版两侧的修正都写着：`spc_church_restitution` 给 devout +0.25，common/static_modifiers/00_ip4_04_modifiers.txt:442；伊比利亚另一侧卖教产的写法是同文件 :141 的 `-0.25 # Selling church lands`）；② 多出**军队**这一条（原版摄政那一族给在朝 IG 的档就是 +0.25，同文件 :54）—— 因为 01a §K 那一行明写「**教会与军队势力强**」，只压教会不写军队等于少写一半；③ 财政那条在 why 里写明它是**帝国残骸的后果**而不是内战的代价。**icon 取 `modifier_rifle_negative.dds`**：原版给这场内战本身的修正（`carlist_war_guerilla_warfare`）用的就是它（common/static_modifiers/00_ip4_04_modifiers.txt:346），同族的 `national_guard_preoccupied`（:389 的 icon 行）也在同一支上 —— 方向一致，且这张图就是「这场战争」的图。⚠️ **本表与 [reform_inputs] 都是实验用直接修正，不是正式版设计**：它们由施加冲击的一方显式调用（不绑任何 on_action，调用点是 scripted effect `sitai_sp_empire_remnant_shock`）；正式版必须改成真实触发 + 因果链（内战 → 变卖教产与借债 → 军队坐大 → 合法性长期分裂），那条已进 backlog（B35）。本定位同时写在 exec/阶段3-结果.md 与 exec/阶段3-归档清点.md，避免后人把实验设置当成档案设计。　【沿用·口径】**四条里两条的数值沿用 `ru_defeat` 的实测档位（-35 / -0.30），未针对本条处境独立校准**；另两条是原版档位本身（+0.25 军队 / +0.35 借债中的 0.35 仍属沿用，见各条 why）。"

[[pressure.params]]
key = "years"
amount = 10
why = "与 sitai_sp_empire_remnant_memory 的 `days = 3650` 对齐，也与原版给内战胜方的 20 年奖励同尺度（common/journal_entries/06_the_carlist_wars.txt:129-133）。原版 `add_modifier` 用 `years` 的写法见 common/scripted_effects/00_movement_effects.txt:2-4（`add_modifier = { name = … years = 20 }`）。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

[[pressure.effects]]
key = "country_legitimacy_base_add"
amount = -35
why = "**这一条是「内战」的代价**（四条里唯一的那个「代价」）：王位被两头撕 —— 一边是伊莎贝尔，一边是卡洛斯，两边都能指着自己说「我才是合法的」。合法性是开窗判据的一半（JE 的 possible 读 `legitimacy <= 75` —— 为什么是 75 见下面 conditions 那条的依据）。**为什么西班牙的合法性就该被这场战争打掉**：原版在这场战争里**一直把合法性当成结算物** —— 它的摄政那一族修正每一档都是 `country_legitimacy_base_add = -10`（common/static_modifiers/00_ip4_04_modifiers.txt:17、:24、:31、:38、:45、:52、:59；**西班牙 1836 用的正是其中一条**：common/history/countries/spa - spain.txt:80 的 `modifier_regency_petty_bourgeoisie`，那一档的 -10 在同文件 :24），战争期间的游击战修正扣的是威望 -25%（`carlist_war_guerilla_warfare`，:349），而战争结束给胜方的又是合法性（`carlist_war_spa_reward` 的 `country_legitimacy_headofstate_add = 25`，:354，同一段 `## Carlist War End` 之下还有 `modifier_government_recently_couped` 的 +50，:461 与 :465）。**为什么取 -35**：它是 `ru_defeat` 在阶段 3 里**实测调过档**的值（先取 -20 跑一整局 B 组、窗口一次都没开 → 提到 -35；复算 `v3 ab --logs ab-run7`，B 段 55 块合法性分档 b70 24 / b75 18 / b80 13），也就是「把水位稳定压出一档、又不让政府一次失能」的那一档；本档案**原样沿用**，没有针对西班牙重跑 A/B。这个数在原版里也真的存在：`modifier_india_crown_rule` 就给 `country_legitimacy_base_add = -35`（common/static_modifiers/content_304_modifiers.txt:249 是修正名、:254 是这个字段），同字段的原版阶梯为 +10 / +5 / -10 / -20（common/static_modifiers/00_code_static_modifiers.txt:322、:331、:343、:353）与 -50（同文件 :986）—— -35 落在 -20 与 -50 之间，方向与档位都不是我们发明的。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（-35），未针对本条处境独立校准**；原版同字段另有 -35（content_304_modifiers.txt:254）与 -50（00_code_static_modifiers.txt:986）两档可引。"

[[pressure.effects]]
key = "interest_group_ig_devout_pol_str_mult"
amount = -0.30
why = "**这一条是「内战」逼出来的那一刀，也是窗口之所以开的原因**：要打这场内战就得有钱，而自由派那一侧的钱来自**变卖教产** —— 原版自己在开局就把这条线写出来了：西班牙的 `church_and_state` 法组上挂着一条由知识界赞助的修正案，注释写着 `# Mendizabal's confiscations`（common/history/countries/spa - spain.txt:52-58，:56 是那句注释）。**这个字段的原版档位里就有这一件事**：`interest_group_ig_devout_pol_str_mult = -0.25 # Selling church lands`（common/static_modifiers/00_ip4_04_modifiers.txt:141，在 `modifier_devorismo` 里；那一条由伊比利亚另一侧的葡萄牙内容施加，见 common/journal_entries/06_portugal_politics.txt:15 —— 本档案借的是那个字段与那句注释的语义，不假称它是西班牙自己的修正）。反方向也写在原版里：卡洛斯派赢了就把教产还回去 —— `spc_church_restitution` 给 devout +0.25、`country_clergymen_pol_str_mult = 0.25`，还带一条 `country_two_spains_conservative_drift_add = 0.1`（同文件 :439-446，:442 是 devout、:445 是那条 drift）。也就是说**教会的势力在内战里就是被争夺的那样东西**，本档案只是把「自由派那一侧赢了这一段」记成账：教会失势 = 那个拦着改革的一侧被战争削掉。**为什么取 -0.30**：它是 `ru_defeat` 实测调过档的值（-0.15 在一整局里没能让行为层动起来 → -0.30），本档案**原样沿用**；-0.30 落在原版 -0.25（同文件 :141）与 -0.50（common/static_modifiers/agitators_5_modifiers.txt:616）之间，方向明确、又不把这一侧一次打垮（一次打垮会让议会算术失去张力）。**为什么不是 landowners（既有六份里最常用的那条守旧侧）**：西班牙开局政府里**地主、虔诚派、军队三个 IG 同时在朝**（common/history/countries/spa - spain.txt:67-78），只挑一条时挑的是「内战真正动过的那一条」—— 教会（上面两侧的原版修正都是教会）；而且西班牙的开局土地法本身就是大土地所有者的法（common/laws/01_land_reform.txt:268 的 `country_aristocrats_pol_str_mult = 0.4`），把地主一起压下去会与 `[probe]` 要判的那件事（土地法换没换）纠缠，读出来的差分说不清是哪一层起的。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（-0.30），未针对本条处境独立校准**；换字段的依据是原版自己的西班牙内容（上面那一串行号），**不是实测**。"

[[pressure.effects]]
key = "interest_group_ig_armed_forces_pol_str_mult"
amount = 0.25
why = "**这一条是 01a §K 那半句「军队势力强」的落点，也是本档案与既有六份最不一样的字段**（六份里没有一份动过军队）：内战让军队变成**两派都必须倚靠**的力量 —— 谁在战场上赢，谁就坐稳王位，于是它从「工具」变成「朝堂上的裁判」。**原版自己的证据有三层**：① 西班牙开局的执政联盟里军队本来就在朝，而且带的是**自由主义禁卫军**意识形态（common/history/countries/spa - spain.txt:75-78 的 `ig:ig_armed_forces ?= { add_ruling_interest_group = yes … add_ideology = ideology_liberal_praetorian }`——「禁卫军」这个词就是原版自己对「军队变成政治力量」的命名）；② 原版「摄政」那一族修正的写法就是「合法性 -10 + 给在朝那个 IG +0.25」，军队那一档给的正是一模一样的 +0.25（`modifier_regency_armed_forces`，common/static_modifiers/00_ip4_04_modifiers.txt:54，同族 :26 是小资产阶级、:19 是虔诚派）—— 而**西班牙 1836 正在摄政**（common/history/countries/spa - spain.txt:80 的 `modifier_regency_petty_bourgeoisie`），王位未定正是本处境的处境本身；③ 原版给西班牙自己的「非洲冒险」修正也往同一个方向加（`modifier_african_adventure`，common/static_modifiers/spanish_africa_modifiers.txt:97-100，:99 是 `interest_group_ig_armed_forces_pol_str_mult = 0.1`），同族还有 `compromised_failed_african_campaign` 的 +0.10（:92）—— 方向不是我们发明的，只是档位取的是摄政那一档。**为什么它是「阻力」而不是「窗口」**：军队坐大意味着改革窗口里多一个必须打交道的玩家（这正是「内部整合」在西班牙难做的原因，见 01a §K 那一行的最优解）；本档案不把它写成负值，因为让军队失势不是这场内战的结果 —— 它是赢家。　【原版行号依据】不是实测读数，是原版同族用法（上面那一串行号，逐行打开确认过）；档位 +0.25 就是原版摄政那一族的档（同文件 :54），**没有实测过它对本处境的效果**。"

[[pressure.effects]]
key = "country_loan_interest_rate_add"
amount = 0.35
why = "**这一条是「帝国残骸」的后果，不是内战的代价 —— 这条区分是本档案的判据核心**：美洲的帝国在 1836 年之前就已经没了（原版自己的词是「reestablish / reconquista」：common/journal_entries/06_spanish_new_world.txt:110 的 `je_reconquista` 与 :115-119 的五个 `button_reestablish_*`；`je_hispanoamerica` 数的是已经存在的美洲国家，:181-204），西班牙 1836 年手里只剩古巴、菲律宾、波多黎各（原版开局那场王位博弈要解决的对象就是 `c:CUB` / `c:PHI` / `c:PCO`，common/history/diplomatic_plays/00_carlist_war.txt:20-22；`PCO` = 波多黎各，common/country_definitions/00_countries.txt:2763 与 :2771）⇒ 本土没有帝国收入可支应内战，只能借债 ⇒ 借债成本被抬高。**为什么不用原版自己那条内战开支的数字**：原版把这场战争的开支记在 `spa_carlist_terror_expenses`（common/static_modifiers/00_ip4_04_modifiers.txt:416-419，icon 是 `modifier_coins_negative.dds`）里，用的是 `country_expenses_add = 1`（:418）—— 本档案**刻意不取那个数**：同一字段在原版里从 0.1 一路写到 57700（common/static_modifiers/agitators_6_modifiers.txt:357 = 0.1、common/static_modifiers/02_event_modifiers.txt:651 = 57700、common/static_modifiers/106_modifiers.txt:247 = 1500），近一百处取 1 ⇒ **这个字段的量纲无法从语料里确定**；把一个量纲不明的数塞进压力表，等于让「财政压力到底有没有生效」变成不可判（而不可判的压力是静默失败）。**为什么也不用 eg_debt 那条 `country_loan_interest_rate_mult`**（乘数，原版破产修正用的字段，档位 0.1 / 0.15 / 0.25 / 0.5）：那一族档位**全部属于「金融危机」**（金币储备告罄 0.1、投资者警惕 0.15、财政部动荡 0.25、宣布破产 0.5），没有一档是「战争财政」；本处境的机制是**打一场没有帝国收入支撑的内战**，不是违约 —— 借一个语义不对的原版档位，比退回一个标明「实验取值」的加数更不诚实。**所以这一条退回 `ru_defeat` 的实测档位**：0.2 → 0.35（实测理由：让财政压力在几年内真的能被看见，而不是被收入增长吃掉）。⚠️ 字段侧的口径照 ru/tr/pe：原版**国家修正**那一侧没有档位阶梯 —— 实测 common/static_modifiers 下该字段只有一处全局基准 +0.2（common/static_modifiers/00_code_static_modifiers.txt:12），所以 0.35 是**实验取值**，正式版要按真实的战争公债与教产变卖重算（backlog B35）。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（0.2→0.35），未针对本条处境独立校准**；本处境另外写明它在本档案里承担的是「帝国残骸的后果」而不是「内战的代价」。"

# ── ④ 改革侧输入：把「被内战逼出来的那一侧」也落成真实世界状态（A 级）──
#
# 为什么单独一张表、而不是往 [pressure] 里再加两条字段：阶段 3 的 A/B 阶梯要在**一局
# 之内**分两处施加 —— 先只加冲击（内战与帝国残骸那条账），隔一段才追加这一处。
# 合进同一个修正就没有「只加冲击」的那一段，两段之间的差分无从谈起。
#
# 为什么是知识界 + 小资产阶级（而不是 ru/tr 的工业家 + 知识界）：**这是原版自己
# 对「这场内战里谁是改革侧」的回答** —— 内战胜方的那条奖励修正里写的就是这两个 IG
# （common/static_modifiers/00_ip4_04_modifiers.txt:355 知识界 +0.25、:357 小资产阶级 +0.25），
# 而卡洛斯派赢的那条把这两个 IG 各扣 0.25（同文件 :367 与 :368）。加上 01a §K 给西班牙的
# 行政槽是 `agricultural_expansion`（不是 `industrial_expansion`），1836 年的西班牙
# 几乎没有工厂 —— 抄俄国的「工业家 +0.5」在这一份里没有依据。
[reform_inputs]
name = "sitai_sp_reform_inputs"
effect = "sitai_sp_reform_input"
icon = "gfx/interface/icons/timed_modifier_icons/modifier_lightbulb_positive.dds"
why = "**定位**：它是「改革派那一侧的输入」的直接修正，用来把 A/B 阶梯的第二处理段做成可施加、可关掉的一处。走 A 级而不是递牌的理由（F5）：原版 `ai_strategy_progressive_agenda` 的权重是**读**这两个 IG 的（common/ai_strategies/03_political_strategies.txt:528-544），改世界状态就等于改它的输入，不占任何槽位。**为什么这两个 IG 就是西班牙的「被逼出来的那一侧」**：原版把内战胜方的奖励**成对写在同一个修正里** —— `carlist_war_spa_reward` 给知识界 `interest_group_ig_intelligentsia_pol_str_mult = 0.25`（common/static_modifiers/00_ip4_04_modifiers.txt:355）与小资产阶级 `interest_group_ig_petty_bourgeoisie_pol_str_mult = 0.25`（:357），同一块里还有 `country_legitimacy_headofstate_add = 25`（:354）；而卡洛斯派赢的那一块（`carlist_war_spc_reward`）把同样这两个 IG 各扣 0.25（:367、:368）—— 也就是说原版自己认为：**这场内战的两侧就是「知识界 + 小资产阶级」对「教会 + 地主」**（后两者的 +approval 在同文件 :365 与 :366）。本档案只是把「自由派那一侧赢了这一段」记成账。⚠️ 正式的因果链应当是「内战 → 变卖教产与借债 → 城市化与识字率的真实位移 → IG 势力自然变化」，而不是直接改政治力量；那条已记进 backlog（B35）。　【沿用·口径】**数值沿用 `ru_defeat.toml` 的实测档位（+0.5/+0.5），未针对本条处境独立校准**；字段组合（知识界 + 小资产阶级）是按原版自己的西班牙内战内容另选的（上面那一串行号）。"

[[reform_inputs.params]]
key = "years"
amount = 10
why = "与 [pressure.params] 的 `years = 10`、记忆变量的 `days = 3650` 三处对齐：三者在实验里是同一段时间窗，任何一处短了都会出现「输入还在、压力已经没了」的半截状态。原版 `add_modifier` 用 `years` 的写法见 common/scripted_effects/00_movement_effects.txt:2-4。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

[[reform_inputs.effects]]
key = "interest_group_ig_intelligentsia_pol_str_mult"
amount = 0.5
why = "知识界是原版自己给内战胜方的那一对之一（`carlist_war_spa_reward`，common/static_modifiers/00_ip4_04_modifiers.txt:355 的 +0.25；卡洛斯派赢时被扣 -0.25，:367）。**为什么取 +0.5 而不是原版那一档的 +0.25**：`progressive_agenda` 的权重只在 `ig:ig_intelligentsia ?= { is_powerful = yes }` 时 +10（common/ai_strategies/03_political_strategies.txt:537-544），而 `is_powerful` 是**相对份额**判定 —— 只抬一档常常翻不过那条线，实验要的是「输入明确到位」，不是「差一点」；`ru_defeat` 的实测档位就是 0.5（本档案原样沿用）。原版同字段档位实测为 0.15（common/static_modifiers/106_modifiers.txt:205）、0.25（common/static_modifiers/00_ip4_04_modifiers.txt:176 的 `modifier_legacy_of_the_liberal_wars`、:355）、0.5（common/static_modifiers/content_1_modifiers.txt:1466 的 `shogun_ig_forced_to_open_market`，与工业家 +0.5 成对写）。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（0.5），未针对本条处境独立校准**；字段本身也是原版西班牙内战内容里的那一对之一。"

[[reform_inputs.effects]]
key = "interest_group_ig_petty_bourgeoisie_pol_str_mult"
amount = 0.5
why = "**这一条是本档案在改革侧与既有六份的差别**（六份用的都是工业家或知识界，没有一份动过小资产阶级）：原版给内战胜方的奖励里，与知识界成对写的正是小资产阶级（`carlist_war_spa_reward`，common/static_modifiers/00_ip4_04_modifiers.txt:357 的 +0.25；卡洛斯派赢时 -0.25，:368），而 1836 年的西班牙几乎没有工厂、01a §K 给它的行政槽是 `agricultural_expansion`（docs/design/01a-依据与参考.md:279）—— 这场内战里站在自由派那一边的「城里那批人」就是小资产阶级（原版自己也是这么配的：西班牙开局的摄政修正 `modifier_regency_petty_bourgeoisie` 就是把 +0.25 给小资产阶级的那一档，common/static_modifiers/00_ip4_04_modifiers.txt:26，而西班牙 1836 用的正是它，common/history/countries/spa - spain.txt:80）。**为什么取 +0.5**：沿用 `ru_defeat` 的实测档位（理由同上一条：`is_powerful` 是相对份额判定，抬一档常常翻不过线）。原版同字段档位实测为 +0.25（00_ip4_04_modifiers.txt:26、:175、:320、:329、:357 与 common/static_modifiers/content_204_modifiers.txt:551）、-0.25（00_ip4_04_modifiers.txt:368）、+0.15（common/static_modifiers/content_4_modifiers.txt:830）。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（0.5），未针对本条处境独立校准**。"

# ── ⑤ 改革窗口 JE：把「处境」喂进原版的最短路径 ──────────────
[journal_entry]
name = "je_sitai_sp_empire_remnant_window"
group = "je_group_crises"
icon = "gfx/interface/icons/event_icons/event_carlist_beret.dds"
why = "为什么用 JE 而不是我们自己的牌：JE 的作用只有三条（2026-09-22 实测复核）——① 玩家可见性（G3 三行解释的载体）；② 世界状态判据（原版脚本可用 `has_journal_entry = <本 JE 名>` 读它）；③ `immediate` / `on_complete` 里递牌（本档案不用，见 `[cards]`）。⚠️ 它喂不到原版 AI 牌：原版 212 处 `has_journal_entry` 全部硬编码具名 JE，没有「读任意 JE」的通用谓词（backlog B52）。**group 与 icon 都按本处境的语义另选**：group = `je_group_crises`（定义见 common/journal_entry_groups/00_journal_entries.txt:106）—— 本档案的来由是**内战与王位之争**，原版把政变、罢工、骚乱、1848 那一族都放在这一组里（如 common/journal_entries/01_coup.txt:4、00_strike_je.txt:4、00_peoples_springtime_je.txt:329）；icon = `event_carlist_beret.dds` —— **原版把这场内战本身用的就是这张图**（common/journal_entries/06_the_carlist_wars.txt:3，另见 common/journal_entries/06_spanish_new_world.txt:3 与 events/iberia_events/carlist_war_events.txt:701）。**为什么不用 `event_scales.dds`**（原版「两个西班牙」那张图，common/journal_entries/06_the_two_spains.txt:2）：那一张是原版自己那两条长期 JE（两个西班牙、西班牙临时政府，common/journal_entries/06_spain_provisional_government.txt:2）在用的图，本档案的窗口会与它们同时在屏上，撞脸会让玩家以为是同一条内容。　【沿用·口径】本表的**结构与数值**沿用 `ru_defeat.toml` 的实测档位，**未针对本条处境独立校准**；group 与 icon 是按本处境的语义另选的（有原版行号）。"

[[journal_entry.fields]]
key = "weight"
amount = 100
why = "JE 列表拥挤时的保留优先级。与原版 `je_corn_laws` 的 `weight = 100` 同档（common/journal_entries/00_corn_laws.txt:79）—— 处境级窗口不该被小 JE 挤掉。⚠️ 已知的档位差异：**原版这场内战自己用的是 10000**（`je_the_first_carlist_war`，common/journal_entries/06_the_carlist_wars.txt:216），「两个西班牙」用 5000（common/journal_entries/06_the_two_spains.txt:167）。本档案**刻意不取那两档**：它们是原版核心历史内容 JE，本档案是与它们并行的处境窗口，压过它们会把原版自己的西班牙内容挤下去。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

[[journal_entry.conditions]]
gate = "is_shown_when_inactive"
key = "c:SPA"
op = "?="
arg = "this"
why = "档案是**单国**的，主角是西班牙。tag = `SPA` 是**本机实测确认**的：common/country_definitions/00_countries.txt:429 就是 `SPA = {`（原版国家定义文件的顶层键就是国家 tag；同块 :436 `country_type = recognized`、:438 `tier = kingdom`、:440 `cultures = { spanish }`、:441 `capital = STATE_NEW_CASTILE`）。`c:SPA ?= this` 这个**形式在西班牙自己的 JE 里就是原版用法**（不是我们从别国抄的）：common/journal_entries/06_the_carlist_wars.txt:7 与 common/journal_entries/06_the_two_spains.txt:8 都写着 `c:SPA ?= this`，问号的语义是「作用域存在才比」，比裸 `=` 稳。　【沿用·口径】写法沿用 ru/tr/cn/au/eg/pe，未针对本条处境独立校准；单国门这一行是按本档案主角换的（tag 与形式各**有原版行号，且是西班牙自己的**）。"

[[journal_entry.conditions]]
gate = "is_shown_when_inactive"
key = "has_variable"
arg = "sitai_sp_empire_remnant_memory"
why = "没被记过「这场内战与帝国残骸」的国家连这条 JE 都不该看见 —— 「和平期占槽率 ≈ 0」这条出口判据（G-EXIT-5.2）靠它：不施加冲击的局里，这行判据为假，整条 JE 不出现。原版读变量的写法见 common/journal_entries/00_corn_laws.txt:7（`NOT = { has_variable = corn_laws_abolished }`）。　【沿用·口径】沿用既有六份的判据形状，未针对本条处境独立校准。"

[[journal_entry.conditions]]
gate = "possible"
key = "has_variable"
arg = "sitai_sp_empire_remnant_memory"
why = "开窗的第一个条件：这笔账确实发生过。`is_shown_when_inactive` 与 `possible` 都写一遍是有意的 —— 前者管「看不看得见」，后者管「开不开」，原版 `je_corn_laws` 也是两处各写一套（common/journal_entries/00_corn_laws.txt:6-31）。　【沿用·口径】沿用既有六份的判据形状，未针对本条处境独立校准。"

[[journal_entry.conditions]]
gate = "possible"
key = "legitimacy"
op = "<="
amount = 75
why = "开窗的第二个条件：压力够大。**为什么门槛是 75**：① 原版就用 75 做「政府站得住 / 站不住」的国家级分界（common/journal_entries/00_meiji_restoration.txt:314 的 `legitimacy >= 75`）；② 它同时是 `ru_defeat` 在阶段 3 里**实测校准**过的门槛（A 组无冲击时每一个观测月都 >80、不会误开；B 组 -35 时 55 块里有 42 块 ≤75）。本档案没有独立重跑 A/B：这个 75 **原样沿用 `ru_defeat` 的实测分界**。**为什么没有一条「王位之争」专属判据**（本处境最想要的那一条，比如「场上同时存在两个宣称者」）：原版表达这件事的写法都是**块形式**（`c:SPC ?= { … }`、`has_gov_regency = yes` 之类），而生成器的判据渲染只支持平铺一行 `key op 操作数`（tools/pdx/modgen.py:185-189 的 `Clause.render`），块形式在本 schema 里表达不出来 —— 这是**让步**，如实记在这里（与 `au_revolution` 表达不出「激进派占比门」、`pe_great_game` 表达不出「两强同时压过来」是同一类问题，backlog B69）。于是「王位被两头撕」这层意思由 `[pressure]` 的合法性那一条 + `[memory]` 承担，门只开在合法性上。相应地 `complete` 写 75，开与关正好接上。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位，未针对本条处境独立校准**；原版另有 75 的先例（有行号）。"

[[journal_entry.conditions]]
gate = "complete"
key = "legitimacy"
op = ">="
amount = 75
why = "关窗的门：国家重新站稳，窗口自己关上（不是「内战结束」—— 内战在原版里由 `je_the_first_carlist_war` 自己判完（common/journal_entries/06_the_carlist_wars.txt:89-97），也不替 AI 决定它拿什么去重建）。75 也是原版用过的档：common/journal_entries/00_meiji_restoration.txt:314 的 `legitimacy >= 75`。⚠️ 为什么不拿「王位有主了」当关门条件：`has_gov_regency` 那一类判据在原版里是块形式/专用触发器，本 schema 表达不出（见上一条），而且那会与原版自己的内容 JE 绑成一件事 —— 那是替原版内容做决定（§0「让 AI 自己推导」）。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

