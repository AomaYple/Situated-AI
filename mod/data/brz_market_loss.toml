# ── ⑩ 探针口径（B80 / B86：本档案盯哪条法、哪张牌；**留空 = 不判**）──
#
# 为什么要有这张表：① 法律那条原来在探针里写死 `law_serfdom`，**对没有农奴制的国家
# 立刻为真** ⇒ 会报假的「法律换了」（B80）；② 「进步牌挂上过」那条原来是**跨档案通用**的，
# 而**巴西开局就挂着那张牌**（common/history/ai/00_strategy.txt:45）⇒ 对巴西**开局即真**，
# 会报假的「行为层动了」（B86）。现在两条都按档案声明，留空 = 那条判据**不产出**。
[probe]
why = "**土地法查实了**：`common/history/countries/brz - brazil.txt` 里 :11-23 共 13 条 `activate_law`（monarchy / freedom_of_conscience / slave_trade / wealth_voting / racial_segregation / mercantilism / interventionism / per_capita_based_taxation / national_guard / no_schools / agrarianism …），**没有**土地改革那一组；开局的土地法来自 :7 调用的 scripted effect `effect_starting_politics_conservative`（定义在 common/scripted_effects/00_political_setup.txt:20，其中 `activate_law = law_type:law_tenant_farmers` 在 :43），而巴西后面**没有任何一条把它覆盖掉** —— 所以 `reform_law = \"law_tenant_farmers\"`。核这条法属于哪一组：common/laws/01_land_reform.txt:140 是 `law_tenant_farmers = {`、:141 是 `group = lawgroup_land_reform`。⚠️ **照抄俄/大清的 `law_serfdom` 会当场为真、报出假的「法律换了」**（B80 踩过；这与 `bv_alignment` 是同一条法，两档案盯同一条不影响判据 —— 判据是按**档案**声明的）。　【牌口径 · B86】**本档案的 `reform_card` 故意留空，并写明为什么**：那条判据是「那张牌**出现过**」，而巴西 1836 的初始政治牌里**本来就有** `ai_strategy_progressive_agenda`（common/history/ai/00_strategy.txt:45）⇒ 对巴西它**开局即为真**，报出来的「行为层动了」是假的。所以本档案的行为层改看两条通用读数（`ENACT` 立法 / `GOV` 在朝）与引擎侧的法律判定；要恢复牌读数，得先有「牌**换过**没有」这种相对判据（backlog B86 的方案 B），而不是声明一张开局就挂着的牌。"
reform_law = "law_tenant_farmers"
reform_card = ""
