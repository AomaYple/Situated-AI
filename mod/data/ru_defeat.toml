label_english = "Ruthless"
label_simp_chinese = "无情"
desc_english = "The player carries more than the world state alone: the legitimacy blow bites deeper and the old guard digs in harder."
desc_simp_chinese = "玩家肩上的那一份更重：合法性打击更深、旧势力更不肯松手。"
why = "为什么需要第三档：一视同仁之下'玩家能不能扛住'只由玩法水平决定；老玩家要的是**结构性的难**，而不是靠 AI 运气。所以这一档在同样的世界状态之上，再给玩家加一条与压力同族的修正 —— 注意它压的**不是**世界，只是玩家肩上的那一份（AI 照旧按一视同仁的账走）。"
player_why = "加重取原版同字段的**强档**：合法性 -20（00_code_static_modifiers.txt:353 的 -20，原版国家静态修正阶梯的强档）、保守 IG **+0.25**（00_ip4_04_modifiers.txt:47 的 +0.25；方向是**正**的 —— 压力侧已经把贵族压到 -0.30，无情要的是旧势力更不肯松手，回加 +0.25 之后净效果只剩 -0.05）。为什么不取 -50/-0.75 那种极端档：那是'革命/被外力打穿'级别的世界状态，拿来当难度选项会把处境与难度两件事混成一件，读数就没法归因了。⚠️ 本条 why 的第一版把 +0.25 写成了 -0.25（照抄了压力侧的方向）—— 数字与方向必须**同时**复核，所以这条更正留在数据源里。"
[[difficulty.tiers.harsh.player_effects]]
key = "country_legitimacy_base_add"
amount = -20
why = "原版同字段强档（00_code_static_modifiers.txt:353 = -20）。叠在压力侧的 -35 之上 ⇒ 玩家总共 -55；AI 仍是 -35。取 -20 而不是 -50：-50 是原版给'被外力打穿'那一档世界状态用的（content_1_modifiers.txt:17 的 opium_wars_lost），拿来当难度会盖过处境本身。"
[[difficulty.tiers.harsh.player_effects]]
key = "interest_group_ig_landowners_pol_str_mult"
amount = 0.25
why = "**方向必须是正的**：压力侧已经把贵族压到 -0.30（战败的直接后果），'无情'要的是**旧势力更不肯松手**，所以这里往回加 +0.25 —— 净效果 -0.05，贵族的钳制几乎没松，改革窗口更难推开。档位依据：00_ip4_04_modifiers.txt:47 用 +0.25（modifier_regency_landowners 那一族）。⚠️ 第一版我写成了 -0.25，那等于**继续削弱贵族**、与'无情'的语义相反 —— 数字对、方向错是最难看出来的一类错，所以这条为什么留在文件里：它记录了这个坑。"


# ── ⑨ 探针口径（B80：本档案盯哪条法；**留空 = 没查实**）────────────
#
# 为什么要有这张表：探针的行为层②原来写死 `NOT = { has_law = law_type:law_serfdom }`，
# 而**对没有农奴制的国家它立刻为真** ⇒ 会报出一个假的「法律换了」（奥斯曼/埃及实测踩到）。
# 现在按档案声明：查实了就写，没查实就留空（留空时那条判据**不产出**）。
[probe]
why = "本档案的改革方向是**土地改革**，观测点是「农奴制还在不在」。依据：`common/history/countries/rus - russia.txt:14` 的 `activate_law = law_type:law_serfdom`（逐行打开确认）。　【牌 · t9 裁决】目标牌 = `ai_strategy_progressive_agenda`。**从目标函数表的哪一项推出来**：`docs/design/01a-依据与参考.md:269` 的俄国行 —— 政治列写 `conservative_agenda`，**括号里明写「战败后应转向 `progressive_agenda`」**（同一句见 `docs/design/01a-依据与参考.md:306-307`），再加 `docs/design/01a-依据与参考.md:25`「身份项必须能被现实惩罚（重大失败要让执念衰减或转向）」。**修什么毛病**：战败不改革 —— 只压贵族与合法性时，重抽落点是**保守**牌，而「动不动手」的闸门 `change_law_chance` 从反动的 3.5（`common/ai_strategies/03_political_strategies.txt:198`）掉到 2.5（同文件 :31），六条改革法一条没换（`docs/design/exec/阶段3-结果.md` §三）。**递法**：`set_strategy` 直置（`[journal_entry.signals]`：窗口开递进步牌、窗口关递回 `ai_strategy_reactionary_agenda`）—— 九份里唯一递牌的一份，递的是**原版牌**（`src/pdx/modgen.py:734` 的白名单），不是自建牌。**为什么不用原版给俄国准备的 `ai_strategy_great_reforms`**：它的 `possible` 门是 `has_journal_entry = je_great_reformer`（`common/ai_strategies/03_political_strategies.txt:1388-1390`），而那个 JE 是亚历山大二世的「大改革」（`common/journal_entries/03_russia.txt:1125-1132`，fail 条件 = 君主不是他）—— 1836 年这扇门开不开**从未实测**，按 P13「门未查实不许当依据」不采用（未查实项记在 `docs/design/exec/阶段5-目标牌口径.md` §六 I5）。**`reform_card` = 进步牌**：RUS 开局政治牌是 `reactionary_agenda`（`common/history/ai/00_strategy.txt:90`）⇒ 这条判据开局为假，有判别力。"
reform_law = "law_serfdom"
reform_card = "ai_strategy_progressive_agenda"

