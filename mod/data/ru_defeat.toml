[[localization]]
key = "je_sitai_ru_reform_window"
english = "Defeat and Survival: A Window for Reform"
simp_chinese = "战败求存：改革窗口"
why = "G3 要求试玩者能复述「当前目标 + 主因」。标题只写目标（改革窗口）与来由（战败求存），不写机制。"

[[localization]]
