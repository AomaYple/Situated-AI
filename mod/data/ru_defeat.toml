# 档案数据源 · 俄罗斯 单国「战败求存」（阶段 3 最小闭环）
#
# 口径（P9 单一数据源 / P10 每个数字有依据 / F10 生成器优先）：
#
#   * 产物（`mod/` 下的脚本、本地化、档案文档）**全部由 `v3 modgen` 从本文件生成**，
#     手改产物没有用 —— 下次生成会被覆盖，闸门 ④ 也会报红；
#   * **每一张表都必须带非空 `why`**（数字、判据、文案一律如此）：空 `why` 由
#     `v3 modgen` 当场报错、闸门 ⑤ 复核 —— 这是 P10 从"纪律"变成"可执行检查"的那一步；
#   * 数字一律写成 `amount = N`（同表内配 `why`），缩写形式只有一个来源，
#     `why_report()` 与闸门 ⑤ 才能机械地枚举"每个数字 + 它的依据"。
#
# 为什么是 TOML：Python 3.11+ 标准库自带 `tomllib`，不新增依赖（P4），
# 而它同时有「表」与「数组」两种结构，正好表达"一组带依据的条目"。
#
# 本档案只做一件事：把**战败**变成真实世界状态（A 级：变量 + 修正 + JE），
# 让原版自己的权重公式转向改革。入口是**原版事件**（`[trigger]`：被占领首都而投降 /
# 和约上被强制执行战争目标），不再由实验脚本显式调用。
# 牌与信号的账目如实写：**自建处境牌一张**（`[cards]`）+ JE 上两条 `set_strategy`
# （`[journal_entry.signals]`）；**不递任何原版牌**（F5 的那条结论不变）。

schema_version = 1

[archive]
id = "ru_defeat"
title = "俄罗斯 · 战败求存"
country = "RUS"
# 档案对哪个引擎版本有效（写进 mod 元数据的 supported_game_version）。
# 钉住 1.14.3 = 阶段 2 三次探针局与本仓库知识库的口径版本；官方升级后
# 闸门 ①/② 会先红（原版键名变了），届时改这里而不是改产物。
game_version = "1.14.5"
why = "战败之后 AI 照旧走原来的路 —— 贵族照旧在朝、合法性不塌、财政不受罚，于是「战败 → 改革」这条因果在原版里根本不存在。档案不替 AI 决定改什么，只把战败记成账、把压力落成真实的合法性/贵族/财政变化。⚠️ 依据已于 2026-09-22 更正：原版 AI 策略里 212 处 has_journal_entry 全部硬编码**具名** JE，没有「读任意 JE」的通用谓词 ⇒ 我们自己的 JE 一张原版牌也喂不到（backlog B52）；真正把压力变成意图位移的通道是递牌（set_strategy，B58）与法律承诺（law commitment，B56/B57）。"

# ── ① 节奏杠杆：温和档 NAI 覆盖 ─────────────────────────────
# 阶段 2 实测的结论：B 级（喂输入）单独用几乎无效 —— 原版重抽是十年尺度。
# 所以节奏覆盖不是可选装饰，是"喂进去的输入能被读到时"的前提（发现 2/4）。
[tempo]
block = "NAI"
why = "不覆盖节奏的话，战败压力写进去了也没人重抽 —— 政治槽实测 1.05%/国家·月，等于十年尺度（exec/阶段2-结果.md 发现 2）。本档案只覆盖 NAI 块的**两个键**，不复制原版 00_ai.txt（KB 05 §1.7 的按「块 + 参数」覆盖，阶段 2 的 storm 变体实测生效）。⚠️ **作用域是全局**：defines 没有单国写法，这两个键一改，**所有国家**的 AI 重抽节奏都变 —— 这是有意的（目标本来就是让每个国家都能随世界重新推导），但必须写在明面上：它不是「俄罗斯专属效果」，也不能拿它去解释单国差分。"

[[tempo.keys]]
key = "CHANGE_STRATEGY_THRESHOLD"
amount = 40
why = "原版 100 点：周通道每周 20% 概率 +1 点 → 0.20×52.14/12 ≈ 0.87 点/月 → 攒够 100 点要 ≈115 个月 ≈ 9.6 年（阶段 2 订正过口径）。取 40 是为了把重抽拉到「数年一次」：与下面那 30% 配对后 ≈1.30 点/月 → 40/1.30 ≈ 30.7 个月 ≈ 2.6 年。不取风暴档（门槛 1 / 周概率 100）—— 那是实验设置，每周改主意在观感上是反复无常，而 G4 要的是「世界活了」（阶段 2 发现 4 末尾的警告）。"

[[tempo.keys]]
key = "CHANGE_STRATEGY_INCREASE_WEEKLY_CHANCE"
amount = 30
why = "原版 20（1 = 1%）。与门槛 40 一起决定重抽周期（见上一条的算式）。两个键要一起动：只降门槛会让等待时间仍由周通道决定，只提概率则门槛不变、效果被门槛吃掉。30 是「温和档」的取值 —— 阶段 3 执行文档 §设计·节奏 给的 ≈40/≈30 一组。"

# ── ② 战败记忆：真实世界状态的第一步 ────────────────────────
[memory]
variable = "sitai_ru_defeat_memory"
effect = "sitai_ru_defeat_shock"
why = "记忆本身不产生任何数值效果 —— 它是**判据**：JE 的 is_shown/possible 读它，于是「战败过」这件事变成可查的世界状态（阶段 1 已证：牌直接读 has_variable / has_journal_entry）。**谁把战败判成战败：本版起是真实判定**（B35 已落地，接线见 `[trigger]`）—— 两条原版路径都只在「本国正是被打的那一方」时才写这本账：① 被逼投降（on_capitulation，root = 投降国本身，00_code_on_actions.txt:4222）；② 和约上被强制执行战争目标（on_wargoal_enforced，:6264 的 scope:target = 被强制执行的一方；赢家才是 root，:6298 给它写 recently_won_war）⇒ 赢的一方在任何一条路径上都拿不到记账效果。原版 on_war_end（:7043）只给 scope:actor / scope:target、不带胜负，**所以不用它判战败**：用它会把赢输记成一样。探针通道保留，但自本版起只是**仪器通道**（B2 实验段显式施加，用来做对照），不再是唯一入口。"

[[memory.params]]
key = "value"
amount = 1
why = "变量在判据里只被 has_variable 读，值不参与任何运算；写 1 而不是 yes，是为了将来要用 change_variable 记「第几次战败」时不用换类型（原版 set_variable = { name = recently_had_war value = yes } 用的是 yes，见 00_code_on_actions.txt:7084）。"

[[memory.params]]
key = "days"
amount = 3650
why = "10 年，与压力修正的 years = 10 同一时间尺度（两处必须一起改，否则会出现「记忆还在、压力已经没了」的半截状态）。对照原版给 recently_had_war 的是 days = 1825（5 年，00_code_on_actions.txt:7086）—— 战败比「打过仗」更该留得久，故取两倍。"

# ── ②b 真实触发接线（B35）：战败由原版事件自己记进账 ────────────
#
# 为什么单列一张表：它的产物是**单独一份**文件
# （`common/on_actions/sitai_ru_defeat_on_actions.txt`），内容是给原版钩子
# **追加**一个 `on_actions` 字段 —— 原版的 `effect` / `events` 字段一字不动。
# 官方口径：`research/official-docs/game/common/on_actions/_on_actions.md:115`
# 明说不能给已有 `effect` 块的 on_action 再追加一个 effect 块（会冲突），
# `:117-128` 给的写法就是 `<原版钩子> = { on_actions = { <我们自己的 on_action> } }`；
# 本仓的探针（`tools/probe/zz_probe_h1/common/on_actions/zz_probe_h1_on_actions.txt`）
# 已按这个写法实机跑过，且踩过「`on_actions` 只认 on_action 定义、不认
# scripted_effects 里的效果名」这条（报 `No on_action scripted with tag`）。
[trigger]
why = "**触发是真的**（B35）：本档案的记账效果 `sitai_ru_defeat_shock` 从本版起由原版事件调用，探针只是仪器通道。两条路径都要求「本国正是被打的那一方」才写账 —— 判据落在每条钩子的 scope 上（见各 hook 的 why）；赢的一方在两条路径上都结构性地拿不到记账效果（负面对照见 docs/reports/t3-真实因果链.md）。⚠️ 生成器能力缺口（如实记）：`common/on_actions` 不在反解表里（src/pdx/modgen.py 的 `_FACT_READERS` 只有七类），所以这份产物**不进闸门 ④ 的往返比对** —— 它的正确性由 tests/test_modgen.py 的用例看守，缺口本身记在报告里。"

[[trigger.hooks]]
on_action = "on_capitulation"
scope = "this"
why = "路径①：**被占领首都而投降**。原版 `common/on_actions/00_code_on_actions.txt:4214` 的注释写明 `# Root = Country`（就是投降国自己；钩子体在 `:4206-4218`），`:4208-4212` 给它写 recently_lost_war（1825 天），`:4213-4216` 写 recent_capitulation（`short_modifier_time`）。scope 写 `this` ⇒ 判据是 root 就是本国（`c:RUS ?= this`）：别的国家投降不会写这本账。**为什么这条路径同时是「重档」判据的来源**：recent_capitulation 是原版自己写的记号、窗口 913 天（`common/script_values/event_values.txt:39` 的 short_modifier_time = 913），不是我们发明的标记 —— [pressure.escalation] 读它不自我循环，窗口小也保证五年前的旧投降不会被算成今天的事。"

[[trigger.hooks]]
on_action = "on_wargoal_enforced"
scope = "scope:target"
why = "路径②：**和约上被强制执行战争目标**（割地 / 赔款那类条款落地时引擎烧这个钩子）。原版 `:6257` 注释写明 `# Root = Country`（钩子体在 `:6264`）；`:6258` scope:actor = 强制执行的一方、`:6259` scope:target = **被强制执行的一方**、`:6262` scope:enforced_by_timer（只有靠占住目标点打赢才置位，和约落地时不置位）；`:6298-6302` 给 root 写 recently_won_war ⇒ **root 是赢家**。所以这条路径的施加**只写在 scope:target 里**（判据 `scope:target ?= c:RUS`）：胜利者拿不到记账 —— 这不是约定，是结构（施加语句根本不在 root 上）。"

# ── ③ 压力：真实的合法性 / 贵族 / 财政变化（A 级）────────────
[pressure]
name = "sitai_ru_defeat_pressure"
icon = "gfx/interface/icons/timed_modifier_icons/modifier_statue_negative.dds"
why = "压力必须是真的世界状态，不是我们的私有计数器 —— 只有真实变化才会进原版自己的公式（01a D 节：A 级被严重低估，战败后贵族失势、合法性下降、财政崩溃都可以真实发生）。三条字段都照原版同族用法取档位，见各条 why。⚠️ **B35 已于 2026-09-29 落地：本表不再是「实验用直接修正」** —— 它由 `[trigger]` 的原版事件挂上，且数值改成**两档叠加**：**基线档**（本表三条字段，只要冲击被真实触发就恒挂）取原版自家档位；**投降叠加档**（`[pressure.escalation]`，只在原版记号 recent_capitulation 还亮着时挂）补足差额。**旧实验值作废留痕（B112：不改历史读数、只补记）**：阶段 3 A/B 实测的三个总量 -35 / -0.30 / 0.35 当时是**直接一击**（那时没有真实入口，探针显式施加）；现在同样的总量由「基线 + 叠加」合成（-20 + -15 / -0.15 + -0.15 / 0.2 + 0.15），**窗口内总量与实验段一致、来源换成真实结果**；叠加窗口（913 天）过后回落到基线档 —— 那是设计意图（战败久了压力减一档），不是遗漏。字段级差异与逐条对账见 docs/reports/t3-真实因果链.md；实验读数的原文在 exec/阶段3-结果.md 与 exec/阶段3-归档清点.md（**未改动**）。"

[[pressure.params]]
key = "years"
amount = 10
why = "与 sitai_ru_defeat_memory 的 days = 3650 对齐。原版 add_modifier 用 years 的写法见 00_movement_effects.txt:1-7（add_modifier = { name = … years = 20 }）。"

[[pressure.effects]]
key = "country_legitimacy_base_add"
amount = -20
why = "**基线档 = 原版自家档位 -20**（原版同字段档位 ±5 / ±10 / ±20 / ±50，00_code_static_modifiers.txt:322-353 与 :979-1034 两处；取其中一档，不再自造介于两档之间的数）。合法性是开窗判据的一半（JE 的 possible 读 `legitimacy <= 75` —— 为什么是 75 见下面 conditions 那条的依据）。**旧实验值作废留痕（B112：不改历史读数，只补记）**：阶段 3 A/B 实测用的是**直接一击 -35**（先取 -20 跑一整局 B（15 个月）窗口一次都没开、JE 全程 0% → 提到 -35），-35 的实测水位是 b70 24 / b75 18 / b80 13（复算 `v3 ab --logs ab-run7`），即「从开局全 >80 掉到 70–80 之间来回、还会自己回升」，够不到原版那条 50 线（00_liberalism.txt:54 的「政府站得住」分界）—— 所以本档案不要求压到 50，开窗判据按实测分界取 75。那些读数保持原样，作废的是「直接一击」这个做法：同一字段现由**基线 -20（恒挂）+ 投降叠加 -15（[pressure.escalation]）**合成，合计仍是被实测过的 -35，且不再自造档位外的数。"

[[pressure.effects]]
key = "interest_group_ig_landowners_pol_str_mult"
amount = -0.15
why = "**基线档 = 原版自家档位 -0.15**（同字段 -0.15 的原版出处：cuban_modifiers.txt:40；+0.15 那一侧见 content_4_modifiers.txt:816。原版全部档位实测：±0.03（00_ip3_04_modifiers.txt:334）、±0.05（agitators_5_modifiers.txt:853）、±0.10（00_ip4_03_modifiers.txt:14）、±0.15（cuban_modifiers.txt:40）、±0.25（00_ip4_04_modifiers.txt:12 的 modifier_regency_landowners）、-0.20（agitators_4_revolution_modifiers.txt:321）、-0.50（agitators_5_modifiers.txt:615）、-0.75（content_1_modifiers.txt:1465 的 shogun_ig_forced_to_open_market，与知识界 +0.5、工业家 +0.5 成对写））。贵族失势是「战败 → 改革阻力下降」的那一环。**旧实验值作废留痕（B112：不改历史读数、只补记）**：阶段 3 A/B 用的是**直接一击 -0.30**，当时的理由是「-0.15 在一整局里没能让行为层动起来 → 取 -0.30」，而 -0.30 落在原版 -0.25 与 -0.50 之间（方向明确，又不把贵族一次打垮 —— 一次打垮会让议会算术失去张力）。现在 -0.30 由**基线 -0.15（恒挂）+ 投降叠加 -0.15（[pressure.escalation]）**合成：总量与实验段相同，但**轻档与重档分开了** —— 「只被和约逼让步」拿一档，「被逼投降」拿两档。"

[[pressure.effects]]
key = "country_loan_interest_rate_add"
amount = 0.2
why = "**基线档 = 原版全局基准 0.2**：00_code_static_modifiers.txt:12 的 base_values 里 `country_loan_interest_rate_add = 0.2` —— 国家静态修正这一侧原版**没有档位阶梯**、只有这个基准，所以基线就取它。战败赔款抬高借债成本，而不是直接没收国库 —— 反目标里写着「不让 AI 获得任何数值作弊」，也不想让俄罗斯当场破产（那样测出来的差分来自破产机制，不是来自战败）。⚠️ **2026-09-23 复核更正（保留）**：原稿写「该字段原版只出现过一次」，实测 `common/` 下共 **12 处** —— 全局基准 00_code_static_modifiers.txt:12 = 0.2、法律侧 00_amendments_enactment_04.txt:644/1138/1174/1222/1266 = 0.02/0.02/0.03/0.01/0.05、科技侧 30_society.txt:209/599/1226/1473/1647 = -0.02、字段定义 00_modifier_types.txt:662。**旧实验值作废留痕（B112：不改历史读数、只补记）**：阶段 3 A/B 用的是**直接一击 0.35**（从 0.2 提到 0.35，让财政压力在几年内真的能被看见、而不是被收入增长吃掉；当时就标明 0.35 ≈ 1.75× 基准、属实验取值）；现在 0.35 由**基线 0.2 + 投降叠加 0.15（[pressure.escalation]）**合成，总量不变、来源换成真实结果。⚠️ **如实记：财政这条只能间接派生** —— 全树找不到脚本可读的「赔款」触发器（`war_reparations` 只作为外交行动 17_war_reparations.txt:1 与概念存在），所以它是从「战败事实」派生，而不是从赔款金额算出来的；相关 defines（00_defines.txt:1092 WAR_GOAL_REPARATIONS_MONTHS = 60、:1386 DEFAULT_WAR_REPARATIONS_MONEY_TRANSFER = 0.1）只能说明赔款在原版是**月度转账**，不构成可读判据。"

# ── ③b 投降叠加档：真实结果更重的那一档 ──────────────────────
#
# 为什么拆两档、而不是一张表把总量写死：修正名 `sitai_ru_defeat_pressure` 是**处境牌的门**
# （`[cards.items.possible]` 的 `has_modifier = sitai_ru_defeat_pressure`），它必须
# 「只要被真实触发就挂着」；拆出叠加档之后门照旧恒挂，而**重档**的判据换成原版自己写的记号。
# ⚠️ 如实记：叠加量不是原版档位，它是「阶段 3 实测总量 − 原版基线档」的差额 ——
# 这样拆的目的是让**基线**落在原版档位上、让**判据**来自原版记号；总量与实验段一致。
[pressure.escalation]
variable = "recent_capitulation"
modifier = "sitai_ru_defeat_pressure_capitulation"
why = "叠加档只在**被逼投降**时挂：判据是原版自己写的记号 recent_capitulation（00_code_on_actions.txt:4221-4224 写、取值 `short_modifier_time` = 913 天，见 common/script_values/event_values.txt:39）。为什么不自己写一个变量当判据：那又变回「我们的私有计数器」，而这条链要的是**真实结果**；也不把窗口拉成 years = 10 那样长 —— 913 天是原版的「短期记号」，它自己过期，于是五年前的旧投降不会被算成今天的事。只被和约逼让步（路径②）不写这个记号 ⇒ 拿基线档，这就是两档的分界。"

[[pressure.escalation.effects]]
key = "country_legitimacy_base_add"
amount = -15
why = "叠加量 = 实测总量 -35 与基线档 -20 的差额（-15）。⚠️ 它不是 `00_code_static_modifiers.txt` 那套档位阶梯里的一档（那一套是 ±5 / ±10 / ±20 / ±50，见 :322-353 与 :979-1034），**是差额**（如实记：-15 这个取值在原版其它文件里也出现，如 00_ip4_02_modifiers.txt:303、105_modifiers.txt:621；本处取它的理由**只是差额**，不是「原版用了几档」）：这样拆的意义在于「轻档」本身落在原版档位上、而「重档」由原版记号判出来。合法性这一档在投降后 913 天内生效，之后回落到基线 -20。"

[[pressure.escalation.effects]]
key = "interest_group_ig_landowners_pol_str_mult"
amount = -0.15
why = "叠加量 = 实测总量 -0.30 与基线档 -0.15 的差额。它与基线档同值、方向相同 ⇒ 投降后贵族政治力量合计 -0.30（阶段 3 A/B 实测过的那个总量），只被和约逼让步时是 -0.15。原版档位表见 [pressure.effects] 里那条 why。"

[[pressure.escalation.effects]]
key = "country_loan_interest_rate_add"
amount = 0.15
why = "叠加量 = 实测总量 0.35 与基线档 0.2（原版全局基准 00_code_static_modifiers.txt:12）的差额。财政这条只能**间接派生**（没有可读的赔款触发器，见基线那条 why 的末段）：重档 = 「被逼投降」这个事实 ⇒ 借债成本再抬 0.15，合计 0.35 与实验段一致。"

# ── ④ 改革侧输入：把「改革的推力」也落成真实世界状态（A 级）────
#
# 为什么单独一张表、而不是往 [pressure] 里再加两条字段：阶段 3 的 A/B 阶梯要在**一局
# 之内**分两处施加 —— 第 13 月只加冲击（B 段），第 37 月才追加这一处（B2 段）。
# 合进同一个修正就没有「只加冲击」那一段，B 与 B2 的差分无从谈起。
[reform_inputs]
name = "sitai_ru_reform_inputs"
effect = "sitai_ru_reform_input"
icon = "gfx/interface/icons/timed_modifier_icons/modifier_lightbulb_positive.dds"
why = "改革侧的推力也落成真实世界状态（A 级）：它是「改革派牌读得到的那两个输入」的修正，**B35 落地后由原版事件接线挂上**（`[trigger]` 路径①②都挂这一条线；探针只作仪器通道）。正式版设计要的是**真实触发 + 因果链**（战败 → 割地赔款 → 工业化/识字率的真实位移 → IG 势力自然变化），而不是直接改政治力量 —— 本版走的是这条链的第一段（战败事实由原版事件认定），**后一段仍是 A 级近似**：原版没有可读的「割地赔款使工业化/识字率位移」的现成字段，这一点如实写在报告《只能间接派生的两条》里。为什么走 A 级而不是递牌：原版 `ai_strategy_progressive_agenda` 的权重是**读**这两个 IG 的（03_political_strategies.txt:528-544），改世界状态就等于改它的输入，不占任何槽位（F5）。**旧实验值作废留痕（B112：不改历史读数、只补记）**：阶段 3 A/B 用的是**直接一击 +0.5 / +0.5**（第二处理段 B2 显式施加）；现在同一总量由**基线 +0.25 / +0.25（恒挂）+ 投降叠加 +0.25 / +0.25**合成，窗口内总量与实验段一致。实验读数的原文在 阶段3-结果.md 与 阶段3-归档清点.md（未改动）。"

[[reform_inputs.params]]
key = "years"
amount = 10
why = "与 [pressure.params] 的 years = 10、记忆变量的 days = 3650 三处对齐：三者在实验里是同一段时间窗，任何一处短了都会出现「输入还在、压力已经没了」的半截状态。原版 add_modifier 用 years 的写法见 00_movement_effects.txt:1-7。"

[[reform_inputs.effects]]
key = "interest_group_ig_industrialists_pol_str_mult"
amount = 0.25
why = "**基线档 = 原版档位 +0.25**（同字段 +0.25 的原版出处：00_ip4_04_modifiers.txt:33；原版同字段常见档位实测为 ±0.03 / ±0.05 / ±0.10 / ±0.15 / ±0.25 / ±0.5 / ±0.75，另有单点取值 0.3：00_ip3_04_modifiers.txt:334、00_ip4_03_modifiers.txt:7、106_modifiers.txt:191、agitators_5_modifiers.txt:853、content_4_modifiers.txt:397、content_1_modifiers.txt:1467、content_204_modifiers.txt:340；取 +0.25 这一档，不再自造档位外的数）。取原版同族强档 +0.5 的那一族用法是 `shogun_ig_forced_to_open_market`（content_1_modifiers.txt:1462-1470 —— 同一处把地主 -0.75、知识界 +0.5、工业家 +0.5 一起写，正是「被外力逼着开门 → 改革侧势力抬头」那一族，与本处情形同型）。**为什么基线取 0.25 而不是 0.5**：0.5 是**重档总量**（被逼投降时由基线 +0.25 + 叠加 +0.25 得到），轻档（只被和约逼让步）拿一档 0.25。**旧实验值作废留痕（B112：不改历史读数、只补记）**：阶段 3 A/B 用的是**直接一击 +0.5**，当时的理由是「`progressive_agenda` 的权重只在 `ig:ig_industrialists ?= { is_powerful = yes }` 时 +10（03_political_strategies.txt:537-544），而 is_powerful 是**相对份额**判定 —— 同一处只抬一档常常翻不过那条线，实验要的是「输入明确到位」，不是「差一点」」；这条**读数与推理都保留**，只是「一击到位」的做法作废：重档现在仍能拿到 +0.5 总量。"

[[reform_inputs.effects]]
key = "interest_group_ig_intelligentsia_pol_str_mult"
amount = 0.25
why = "**基线档 = 原版档位 +0.25**（同字段 +0.25 的原版出处：00_ip4_04_modifiers.txt:47；+0.15 那一档见 content_4_modifiers.txt:809、content_304_modifiers.txt:331），与工业家同档同源（content_1_modifiers.txt:1466-1467 的 shogun_ig_forced_to_open_market 把知识界 +0.5、工业家 +0.5 成对写）。`progressive_agenda` 的权重对知识界与工业家各 +10（03_political_strategies.txt:528-544），两条一起给才是原版的用法；只给一条会让「哪一条起了作用」在实验里不可分。**旧实验值作废留痕（B112：不改历史读数、只补记）**：阶段 3 A/B 用的是**直接一击 +0.5**（两条成对）；现在重档总量仍为 +0.5，由基线 +0.25（恒挂）+ 投降叠加 +0.25（[reform_inputs.escalation]）合成，轻档只拿一档。档位依据见上一条。"

# ── ④b 改革侧输入的投降叠加档 ────────────────────────────────
#
# 与 [pressure.escalation] 同一判据、同一窗口（原版记号 recent_capitulation = 913 天）。
# 两条字段成对（知识界 / 工业家），理由见上一条 why。
[reform_inputs.escalation]
variable = "recent_capitulation"
modifier = "sitai_ru_reform_inputs_capitulation"
why = "判据与 [pressure.escalation] 完全相同（同一个原版记号、同一段窗口），只是补的是**改革侧**的两个输入。为什么两处各自留一份判据、而不是共用：产物是两个修正文件、两段效果，共用判据意味着要引入文件间的隐式耦合（谁先挂、谁读谁）—— 直写同一判据更容易被闸门与测试看守；代价是判据写了两遍，这是**已知且有意**的重复，报告里点名。"

[[reform_inputs.escalation.effects]]
key = "interest_group_ig_industrialists_pol_str_mult"
amount = 0.25
why = "叠加量 = 实测总量 +0.5 与基线档 +0.25 的差额。⚠️ 如实记：它不是原版档位（原版档位表见基线那条 why），**是差额** —— 基线落在原版档位上，重档由原版记号判出来。"

[[reform_inputs.escalation.effects]]
key = "interest_group_ig_intelligentsia_pol_str_mult"
amount = 0.25
why = "同上，与工业家成对（两个 IG 各 +0.25，重档合计各 +0.5 = 阶段 3 A/B 实测总量）。"

# ── ⑤ 改革窗口 JE：把「处境」喂进原版的最短路径 ──────────────
[journal_entry]
name = "je_sitai_ru_reform_window"
group = "je_group_internal_affairs"
icon = "gfx/interface/icons/event_icons/event_portrait.dds"
why = "为什么用 JE 而不是我们自己的牌：JE 的作用只有两条（2026-09-22 实测复核）——① 玩家可见性（G3 三行解释的载体）；② 世界状态判据（原版脚本可用 has_journal_entry = <本 JE 名> 读它）。⚠️ 它喂不到原版 AI 牌：原版 AI 策略（`common/ai_strategies/**`）里 212 处 has_journal_entry 全部硬编码具名 JE（03_political_strategies.txt:137 读 je_metternich 那一串），没有「读任意 JE」的通用谓词（backlog B52）—— 所以「开一个 JE = 同时喂给 18 张原版牌」这句是错的。F5（能改世界就不占槽）仍然成立，只是改世界的受益者不是牌池。icon 与 group 都沿用原版内部事务那一族（je_corn_laws 用同一个 icon 与 group，见 00_corn_laws.txt:2-4）。"

[[journal_entry.fields]]
key = "weight"
amount = 100
why = "JE 列表拥挤时的保留优先级。与原版 je_corn_laws 的 weight = 100 同档（00_corn_laws.txt:79）—— 改革窗口是处境级 JE，不该被小 JE 挤掉。"

[[journal_entry.conditions]]
gate = "is_shown_when_inactive"
key = "c:RUS"
op = "?="
arg = "this"
why = "档案是**单国**的（阶段 3 执行文档：主角俄罗斯单国）。c:AUS ?= this 是原版写法（05_metternich.txt:8），问号的语义是「作用域存在才比」，比裸 = 稳。"

[[journal_entry.conditions]]
gate = "is_shown_when_inactive"
key = "has_variable"
arg = "sitai_ru_defeat_memory"
why = "没被记过战败的国家连这条 JE 都不该看见 —— 「和平期占槽率 ≈ 0」这条出口判据靠它：不施加冲击的局里，这行判据为假，整条 JE 不出现。"

[[journal_entry.conditions]]
gate = "possible"
key = "has_variable"
arg = "sitai_ru_defeat_memory"
why = "开窗的第一个条件：确实战败过。is_shown 与 possible 都写一遍是有意的 —— 前者管「看不看得见」，后者管「开不开」，原版 je_corn_laws 也是两处各写一套（00_corn_laws.txt:6-31）。"

[[journal_entry.conditions]]
gate = "possible"
key = "legitimacy"
op = "<="
amount = 75
why = "开窗的第二个条件：压力够大。**实测校准**（阶段 3 的 A/B 分档读数；**查法**：`v3 ab --logs ab-run7`，转述出处 `docs/design/exec/阶段3-结果.md`）：A 组（无冲击，`ab-A-control`）**每一个观测月都落在最高档**（探针早期的档位标签是 `vhigh`，即 >80）；B 组（-35，`ab-run7` 的 55 块分档观测）**没有一个块在 70 以下为主、且多数落在 70–75**（b70 24 / b75 18 / b80 13）—— 门槛 **75** 就落在这条实测分界上：对照组的全 >80 不会误开，而 B 组有 42/55 个月（76%）≤75。**换挂载点（已发生）**：原方案要求压到原版那条 50 线（00_liberalism.txt:54、02_peru_bolivia.txt:39），但判据仍是 50 的那一局（`ab-run3-done`，-35，61 个月）窗口从未开、法律全程 `law_serfdom`，而 -35 的水位只到 65–80 且会回升 —— 于是判据改到 75：门开在「战败后合法性确实下滑一档」这件事上，压力数值继续塑造世界。相应地 `complete` 仍是 `legitimacy >= 75`，开与关正好接上。"

[[journal_entry.conditions]]
gate = "complete"
key = "legitimacy"
op = ">="
amount = 75
why = "关窗的门：国家重新站稳，窗口自己关上（不是「改革完成」—— 改什么由 AI 与原版牌池决定，本档案不替它选法律）。75 也是原版用过的档：00_meiji_restoration.txt:314 的 legitimacy >= 75。"

# ── ⑤b 递牌信号：窗口一开就换路线（B 级；这是阶段 3 负结果的**修正处**）──
# 为什么必须递牌、而不是继续只改世界状态：原版把「动不动手改法」卡在牌上
# （`change_law_chance`：反动 3.5 / 保守 2.5 / **进步 10**，03_political_strategies.txt:198/31/404）。
# 阶段 3 实测：只压世界状态 ⇒ 牌被重抽到**保守**（比反动还低 1 点）⇒ 法律一条没改
# （阶段3-结果.md §三）。要真的换路线，就得**把牌换掉**。
[journal_entry.signals]
why = "递牌的依据（P10：每个数字/决定都要能指到原文）。**修的是哪个具体毛病**：原版重抽是累积掷骰（CHANGE_STRATEGY_THRESHOLD = 100、每周 20% 概率 +1 点 → 期望 ≈9.6 年一次，00_ai.txt:38-39），而战败窗口只开几年 ⇒ 等重抽等于不递牌。**手段为什么是 B 级而不是 A 级**（F5）：世界状态改得了 AI 的输入，改不了它**已经挂着的那张牌** —— 而牌才是「动不动手」的闸门。**为什么递原版自己的牌、不建新牌**：每国同时只有一张政治牌在用（阶段 2 实测 1.05%/国·月），自建牌是抢槽；递原版已有的牌不新增竞争，只把落点拨到那条路线。**为什么进步牌是对的落点**：`law_tenant_farmers` 的 +1000 分支要求「非反动 **且**（非保守 **或** 有运动赞成且支持 ≥10%）」（01_land_reform.txt:216-231），而土地改革运动对这两条法分别是 `neutral` / `disapprove`（03_ig_ideologies_movement.txt:720-721）⇒ 走运动那一支是假的，只有「非反动且非保守」那一支成立。递进步牌同时满足两条，且它是三张牌里唯一 `change_law_chance = 10` 的。"

[[journal_entry.signals.set_strategy]]
key = "set_strategy"
arg = "ai_strategy_progressive_agenda"
why = "窗口打开 = 处境变了 ⇒ 换到改革路线。写在 JE 的 `immediate` 里（= `add_journal_entry` 那一刻执行），所以「窗口开」与「换路线」是**同一件事的两个面**，判据与动作不分离 —— 这正是阶段 3 缺的那一环。原版在 JE 里这么用有两处先例：05_grunderzeit.txt:118、events/peoples_springtime.txt:980/1097。"

[[journal_entry.signals.clear_strategy]]
key = "set_strategy"
arg = "ai_strategy_reactionary_agenda"
tooltip = "je_sitai_ru_reform_window_complete_tt"
why = "窗口关闭（国家重新站稳）= 处境回到「守成」⇒ 把路线递回去。为什么明写「递回反动」而不是「什么都不做」：`set_strategy` 是**替换**当前策略，窗口开着时那一段如果不管，AI 会一直挂着进步牌（而合法性已经回来了）—— 那就不是「处境决定路线」，而是「一次战败永久改路线」。递回反动牌也是复现**原版 1836 俄国的初始落点**（00_strategy.txt:90 就是 set_strategy = ai_strategy_reactionary_agenda），所以「窗口关」= 回到开局那条路线，闭环可解释。**为什么这一条必须带 `tooltip`**：它落在 `on_complete` —— 引擎把那个块渲染成详情面板「如果完成」那一格（journal_entry.gui:854 `[JournalEntry.GetOnCompleteTooltip]`），而 `set_strategy` 的 effect_localization 只登记了 global（`00_country_effects_loc.txt`，行号与原句见 `src/pdx/modgen.py` 的 `TOOLTIP_BLOCK` 注释 + 本卡报告 §1），可见块要的是 first ⇒ 裸写会被引擎拼成 `BUG: set_strategy missing perspective …` 当成文案显示给玩家（2026-10-01 功能工程师的预检帧 tools/out/t5-frames/t8-je4-detail.png 拍到的就是这句）。上面那条 `set_strategy`（immediate）**不**带 tooltip：immediate 不是 tooltip 的来源 —— 原版 05_grunderzeit.txt:111-119 正是在 immediate_all_involved 里裸写。包一层 `custom_tooltip` 只换显示、不改执行：原版可见块里 356 处这么做（例 `00_acw_entries.txt`，行号见 `src/pdx/modgen.py` 的 `TOOLTIP_BLOCK` 注释）。"

# ── ⑥ 本地化：面板三行（G3）的文案 ─────────────────────────
# 键名与游戏里的约定一致：JE 标题 = JE 名、说明 = <JE 名>_reason（见原版
# localization/simp_chinese/ip3_misc_01_l_simp_chinese.yml:549 的 je_metternich /
