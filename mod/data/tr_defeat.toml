# ── ⑦ 递牌：本档案一张都不递 ───────────────────────────────
[cards]
why = "本档案**不使用自建策略牌**（F5：能改世界就不占槽）。战败 → 压力的链路由变量 + 修正 + JE 表达；⚠️ 依据已于 2026-09-22 更正：JE **不会**被原版牌读到（原版 212 处 has_journal_entry 全硬编码具名 JE，没有通用谓词，backlog B52），所以意图位移**不能**指望「开一个 JE 就被牌池读到」。要真的换路线，用（a）递**原版**的牌 `set_strategy`（B58）或（b）法律承诺 law commitment（B56/B57）—— 两者都是「整条路线要换」时的手段。递牌的政治槽价格：S≈33 时权重 10 吃掉 23% 的份额（阶段 2 价格表）。本档案目前**故意不做**（骨架件），等 ru 那条链实测通过再按同一抽象抄。"

