# ── ⑧ 三行解释（P11 / G3）──────────────────────────────────
#
# 为什么这三行要放在一起：G3 判的是**试玩者能复述「当前目标 + 主因」**，
# 散了就分不清"哪一行没写清楚"。生成器把三行**接进 JE 说明**（引擎显示的是
# `journal_entry.gui:742` 的 `GetReason`），所以它们真的会上屏。
[panel]
why = "三行是 G3 的判据载体：目标 / 最大压力与阻力 / 上次改主意的原因。放同一张表是为了让'缺哪一行'当场可见（生成器要求三行齐全，缺一行即退 2）。"

[panel.goal]
english = "Current goal: while the window is open, push through the reform that the old order has been blocking."
simp_chinese = "当前目标：趁窗口开着，把旧势力一直拦着的那项改革推过去。"
why = "第一行 = **当前目标**。写'推过去'而不是点名某条法律：改哪条法由 AI 与原版牌池决定，本档案不替它选（§0「让 AI 自己推导」）；写'旧势力拦着的那项'是让玩家知道它为什么一直没动 —— 与 [pressure.effects] 里减贵族那一条是同一个因果的两端。"

[panel.pressure]
english = "Biggest pressure and resistance: pressure — the landowners have lost their grip, the crown's authority is broken, the treasury borrows dear; resistance — the state standing firm on its own again."
simp_chinese = "最大压力与阻力：压力 = 贵族失势 + 王权威信破裂 + 借债成本高昂；阻力 = 等国家重新自己站稳。"
why = "第二行 = **最大压力与阻力**。压力项与 [pressure.effects] 的三条字段一一对应（贵族 / 合法性 / 利率），阻力项与 complete 的 legitimacy >= 75 是同一条判据的两种说法 —— 数值改了这行也要改（P9：一处改、三处同步）。"

[panel.last_change]
english = "Why it changed its mind: because the defeat was written into the books — losing the war is what moved the inputs the AI reads."
simp_chinese = "上次改主意的原因：因为战败被记进了账 —— 是这场败仗挪动了 AI 读到的那些输入。"
why = "第三行 = **上次改主意的原因**（G3 里最容易被跳过、却最关键的一行）：没有它，玩家只能看到'它在改革'，看不到'**为什么是现在**'。写'被记进了账'是让因果链读得出来（§0.1：目标函数表要显式可审）。"


# ── ⑨ 探针口径（B80：本档案盯哪条法；**留空 = 没查实**）────────────
#
# 为什么要有这张表：探针的行为层②原来写死 `NOT = { has_law = law_type:law_serfdom }`，
# 而**对没有农奴制的国家它立刻为真** ⇒ 会报出一个假的「法律换了」（奥斯曼/埃及实测踩到）。
# 现在按档案声明：查实了就写，没查实就留空（留空时那条判据**不产出**）。
[probe]
why = "**先留空，后来实测查实了（2026-09-23，改这一段时留痕）**：奥斯曼的历史文件里**没有**土地法那一组 —— `common/history/countries/tur - ottoman empire.txt` 第 16–23 行共 8 条 `activate_law`（monarchy / autocracy / millet_system / subjecthood / traditionalism / censorship / land_based_taxation / slave_trade），**没有** `lawgroup_land_reform` 那一条 ⇒ 开局那条由**引擎默认**决定，所以第一版**留空**（宁可不判，也不给一条会假的判据）。**现在有读数了**：跑满 66 个游戏月的那一局（`stage3_rerun.py --months 66 --archive tr_defeat --fresh-logs`），探针的月度 `LAW` 读数**全程只有 `law_serfdom` 一种**（63 个观测块，去重后就是 `['law_serfdom']`）—— 引擎默认给奥斯曼的土地法也是**农奴制**那一条（与埃及同一读数，两国都是「历史文件里没写、由引擎按政体默认给」）。`LAW` 读的是**土地改革那一组**的现行法（另两局分别在西班牙读出 `law_latifundias`、在巴伐利亚读出 `law_tenant_farmers`，与各自声明的值逐字一致 ⇒ 这条读数可信）。据此把它填上 —— 至此**九份档案全部声明了 `reform_law`**，套件里那条「法律换过没有」不再有空档。　【牌口径 · B86】`reform_card` =「意图层动没动」看哪张牌（判据是它**出现过**）：本档案开局那张政治牌不是它（逐份核过 common/history/ai/00_strategy.txt —— `c:AUS`（:62）与 `c:EGY`（:117）是 `conservative_agenda`、`c:RUS`（:87）是 reactionary、TUR/CHI/PER/SPA/BAV 没有块），所以它出现就是真的位移。⚠️ 那一局的实测是**一张政治牌都没读到**（`策略牌读数（去重）: []`）—— 见 `exec/阶段5-实机读数补记.md` §五：探针只记了三张政治议程牌，第四张（`egalitarian_agenda`）没被记，于是「别的牌」与「没有牌」在读数上长得一样。"
reform_law = "law_serfdom"
reform_card = "ai_strategy_progressive_agenda"
