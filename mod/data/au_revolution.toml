# ── ⑦ 递牌：本档案一张都不递 ───────────────────────────────
[cards]
why = "本档案**不使用自建策略牌**（F5：能改世界就不占槽）。革命潮 → 压力的链路由变量 + 修正 + JE 表达；⚠️ JE **不会**被原版牌读到（原版 212 处 has_journal_entry 全硬编码具名 JE，没有通用谓词，backlog B52），所以意图位移**不能**指望「开一个 JE 就被牌池读到」。要真的换路线，用（a）递**原版**的牌 `set_strategy`（B58）或（b）法律承诺 law commitment（B56/B57）—— 两者都是「整条路线要换」时的手段。**本档案为什么不递**：有判据可写的递牌法是「窗口开时递进步牌、窗口关时递回该国 1836 的初始牌」（`ru_defeat` 的 `[journal_entry.signals]` 就是这么写的），但**奥地利在原版里没有写下自己的初始落点** —— `common/history/ai/00_strategy.txt` 里只有具名国家块（`c:RUS` 在 :87-91、其中 :90 是 `set_strategy = ai_strategy_reactionary_agenda`；紧接着 :92 是 `c:TUR`），**没有 `c:AUS` 块**（本机实测：该文件里搜不到 AUS，AUS 只出现在 `00_behavior_variables.txt:6` 与 `00_secret_goals.txt` 的 secret goals 里）。照抄俄国那三行会把奥地利递到一个它从没站过的路线上 —— 那就不是「让 AI 自己推导」，是我们替它选。写这张表的判据需要先实测奥地利 1836 的初始牌与重抽落点（阶段 5 的 A/B 会话），在那之前**一张都不递**比递一张编的牌诚实。递牌的政治槽价格：S≈33 时权重 10 吃掉 23% 的份额（阶段 2 价格表）。"

