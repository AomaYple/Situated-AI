# 档案数据源 · 奥地利 单国「革命潮」（阶段 5 的第三种失败模式）
#
# ⚠️ 为什么要有这一份：前两份（`ru_defeat` 战败求存 / `tr_defeat` 骨架）都是**同一种**
#   失败模式（战败）。这一份要证明抽象撑得住**另一种** —— 革命潮不是「战败」换个国家：
#
#     * `[memory]` 记的是「经历过革命危机」，不是「战败过」；原版对**革命**有国家作用域的
#       判定钩子（`on_revolution_end` 的注释就写着 `# Root = Country`，见
#       00_code_on_actions.txt:5540-5542），而 `on_war_end` 只给 actor/target、不带胜负
#       （00_code_on_actions.txt:7043）—— 两份档案的「谁知道发生了什么」不是同一件事；
#     * `[pressure]` 里有一条 ru/tr 都没有的字段：`country_radicals_from_legitimacy_mult`
#       （合法性崩塌 → 激进派）。它是**革命潮的机制本身**，不是战败的后果；
#     * 它**刻意不用** ru/tr 的 `country_loan_interest_rate_add`：那个字段在原版里没有
#       可引的国家修正档位阶梯（`ru_defeat` 自己写着 0.35 属于实验取值），革命潮没有理由
#       继承一个没有原版依据的数字；
#     * JE 的分组与图标换成原版**革命危机那一族**（`je_group_crises` + `event_protest.dds`，
#       原版把 1848 的红色夏天 JE `je_red_summer` 就放在这一对上面）。
#
#   数值档位**沿用 `ru_defeat` 的实测档位**（阶段 3 的 A/B 读数），**未针对奥地利独立
#   校准** —— 每条 why 都写明了这一点，不许读成「实测过」。它是「加一处境 = 加一份
#   数据源」（G-EXIT-1）在**第三种失败模式**上的证明件，不是一份校准过的档案设计。
#
# 口径（P9 单一数据源 / P10 每个数字有依据 / F10 生成器优先）：
#
#   * 产物（`mod/` 下的脚本、本地化、档案文档）**全部由 `v3 modgen` 从本文件生成**，
#     手改产物没有用 —— 下次生成会被覆盖，闸门 ④ 也会报红；
#   * **每一张表都必须带非空 `why`**（数字、判据、文案、容器表一律如此）：空 `why`
#     由 `v3 modgen` 当场报错、闸门 ⑤ 复核 —— 这是 P10 从「纪律」变成「可执行检查」的那一步；
#   * 数字一律写成 `amount = N`（同表内配 `why`），缩写形式只有一个来源，
#     `why_report()` 与闸门 ⑤ 才能机械地枚举「每个数字 + 它的依据」。
#
# 为什么是 TOML：Python 3.11+ 标准库自带 `tomllib`，不新增依赖（P4），
# 而它同时有「表」与「数组」两种结构，正好表达「一组带依据的条目」。
#
# 本档案只做一件事：把**革命潮**变成真实世界状态（A 级：变量 + 修正 + JE），
# 让原版自己的权重公式转向改革。**一张牌都不递**（见 `[cards]`）。
#
# 为什么**没有** `[tempo]`：`defines` 没有单国写法，`[tempo]` 是全仓**一份**的 mod 级表
# （0 份或 2 份都由 `build_all` 当场报错，见 tools/pdx/modgen.py:1247-1265），那一份在
# `ru_defeat.toml` 里。本档案复用它，不复制它。

schema_version = 1

[archive]
id = "au_revolution"
title = "奥地利 · 革命潮"
country = "AUS"
# 档案对哪个引擎版本有效（写进 mod 元数据的 supported_game_version）。
# 钉住 1.14.3 = 阶段 2 三次探针局与本仓库知识库的口径版本；官方升级后
# 闸门 ①/② 会先红（原版键名变了），届时改这里而不是改产物。
game_version = "1.14.3"
why = "「帝国是从内部裂开的」这件事在原版里**没有账**：合法性照旧、激进派照旧被压着、守旧侧照旧在朝，于是「革命危机 → 改革」这条因果在原版里根本不存在。档案不替 AI 决定改什么，只把危机记成账、把压力落成真实的**合法性 / 激进派 / 保守 IG 势力**变化。为什么主角是奥地利：`01a` §K 的「奥地利」那一行写的就是**多民族、保守、财政脆弱、内陆市场**，而「敌人的位置」上写的是**民族主义从内部撕扯** —— 这是一份以内部合法性崩塌为机制的档案，不是「战败」的换名。tag = `AUS` 是本机实测确认的（`v3 evidence AUS` 命中原版 `common/country_definitions/00_countries.txt:93` 的 `AUS = {`，该文件的顶层键就是国家 tag），**不是猜的**。⚠️ 依据已于 2026-09-22 更正：原版 AI 策略里 212 处 has_journal_entry 全部硬编码**具名** JE，没有「读任意 JE」的通用谓词 ⇒ 我们自己的 JE 一张原版牌也喂不到（backlog B52）；真正把压力变成意图位移的通道是递牌（set_strategy，B58）与法律承诺（law commitment，B56/B57）。　【沿用·口径】本表的数值与依据**原样沿用** `ru_defeat.toml` 的实测档位（阶段 3 的 A/B 读数），**未针对本条处境独立校准**。"


# ── ② 革命危机记忆：真实世界状态的第一步 ─────────────────────
[memory]
variable = "sitai_au_revolution_memory"
effect = "sitai_au_revolution_shock"
why = "记忆本身不产生任何数值效果 —— 它是**判据**：JE 的 is_shown_when_inactive / possible 读它，于是「经历过革命危机」这件事变成可查的世界状态（阶段 1 已证：牌直接读 has_variable）。**与战败不同的一点**（也是本档案不是「战败换名」的地方）：原版对**革命**是有国家作用域的判定钩子的 —— `on_revolution_end` 上面两行注释就是 `# Root = Country` 与 `# scope:target = Uprising country`（00_code_on_actions.txt:5540-5542），`on_civil_war_won` 同样存在（00_code_on_actions.txt:5772）；而 `on_war_end` 只给 scope:actor / scope:target、不带胜负（00_code_on_actions.txt:7043）。也就是说「谁算经历过革命危机」在原版里**是可判的**。本档案仍然**不绑任何 on_action**：绑上就等于替 AI 决定了「什么时候算危机」，而这一版要的是「判据成立 → 窗口开」这条链能被**单独施加、单独关掉**（阶段 3 的 A/B 教训：两处处理段必须能分开施加）。冲击由施加方显式调用 `sitai_au_revolution_shock`。　【沿用·口径】判据形状沿用 `ru_defeat.toml`；本处境另指出战败与革命在「判定钩子」上的差别（有原版行号）。"

[[memory.params]]
key = "value"
amount = 1
why = "变量在判据里只被 has_variable 读，值不参与任何运算；写 1 而不是 yes，是为了将来要用 change_variable 记「第几次革命危机」时不用换类型（原版 set_variable = { name = recently_had_war value = yes } 用的是 yes，见 00_code_on_actions.txt:7046）。"

[[memory.params]]
key = "days"
amount = 3650
why = "10 年，与压力修正的 years = 10 同一时间尺度（两处必须一起改，否则会出现「记忆还在、压力已经没了」的半截状态）。对照原版给 recently_had_war 的是 days = 1825（5 年，00_code_on_actions.txt:7048），而原版 1848 革命事件给同类修正的写法是 days = short_modifier_time（events/1848.txt:430-433）—— 一次革命危机比「打过仗」更该留得久，故取 1825 的两倍。　【沿用·口径】3650 **沿用 `ru_defeat.toml` 的实测档位**（该值在其 why 里写作「战败比打过仗更该留得久，故取两倍」），**未针对本条处境独立校准**。"

# ── ③ 压力：真实的合法性 / 激进派 / 保守侧变化（A 级）────────
[pressure]
name = "sitai_au_revolution_pressure"
icon = "gfx/interface/icons/timed_modifier_icons/modifier_fire_negative.dds"
why = "压力必须是真的世界状态，不是我们的私有计数器 —— 只有真实变化才会进原版自己的公式（01a D 节：A 级被严重低估）。**这张表是与「战败」差别最大的地方**：三条字段里有一条（`country_radicals_from_legitimacy_mult`）是 ru/tr 都没有的，它把「合法性崩塌」直接接到「激进派」上 —— 那正是革命潮的机制本身；同时本档案**刻意不用** `country_loan_interest_rate_add`（ru/tr 的第三条）：原版该字段没有可引的国家修正档位阶梯（`ru_defeat` 自己的 why 里写着 0.35 是实验取值），革命潮没有理由继承一个没有原版依据的数字。icon 取 `modifier_fire_negative.dds`：原版那条「自由战争的遗产」修正（革命/内乱之后）用的就是它，见 00_ip4_04_modifiers.txt:173。⚠️ 与 ru/tr 一样，这一处是**实验用直接修正**（不绑任何 on_action，由施加方显式调用），正式版必须换成真实触发 + 因果链（backlog B35）。　【沿用·口径】三条里两条的**数值档位沿用 `ru_defeat` 的实测档位**（-35 / -0.30），**未针对本条处境独立校准**；激进派那一条取的是原版自己的档位（0.25，不是插值），见该条 why。"

[[pressure.params]]
key = "years"
amount = 10
why = "与 sitai_au_revolution_memory 的 days = 3650 对齐。原版 add_modifier 用 years 的写法见 00_movement_effects.txt:2-4（add_modifier = { name = … years = 20 }）；原版 1848 革命内容给同类修正的写法见 events/1848.txt:430-433。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

[[pressure.effects]]
key = "country_legitimacy_base_add"
amount = -35
why = "合法性是开窗判据的一半（JE 的 possible 读 `legitimacy <= 75` —— 为什么是 75 见 conditions 那条的依据）。**为什么取 -35**：它是 `ru_defeat` 在阶段 3 里**实测调过档**的值（先取 -20 跑一整局 B 组、窗口一次都没开 → 提到 -35；复算 `v3 ab --logs ab-run7`，B 段 55 块合法性分档 b70 24 / b75 18 / b80 13），也就是「把水位稳定压出一档、又不让政府一次失能」的那一档；本档案**原样沿用**，没有针对奥地利重跑 A/B。**这个数在原版里也真的存在**：`modifier_india_crown_rule` 就给 `country_legitimacy_base_add = -35`（content_304_modifiers.txt:249 是修正名、:254 是这个字段），同字段的原版阶梯为 +10 / +5 / -10 / -20 / -50（00_code_static_modifiers.txt:322、:331、:343、:353、:986）—— 所以 -35 落在 -20 与 -50 之间，方向与档位都不是我们发明的。**为什么不取原版那条 50 线**（00_liberalism.txt:54 的 `government_legitimacy >= 50`）：`ru_defeat` 实测过一次「判据取 50」，那一局（`ab-run3-done`，-35，61 个月）窗口从未开、法律全程没动 —— 同样的门槛在本档案里会重犯同一个错。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（-35），未针对本条处境独立校准**；原版同字段另有 -35（content_304_modifiers.txt:254）与 -50（00_code_static_modifiers.txt:986）两档可引。"

[[pressure.effects]]
key = "country_radicals_from_legitimacy_mult"
amount = 0.25
why = "**这一条就是革命潮的机制**（也是本档案与 ru/tr 最本质的差别）：该字段的语义是「**由低合法性产生的那部分激进派** × 倍率」，于是它与上面那条 `country_legitimacy_base_add = -35` 合起来构成一条**真实的因果链**：合法性塌 → 激进派涨。原版自己在同一个修正里就是这么配的 —— `modifier_legacy_of_the_liberal_wars`（自由战争的遗产）同时写 `interest_group_ig_landowners_pol_str_mult = -0.75`、`interest_group_ig_intelligentsia_pol_str_mult = 0.25`、`country_radicals_from_legitimacy_mult = 0.25`（00_ip4_04_modifiers.txt:172-178）：那正是「一场内乱之后：旧势力失势 + 激进主义抬头」这一族用法，与本处同型。**为什么取 0.25**：它是**原版档位本身**（00_ip4_04_modifiers.txt:177），不是插值；原版该字段的全部档位为 0.05（00_ip4_02_modifiers.txt:20，modifier_reduced_economic_objectives）、0.1（:64，modifier_economic_regeneration_postponed）、0.2（:71，modifier_failed_economic_regeneration；:104，modifier_divisive_press_campaign）、0.25（00_ip4_04_modifiers.txt:177）、1（agitators_3_modifiers.txt:81，fra_republican_unrest —— 法国共和派骚动，原版里离「革命潮」最近的一族）。取 0.25 而不是 1：0.25 是原版给「内乱之后」的档，1 是原版给**已经烧起来的那一场**的档 —— 本档案的窗口是「危机中」，不是「已经开战」。　【原版行号依据】不是实测读数，是原版同族用法（上面那一串行号，逐行打开确认过）。"

[[pressure.effects]]
key = "interest_group_ig_landowners_pol_str_mult"
amount = -0.30
why = "第三条：某个保守 IG 的势力。**选地主而不是虔诚派**：奥地利 1836 的守旧侧是**土地贵族**（多民族帝国的议会算术由贵族与民族运动共同决定，见 `01a` §K「奥地利」那一行：多民族、保守、财政脆弱），而且这个字段在**革命那一族**修正里就是原版的用法 —— `modifier_minor_royal_assassinated`（弑君的余波）就是 `interest_group_ig_landowners_pol_str_mult = -0.20`（agitators_4_revolution_modifiers.txt:319 与 :321）。**为什么取 -0.30**：它是 `ru_defeat` 实测调过档的值（-0.15 在一整局里没能让行为层动起来 → -0.30），本档案**原样沿用**；原版该字段的阶梯为 ±0.03（00_ip3_04_modifiers.txt:334）、-0.20（agitators_4_revolution_modifiers.txt:321）、-0.50（agitators_5_modifiers.txt:615）、-0.75（content_1_modifiers.txt:1465 的 shogun_ig_forced_to_open_market），-0.30 落在 -0.20 与 -0.50 之间。**为什么不是虔诚派（devout）**：它同样是奥地利的一条保守侧字段、原版档位也齐全（-0.25 见 00_ip4_04_modifiers.txt:141 的 modifier_devorismo，注释写着 `# Selling church lands`；-0.50 见 agitators_5_modifiers.txt:616；+0.15 见 106_modifiers.txt:224），但那一族的原版语义是「教产/教会权力被动」，而本档案要表达的是**革命把旧贵族的权威打掉**；两条字段只能选一条时选语义更贴的那条，`interest_group_ig_devout_pol_str_mult` 留给「政教冲突」那一类处境。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（-0.30），未针对本条处境独立校准**。"

# ── ④ 改革侧输入：把「改革的推力」也落成真实世界状态（A 级）────
#
# 为什么单独一张表、而不是往 [pressure] 里再加两条字段：阶段 3 的 A/B 阶梯要在**一局
# 之内**分两处施加 —— 第 13 月只加冲击，第 37 月才追加这一处。合进同一个修正就没有
# 「只加冲击」的那一段，两段的差分无从谈起。
[reform_inputs]
name = "sitai_au_reform_inputs"
effect = "sitai_au_reform_input"
icon = "gfx/interface/icons/timed_modifier_icons/modifier_lightbulb_positive.dds"
why = "**实验手段**（与 [pressure] 同一定位）：它是「改革派牌读得到的那两个输入」的直接修正，用来把 A/B 阶梯的第二处理段做成可施加、可关掉的一处。走 A 级而不是递牌的理由（F5）：原版 `ai_strategy_progressive_agenda` 的权重是**读**这两个 IG 的，改世界状态就等于改它的输入，不占任何槽位。⚠️ 正式的因果链应当是「革命危机 → 旧秩序失能 → 工业化/识字率的真实位移 → IG 势力自然变化」，而不是直接改政治力量；那条已进 backlog（B35）。**为什么「革命潮」也需要这一处**：革命潮开的是**改革窗口**，而窗口里真正被推着走的仍然是原版那两张读 IG 势力的议程牌 —— 只压合法性、不抬改革侧输入，等于只开门不给路。　【沿用·口径】本表的数值与依据**原样沿用** `ru_defeat.toml` 的实测档位（阶段 3 的 A/B 读数），**未针对本条处境独立校准**。"

[[reform_inputs.params]]
key = "years"
amount = 10
why = "与 [pressure.params] 的 years = 10、记忆变量的 days = 3650 三处对齐：三者在实验里是同一段时间窗，任何一处短了都会出现「输入还在、压力已经没了」的半截状态。原版 add_modifier 用 years 的写法见 00_movement_effects.txt:2-4。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

[[reform_inputs.effects]]
key = "interest_group_ig_industrialists_pol_str_mult"
amount = 0.5
why = "取原版同族强档 +0.5：`shogun_ig_forced_to_open_market`（content_1_modifiers.txt:1463-1471）在同一个修正里把地主 -0.75（:1465）、知识界 +0.5（:1466）、工业家 +0.5（:1467）一起写 —— 那正是「被外力逼着开门 → 改革侧势力抬头」这一族用法。原版全部档位为 0.1（00_ip4_03_modifiers.txt:7）、0.25（00_ip4_04_modifiers.txt:33）、0.5（content_1_modifiers.txt:1467），另有特例 2（content_304_modifiers.txt:251）。取 0.5 而不是 0.1：`progressive_agenda` 的权重只在 `ig:ig_industrialists ?= { is_powerful = yes }` 时 +10，而 is_powerful 是**相对份额**判定 —— 只抬一档常常翻不过那条线，实验要的是「输入明确到位」，不是「差一点」。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（0.5），未针对本条处境独立校准**；档位本身也是原版幕府那条的档（content_1_modifiers.txt:1467）。"

[[reform_inputs.effects]]
key = "interest_group_ig_intelligentsia_pol_str_mult"
amount = 0.5
why = "与工业家同档同源：`shogun_ig_forced_to_open_market`（content_1_modifiers.txt:1466）里这两条就是成对写的，而原版那条「自由战争的遗产」（伊比利亚自由战争之后）也把知识界 +0.25 与地主 -0.75 写成一对（00_ip4_04_modifiers.txt:174 与 :176）。原版该字段档位为 0.15（106_modifiers.txt:205）、0.25（00_ip4_04_modifiers.txt:176）、0.5（content_1_modifiers.txt:1466）。两条一起给才是原版的用法；只给一条会让「哪一条起了作用」在实验里不可分。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（0.5），未针对本条处境独立校准**；档位依据见上一条。"

# ── ⑤ 改革窗口 JE：把「处境」喂进原版的最短路径 ──────────────
[journal_entry]
name = "je_sitai_au_revolution_window"
group = "je_group_crises"
icon = "gfx/interface/icons/event_icons/event_protest.dds"
why = "为什么用 JE 而不是我们自己的牌：JE 的作用只有三条（2026-09-22 实测复核）——① 玩家可见性（G3 三行解释的载体）；② 世界状态判据（原版脚本可用 has_journal_entry = <本 JE 名> 读它）；③ `immediate` / `on_complete` 里递牌（本档案不用，见 `[cards]`）。⚠️ 它喂不到原版 AI 牌：原版 212 处 has_journal_entry 全部硬编码具名 JE，没有「读任意 JE」的通用谓词（backlog B52）。**group 与 icon 换成原版革命危机那一对**（这是本档案与 ru/tr 的又一处不同）：`je_group_crises`（定义见 00_journal_entries.txt:106）与 `event_protest.dds` —— 原版把 1848 革命潮里那条红色夏天 JE（`je_red_summer`）就放在这一对上面（00_peoples_springtime_je.txt:327 是 icon、:329 是 group）。ru/tr 用 `je_group_internal_affairs` + `event_portrait.dds`（00_corn_laws.txt:2 与 :4），是因为它们的处境是「战败后的内政」；本档案的处境是**危机**。　【沿用·口径】本表的数值沿用 `ru_defeat` 的实测档位，未针对本条处境独立校准；group 与 icon 是按本处境的语义另选的（有原版行号）。"

[[journal_entry.fields]]
key = "weight"
amount = 100
why = "JE 列表拥挤时的保留优先级。与原版 je_corn_laws 的 weight = 100 同档（00_corn_laws.txt:79）—— 处境级窗口不该被小 JE 挤掉。⚠️ 已知的档位差异：原版革命危机那两条 JE 用的是 10000（je_springtime_of_the_peoples，00_peoples_springtime_je.txt:315）与 9000（je_red_summer，00_peoples_springtime_je.txt:472）。本档案**刻意不取 1000/9000/10000**：那几档是原版核心历史内容 JE，本档案是与它们并行的处境窗口，压过它们会把原版自己的 1848 内容挤下去。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

[[journal_entry.conditions]]
gate = "is_shown_when_inactive"
key = "c:AUS"
op = "?="
arg = "this"
why = "档案是**单国**的，主角是奥地利。tag = `AUS` 是本机实测确认的（`v3 evidence AUS` 命中原版 `common/country_definitions/00_countries.txt:93` 的 `AUS = {`；该文件的顶层键就是国家 tag），不是猜的。`c:AUS ?= this` 这个写法在**奥地利自己的 JE** 里就是原版用法（05_austria_journal_entries.txt:10 的 `c:AUS ?= this`，在 `is_shown_in_lobby` 块里），问号的语义是「作用域存在才比」，比裸 = 稳。"

[[journal_entry.conditions]]
gate = "is_shown_when_inactive"
key = "has_variable"
arg = "sitai_au_revolution_memory"
why = "没被记过「革命危机」的国家连这条 JE 都不该看见 —— 「和平期占槽率 ≈ 0」这条出口判据（G-EXIT-5.2）靠它：不施加冲击的局里，这行判据为假，整条 JE 不出现。原版读变量的写法见 00_corn_laws.txt:7（`NOT = { has_variable = corn_laws_abolished }`）。　【沿用·口径】沿用 ru/tr 的判据形状，未针对本条处境独立校准。"

[[journal_entry.conditions]]
gate = "possible"
key = "has_variable"
arg = "sitai_au_revolution_memory"
why = "开窗的第一个条件：确实经历过革命危机。is_shown 与 possible 都写一遍是有意的 —— 前者管「看不看得见」，后者管「开不开」，原版 je_corn_laws 也是两处各写一套（00_corn_laws.txt:6-31）。　【沿用·口径】沿用 ru/tr 的判据形状，未针对本条处境独立校准。"

[[journal_entry.conditions]]
gate = "possible"
key = "legitimacy"
op = "<="
amount = 75
why = "开窗的第二个条件：压力够大。**为什么门槛是 75**：① 原版就用 75 做「政府站得住 / 站不住」的国家级分界（00_meiji_restoration.txt:314 的 `legitimacy >= 75`、01_french_monarchism.txt:329 的 `government_legitimacy >= 75`）；② 它同时是 `ru_defeat` 在阶段 3 里**实测校准**过的门槛（A 组无冲击时每一个观测月都 >80、不会误开；B 组 -35 时 55 块里有 42 块 ≤75）。本档案没有独立重跑 A/B：这个 75 **原样沿用 `ru_defeat` 的实测分界**。**为什么没有第二条「激进派」判据**（革命潮最想要的那一条）—— 查过原版 1.14.3，结论是**本 schema + 原版词汇表达不出来**，如实记在这里：`radicals_percentage` 在原版是 0 处（`v3 evidence radicals_percentage`：原版键 0 处、exe 也无字面量）；`radical_fraction` 是**块形式**的作用域取值（00_strike_triggers.txt:53-60、00_ip3_victoria_scripted_triggers.txt:193-196）；`political_movement_radicalism` 是**运动作用域**的（05_austria_journal_entries.txt:42-45 就是在 `any_political_movement = { … }` 里用它，00_meiji_restoration.txt:330 同）；唯一平铺可用的国家作用域写法是脚本化触发器 `any_insurrection_ongoing`（00_scripted_triggers.txt:1117），但它要求「已经出现叛乱运动」，比本窗口要表达的「危机中」更晚、也更严 —— 本档案**没有实测**它会不会让窗口一直不开，所以不拿它当门（`ru_defeat` 的教训：判据取 50 的那一局窗口一次都没开）。而生成器的判据渲染只支持平铺一行 `key op 操作数`（tools/pdx/modgen.py:180-182 的 `Clause.render`），块形式的写法在本 schema 里根本表达不出来。**于是激进派这条状态由 [pressure] 的字段承担**（它由引擎自己的激进派公式读，见 `country_radicals_from_legitimacy_mult` 那条 why），门只开在合法性上。相应地 `complete` 写 75，开与关正好接上。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位，未针对本条处境独立校准**；另两条原版 75 是先例。"

[[journal_entry.conditions]]
gate = "complete"
key = "legitimacy"
op = ">="
amount = 75
why = "关窗的门：国家重新站稳，窗口自己关上（不是「改革完成」—— 改什么由 AI 与原版牌池决定，本档案不替它选法律）。75 也是原版用过的档：00_meiji_restoration.txt:314 的 `legitimacy >= 75`、01_french_monarchism.txt:329 的 `government_legitimacy >= 75`。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

