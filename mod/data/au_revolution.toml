why = "三行解释里的「最大压力与阻力」写在这里（P11 可观测）：压力 = 合法性坍塌 + **合法性换来的激进派** + 旧贵族失势，阻力 = 「等国家重新站稳」—— 与 complete 的 `legitimacy >= 75` 是同一条判据的两种说法，数值改了文案也要改（P9：改一处、三处同步）。第二句刻意把 `country_radicals_from_legitimacy_mult` 的语义翻成人话（「每失去一分合法性，就多出一分激进派」），因为那是本档案与战败的机制差别，玩家应当读得出来。"

