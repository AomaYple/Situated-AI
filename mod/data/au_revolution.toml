[[localization]]
key = "je_sitai_au_revolution_window"
english = "Revolutionary Tide: A Window for Reform"
simp_chinese = "革命潮：改革窗口"
why = "G3 要求试玩者能复述「当前目标 + 主因」。标题只写目标（改革窗口）与来由（革命潮），不写机制 —— 与 ru/tr 的「战败求存」并列时，两个标题一眼能分出是**两种**处境。"

[[localization]]
key = "je_sitai_au_revolution_window_reason"
english = "The empire is coming apart from within. The crown's authority has collapsed, and every point of legitimacy it loses turns into another radical. The aristocracy that props up the old order is losing its grip.\\n\\nA window is open: while the government's legitimacy is shaken and the old guard is weak, reform is possible. It closes again once the state stands firm."
