# ── ⑨ 探针口径（B80：本档案盯哪条法；**留空 = 没查实**）────────────
#
# 为什么要有这张表：探针的行为层②原来写死 `NOT = { has_law = law_type:law_serfdom }`，
# 而**对没有农奴制的国家它立刻为真** ⇒ 会报出一个假的「法律换了」（奥斯曼/埃及实测踩到）。
# 现在按档案声明：查实了就写，没查实就留空（留空时那条判据**不产出**）。
[probe]
why = "**先留空，后来实测查实了（2026-09-23，改这一段时留痕）**：埃及的历史文件里**没有**土地法那一组 —— `common/history/countries/egy - egypt.txt` 第 11–18 行共 8 条 `activate_law`（monarchy / autocracy / people_of_the_book / per_capita_based_taxation / subjecthood / agrarianism / professional_army / slave_trade），**没有** `lawgroup_land_reform` 那一条 ⇒ 开局那条由**引擎默认**决定。所以第一版**留空**（宁可不判，也不给一条会假的判据）。**现在有读数了**：跑满 66 个游戏月的那一局（`stage3_rerun.py --months 66 --archive eg_debt --fresh-logs`），探针的月度 `LAW` 读数**全程只有 `law_serfdom` 一种**（69 个观测块，去重后就是 `['law_serfdom']`）—— 也就是说引擎默认给埃及的土地法就是**农奴制**那一条。`LAW` 读的是**土地改革那一组**的现行法（另两局分别在西班牙读出 `law_latifundias`、在巴伐利亚读出 `law_tenant_farmers`，与各自 `[probe].reform_law` 逐字一致 ⇒ 这条读数可信）。据此把它填上。⚠️ 同一族里**奥斯曼（tr_defeat）仍然留空** —— 它没有过这样一局实测，别照抄埃及这一条（B80 的教训：没实测过的判据会把窗口**静默关死**、或者报出一个假的「法律换了」）。　【牌口径 · B86】`reform_card` =「意图层动没动」看哪张牌（判据是它**出现过**）：本档案开局那张政治牌不是它（逐份核过 common/history/ai/00_strategy.txt —— `c:EGY`（:117）是 `conservative_agenda`、`c:AUS`（:62）也是 conservative、`c:RUS`（:87）是 reactionary、TUR/CHI/PER/SPA/BAV 没有块），所以它出现就是真的位移 —— 那一局实测就是 `['conservative_agenda', 'progressive_agenda']`。"
reform_law = "law_serfdom"
reform_card = "ai_strategy_progressive_agenda"
