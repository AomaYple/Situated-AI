# 档案数据源 · 巴伐利亚 单国「倒向谁」（阶段 5 · backlog B22 那一类的第一份）
#
# ⚠️ 为什么要有这一份：已入库的六份档案**全部是「大国 / 帝国在自己身上出问题」**
#   （`ru_defeat` 战败、`tr_defeat` 战败、`au_revolution` 革命潮、`cn_intervention` 列强干涉、
#   `eg_debt` 债务危机、`pe_great_game` 被两强夹击）。这一份不是：
#
#     * **主角是中等邦国**，既不是大国也不是帝国：巴伐利亚 1836 是**被列强承认的王国**
#       （common/country_definitions/00_countries.txt:480 的 `BAV = {`；:483 `country_type = recognized`、
#       :485 `tier = kingdom`、:487 `cultures = { south_german }`、:488 `capital = STATE_BAVARIA`）——
#       与埃及 / 波斯（都是 `unrecognized`）**正好相反**：它不需要「求承认」，
#       它的问题是**在两个已经承认它的强权之间站哪一边**。
#     * **它的最优解不是内部改革，是选边**：这一行写在 docs/design/01a-依据与参考.md:309
#       （「待校准……德意志中小邦、意大利诸邦、印度土邦、奥斯曼属国（它们的档案是「倒向谁」）」）
#       与 docs/design/backlog.md:171（B22）。本档案是那一类的第一份。
#
# ⚠️ **这也是六份以来第一次「处境本身写不进去」的档案**，所以先把结论写在最前面
#   （每一条的细节与行号在 [archive].why / [memory].why / [pressure].why / [journal_entry].why / [cards].why 里）：
#
#   **「倒向谁」在原版里是真实存在的，不是我们要发明的东西**（本机逐条打开确认）：
#     * 有**集团**：普鲁士的 Zollverein（关税同盟）集团，**巴伐利亚 1836 已经在里面**
#       —— common/history/power_blocs/00_power_blocs.txt:52 的 `c:PRU ?= {`、:54 的 `name = ZOLLVEREIN`、
#       :70 的 `member = c:BAV # 1834`；
#     * 有**两家同时来拉**：奥地利 → 巴伐利亚 +30（common/history/diplomacy/00_relations.txt:9）、
#       普鲁士 → 巴伐利亚 +30（同文件 :215），而巴伐利亚**自己**只写下一条关系：
#       对符腾堡 +50（同文件 :21，「第三种德国」那条路线）；
#     * 有**外交博弈**：`dp_unify_germany`（common/on_actions/00_code_on_actions.txt:2484）；
#     * 有**「你站哪边」的触发器**：`is_supporting_unification_candidate = { who = … country_formation = GER }`
#       （同文件 :2487 —— 原版自己就是这么读的）；
#     * 有**钩子**：`on_start_supporting_unification`（同文件 :7438，注释写着 Root = Country）
#       与 `on_stop_supporting_unification`（:7459）；
#     * 有 **JE 族**：common/journal_entries/00_german_unification.txt 那一族（:111 起）。
#
#   **而 schema v1 一样也写不了、读不了、挂不上**（这是抽象缺口，不是偷懒）：
#     * **写不了**：`[pressure].effects` 渲出来的是**静态修正的数值字段**
#       （tools/pdx/modgen.py:1209）；而「与谁的关系」要 `set_relations`
#       （原版写法：common/history/diplomacy/00_relations.txt:9）、「在谁的集团里」要 power bloc 机制
#       （`member = c:BAV`，common/history/power_blocs/00_power_blocs.txt:70）、「支持谁」要
#       `is_supporting_unification_candidate`（common/on_actions/00_code_on_actions.txt:2487）
#       —— **没有一个是修正字段**。
#     * **读不了**：JE 判据只支持平铺一行 `key op 操作数`（tools/pdx/modgen.py:185-186 的 `Clause.render`），
#       而原版读「你站哪边」**一律**带块或作用域操作数（`= { who = … }`，:2487；
#       `is_in_customs_union_with = scope:target_country`，common/ai_strategies/02_diplomatic_strategies.txt:1182）。
#     * **钩子挂不上**：schema 里**没有 on_action 这一格**（产物清单里根本没有 `common/on_actions/`
#       这一项 —— 冲击效果一律由实验显式调用）—— 而原版给「选边」留的钩子恰恰是 `on_start_supporting_unification`（:7438）。
#     * **意图递不出去**：原版的「统一德意志」意图挂在**外交槽**（`ai_strategy_unify_germany`，
#       `type = diplomatic`，common/ai_strategies/02_diplomatic_strategies.txt:1631），
#       而 schema 的递牌白名单只有**四张政治议程牌**（tools/pdx/modgen.py:679-686 的 `SET_STRATEGY_WHITELIST`）。
#
#   于是**本档案记的不是「选了哪一边」，是「选边的代价」**：一个中等邦国倒向某一方之后，
#   它自己的外交影响力就不再是自己的（新字段 `country_influence_mult` —— 前六份一份都没用过）、
#   王权要为这个选择花掉威信、靠关税保护吃饭的那一派会失势。这一半在原版里**一个字都没有**：
#   原版替集团（Zollverein 的成员表）与两强（德意志统一 JE）记了账，**没替被选的那一方记账**。
#   要真表达「选了哪一边」，需要的是**分支处境**（两条互斥 JE，或一个带取值的变量 + 条件分支）——
#   现在的唯一办法是把一个处境拆成两份档案，那属于改抽象（docs/design/exec/阶段5-档案扩张.md:41
#   「档案加不进去、必须写特例 ⇒ 抽象不对」），不属于加特例。**这一条如实报告，不用特例糊过去。**
#
# 口径（P9 单一数据源 / P10 每个数字有依据 / F10 生成器优先）：
#
#   * 产物（`mod/` 下的脚本、本地化、档案文档）**全部由 `v3 modgen` 从本文件生成**，
#     手改产物没有用 —— 下次生成会被覆盖，闸门 ④ 也会报红；
#   * **每一张表都必须带非空 `why`**（数字、判据、文案、容器表一律如此）：空 `why` 由
#     `v3 modgen` 当场报错、闸门 ⑤ 复核 —— 这是 P10 从「纪律」变成「可执行检查」的那一步；
#   * 数字一律写成 `amount = N`（同表内配 `why`），缩写形式只有一个来源，
#     `why_report()` 与闸门 ⑤ 才能机械地枚举「每个数字 + 它的依据」。
#
# 为什么是 TOML：Python 3.11+ 标准库自带 `tomllib`，不新增依赖（P4），
# 而它同时有「表」与「数组」两种结构，正好表达「一组带依据的条目」。
#
# 本档案只做一件事：把**选边的代价**变成真实世界状态（A 级：变量 + 修正 + JE），
# 让原版自己的权重公式转向。**一张牌都不递**（见 `[cards]`）。

schema_version = 1

[archive]
id = "bv_alignment"
title = "巴伐利亚 · 倒向谁"
country = "BAV"
# 档案对哪个引擎版本有效（写进 mod 元数据的 supported_game_version）。
# 钉住 1.14.3 = 阶段 2 三次探针局与本仓库知识库的口径版本；官方升级后
# 闸门 ①/② 会先红（原版键名变了），届时改这里而不是改产物。
game_version = "1.14.4"
why = "**修的是什么毛病**：原版 1.14.3 把「德意志诸邦在普奥之间」这件事**记在别人的账上**，只记了三样：① **集团**（普鲁士的 Zollverein，成员表里明写 `member = c:BAV # 1834`，common/history/power_blocs/00_power_blocs.txt:70 —— 也就是巴伐利亚 1836 的**经济**已经在普鲁士那一边）；② **两强的争夺**（奥地利对巴伐利亚 +30、普鲁士对巴伐利亚 +30，common/history/diplomacy/00_relations.txt:9 与 :215，两家出的价一样）；③ **德意志问题本身**（`je_german_unification_idea` 起的那一族 JE，common/journal_entries/00_german_unification.txt:111，用 `country_has_primary_culture = cu:south_german`（:9）与 `is_in_geographic_region = geographic_region_german_confederation`（:11）把问题**圈在德意志邦联里**，并按威望挑统一候选人（:157-179））。**缺的是被选的那一方自己的账**：巴伐利亚 1836 一手在普鲁士的关税同盟里、一手与维也纳热络（+30）、还单独握着对符腾堡 +50 那条「第三种德国」的线（00_relations.txt:21）—— 而这个**双重位置要付什么代价**，世界上一个字都没有：朝廷照旧、地主照旧在朝（common/history/countries/bav - bavaria.txt:15-17）、外交影响力照旧。于是「在两个大国之间选边 → 代价与重新站队」这条因果在原版里不存在。本档案不替 AI 决定倒向谁，只把**选边的代价**记成账、落成真实的外交影响力 / 合法性 / 派系变化，让原版自己那张读 IG 的权重公式（`ai_strategy_progressive_agenda`，common/ai_strategies/03_political_strategies.txt:374 是块头、:528-544 读知识界与工业家是否 powerful）自己转向。⚠️ **主角身份本机实测确认**（不是猜）：tag = `BAV`（common/country_definitions/00_countries.txt:480 的 `BAV = {`，该文件的顶层键就是国家 tag），该块 :483 `country_type = recognized`、:485 `tier = kingdom`、:487 `cultures = { south_german }`、:488 `capital = STATE_BAVARIA`。⚠️ **与 eg/pe 的制度差别正在这一行上**：埃及与波斯都是 `unrecognized`（未获列强承认 ⇒ 处境是「求承认 / 被人交易」），巴伐利亚是 `recognized` 的王国 ⇒ 它的处境**不是求生存，是选靠山**。⚠️ **主角的初始落点实测**：`common/history/ai/00_strategy.txt` 里**没有 `c:BAV` 块**（该文件的具名块是 `c:AUS`（:62）、`c:PRU`（:82）、`c:RUS`（:87）、`c:TUR`（:92））—— 影响见 `[cards]`。⚠️ 依据已于 2026-09-22 更正（沿用六份档案的共同结论）：原版 AI 策略里 212 处 has_journal_entry 全部硬编码**具名** JE，没有「读任意 JE」的通用谓词 ⇒ 我们自己的 JE 一张原版牌也喂不到（backlog B52）；真正把压力变成意图位移的通道是递牌（set_strategy，B58）与法律承诺（law commitment，B56/B57）—— 而本处境**连递牌通道都用不上**（见 `[cards]`）。　【沿用·口径】本表的数值与依据**原样沿用** `ru_defeat.toml` 的实测档位（阶段 3 的 A/B 读数），**未针对本条处境独立校准**；本档案**独立取档的只有一条**（`country_influence_mult = -0.10`，依据是原版自己那条同语义修正），那一条的 why 里写明了它同样**没有实测过本处境的效果**。"


# ── ② 选边记忆：真实世界状态的第一步 ────────────────────────
# 为什么字段名叫 memory 而不是「选边记忆」：schema v1 的这张表就是「处境发生过」的那张账
# （变量 + 写它的效果），本档案往里记的是**选边这件事发生过**，不是败仗、也不是革命。
[memory]
variable = "sitai_bv_alignment_memory"
effect = "sitai_bv_alignment_shock"
why = "记忆本身不产生任何数值效果 —— 它是**判据**：JE 的 is_shown_when_inactive / possible 读它，于是「选边发生过」这件事变成可查的世界状态（阶段 1 已证：牌直接读 has_variable）。**本档案在这里遇到的第一处抽象缺口：记忆变量记不了「选了哪一边」**。理由不是我们没写全，是 schema 的写法本身就只有一个含义：变量由 `set_variable = { name = … value = 1 }` 写死（tools/pdx/modgen.py:1122-1125），读它的判据只有平铺的 `has_variable`（原版读法见 common/journal_entries/00_corn_laws.txt:7 的 `NOT = { has_variable = corn_laws_abolished }`），而「值等于几」要 `check_variable = { which = … value >= N }` 那种**块形式**，渲染不出来（tools/pdx/modgen.py:185-186）。于是本档案能表达的是**「选过边」**，不是**「倒向普 / 倒向奥」** —— 后者要么两份档案各一个变量，要么抽象里补「分支处境」这一层（如实报告，见文件头）。**谁把选边判成选边，本档案不猜、也不绑 on_action**（与既有档案同一口径）：原版**确实给这件事留了钩子**（本机实测：`on_start_supporting_unification`，common/on_actions/00_code_on_actions.txt:7438，注释 `# Root = Country`；`on_stop_supporting_unification`，:7459；`on_unification_candidate_added`，:7445），但 schema 里**没有 on_action 这一格**（生成器不产出 `common/on_actions/` 下的任何文件）⇒ 判定只能留在施加方：`sitai_bv_alignment_shock` 由调用方显式执行（本档案不绑任何 on_action —— 绑了就等于替 AI 决定「什么时候算选完边」，而这一版要的是「判据成立 → 窗口开」这条链能被单独施加、单独关掉）。　【沿用·口径】判据形状沿用 `ru_defeat.toml`（变量 + 显式冲击效果），**未针对本条处境独立校准**；「原版有钩子而 schema 没有那一格」是本机实测结论（行号见上）。"

[[memory.params]]
key = "value"
amount = 1
why = "变量在判据里只被 has_variable 读，值不参与任何运算；写 1 而不是 yes，是为了将来要用 change_variable 记「第几次选边」时不用换类型（原版 `set_variable = { recently_had_war … }` 那一处甚至没有 value，见 common/on_actions/00_code_on_actions.txt:7046-7048）。⚠️ 注意：**就算将来用 change_variable 记次数，也仍然记不了「选了哪一边」** —— 那要的是两个互斥的含义，不是一个递增的数（如实写在这里，免得后人以为加个计数就解决了）。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

[[memory.params]]
key = "days"
amount = 3650
why = "10 年，与压力修正的 `years = 10` 同一时间尺度（两处必须一起改，否则会出现「记忆还在、压力已经没了」的半截状态）。**这个尺度在本处境上有一条比 ru_defeat 更贴题的原版先例**：原版自己把「10 年」定成一个具名刻度 —— `long_modifier_time = 3650 # 10 years`（common/script_values/event_values.txt:41，同处 :40 是 5 年的 normal_modifier_time、:42 是 15 年的 moderately_long_modifier_time），而**用它的事件之一正是「中等国家选择与大国合作」那一个**：埃及危机事件里「与列强合作」的选项给 `working_with_the_great_powers` 挂的时长就是 `days = long_modifier_time`（events/egyptian_crisis_events.txt:50）—— 也就是原版对「选边」这件事的窗口**本来就是十年**。对照原版给 recently_had_war 的是 `days = 1825`（5 年，common/on_actions/00_code_on_actions.txt:7048）：站队与依附关系比「打过一场仗」更该留得久，因为关税同盟、邦联投票与王朝联姻都是以十年计的。　【沿用·口径】天数**沿用 `ru_defeat.toml` 的 3650**（该值在其 why 里写作「战败比打过仗更该留得久，故取两倍」），本处境只是换了一条**更贴题**的原版刻度来支撑同一个数（`long_modifier_time`，行号见上），**未独立校准**。"

# ── ③ 压力：真实的「选边代价」（A 级）──────────────────────
#
# 三条字段合起来表达的是：**选边不是免费的，而且账单开在选的人自己身上**。
# 与六份既有档案的差别：第一条换了**从没有人用过的字段**（外交影响力），
# 而不是合法性 / 借债成本 / 守旧派这三样的又一次组合；第二条与第三条沿用档位。
# ⚠️ 这份表**表达不了「倒向谁」本身** —— 那需要关系 / 集团成员 / 外交槽意图，
# schema 三样都写不了（理由与行号写在文件头与 [cards].why 里）。
[pressure]
name = "sitai_bv_alignment_pressure"
icon = "gfx/interface/icons/timed_modifier_icons/modifier_statue_negative.dds"
why = "压力必须是真的世界状态，不是我们的私有计数器 —— 只有真实变化才会进原版自己的公式（01a D 节：A 级被严重低估）。三条字段覆盖「选边」这件事在**选的人自己身上**留下的三笔账：**① 外交影响力不再是自己说了算**（新字段 `country_influence_mult`）、**② 王权为这个选择花掉的威信**（合法性）、**③ 靠关税保护吃饭的那一派失势**（地主）。**icon 取 `modifier_statue_negative.dds`** —— 这个图在原版里就是「外交影响力出问题」那一族的图：`working_with_the_great_powers`（common/static_modifiers/105_modifiers.txt:557，本档案第一条字段的原版同语义修正）与 `negative_crisis_influence`（common/static_modifiers/00_ip3_03_modifiers.txt:203）用的都是它，方向一致。⚠️ **本表与 `[reform_inputs]` 都是实验用直接修正，不是正式版设计**：它们由施加冲击的一方显式调用（不绑任何 on_action，调用点是 scripted effect `sitai_bv_alignment_shock`）；正式版必须改成真实触发 + 因果链（选边 → 关税与市场准入的真实位移 → 派系与财政的自然变化），那条已进 backlog（B35）。本定位同时写在 exec/阶段3-结果.md 与 exec/阶段3-归档清点.md，避免后人把实验设置当成档案设计。⚠️ **本表写不进去的东西，逐条记在这里**（02 三行原文：档案加不进去 ⇒ 说明抽象不对）：关系值是 `set_relations` 效果（原版写法 common/history/diplomacy/00_relations.txt:9），集团成员是 power bloc 的 `member =` 行（common/history/power_blocs/00_power_blocs.txt:70），「支持哪一位统一候选人」是 `is_supporting_unification_candidate`（common/on_actions/00_code_on_actions.txt:2487）—— 三者都不是静态修正字段，而修正体里能写的只有数值字段（tools/pdx/modgen.py:1209）。唯一一个字面上就是「选边」的原版国家修正字段是 `power_bloc_leverage_generation_mult`（集团对成员的杠杆），但它**只出现在一个 power bloc 修正里**（`modifier_portugal_fifth_empire_pb`，common/static_modifiers/00_ip4_04_modifiers.txt:527 是修正名、:529 是这个字段），是**集团作用域**的字段；挂到国家上不是同一回事，本档案**不用它**（作用域不对 + 未实测，两个理由都写在明处）。　【沿用·口径】**三条里两条的数值沿用 `ru_defeat` 的实测档位（-35 / -0.30），未针对本条处境独立校准**；第一条（-0.10）**不是沿用**，它是原版自己那条同语义修正的档，见那一条 why。"

[[pressure.params]]
key = "years"
amount = 10
why = "与 sitai_bv_alignment_memory 的 `days = 3650` 对齐，也与原版那个 10 年刻度 `long_modifier_time = 3650`（common/script_values/event_values.txt:41）同尺度。原版 `add_modifier` 用 `years` 的写法见 common/scripted_effects/00_movement_effects.txt:2-4（`add_modifier = { name = initial_movement_enthusiasm years = 20 }`）。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

[[pressure.effects]]
key = "country_influence_mult"
amount = -0.10
why = "**这一条是本档案与六份既有档案最硬的差别：前六份没有一份用过 `country_influence_mult`**（它们压的是合法性 / 借债利率 / 地主 / 虔诚派 / 工业家 / 知识界）。**为什么选边的第一笔账是外交影响力**：一个中等邦国的地缘资产只有一样 —— **它还能在两边之间当中间人**。一旦倒向某一方，关税由别人的同盟定（巴伐利亚 1834 就进了普鲁士的 Zollverein，common/history/power_blocs/00_power_blocs.txt:70）、投票跟着别人的集团走，**它说话就不再算数了**。这不是我们发明的方向，原版对同一个语义有现成的修正，**值也一样**：`working_with_the_great_powers`（common/static_modifiers/105_modifiers.txt:556-559：:557 是 icon、:558 就是 `country_influence_mult = -0.1`）—— 它出现的唯一一处是**埃及危机事件里「与列强合作」那个选项**（events/egyptian_crisis_events.txt:41 的 option、:47 那行注释 `# country_influence_mult`、:48-51 的 add_modifier），也就是说：**一个中等国家选择与大国合作，原版当场给它的就是这一档**。同族另有 -0.10 两处：`modifier_failed_korean_intervention`（common/static_modifiers/07_sphere_of_influence_4_modifiers.txt:288-292）、`the_grand_collapse_relation_speed_mod`（common/static_modifiers/content_4_modifiers.txt:781-786）；更重的档 -0.20 见 `negative_crisis_influence`（common/static_modifiers/00_ip3_03_modifiers.txt:202-207），-0.25 见 common/static_modifiers/brazil_1_modifiers.txt:133，正向档 +0.10 见 common/static_modifiers/00_ip3_03_modifiers.txt:209-212。**为什么取 -0.10 而不是更重的 -0.20**：-0.20 那一档原版自己标的是 crisis（修正名就叫 `negative_crisis_influence`），而本档案要表达的是**常态的依附** —— 选边之后国家照旧活动、照旧借债、照旧结盟，只是不再是自己说了算。取原版**同一个语义**（working with the great powers）的那一档更贴。⚠️ **诚实项**：-0.10 是**原版档位本身**（不是插值、不是沿用 ru 的实测），但**它对本处境的效果大小没有实测过** —— 本档案没有为巴伐利亚跑过 A/B，试玩者若发现它太轻或太重，改的是这一个数（P9）。"

[[pressure.effects]]
key = "country_legitimacy_base_add"
amount = -35
why = "合法性是开窗判据的一半（JE 的 possible 读 `legitimacy <= 75` —— 为什么是 75 见下面 conditions 那条的依据）。**为什么选边会打到合法性**：这不是「政府失能」，是**朝廷把话说死了** —— 倒向普鲁士，靠王朝-教派本位站住的那一半说它把德意志卖了；倒向奥地利，主张德国统一的那一半说它把德意志让给了维也纳；而两边都得罪不起，它却必须挑一个。原版承认这个方向：同一个字段在「外力逼着开门」那一族里被用过（`opium_wars_lost` 给 `country_legitimacy_base_add = -50`，common/static_modifiers/content_1_modifiers.txt:17）—— 被外力按住的一方威信受损，原版是认的。⚠️ **同族里还有一条方向相反、不能引的**：`shogun_ig_forced_to_open_market` 同时写 `country_legitimacy_headofstate_add = -50` 与 `country_legitimacy_base_add = 30`（common/static_modifiers/content_1_modifiers.txt:1468-1469），那个正 30 的注释写着 `# Allows formation of alternative governments`（让替代政府能成立），方向与本处相反，**只可引 -50 那一条**。**为什么取 -35**：它是 `ru_defeat` 在阶段 3 里**实测调过档**的值（先取 -20 跑一整局 B 组、窗口一次都没开 → 提到 -35；复算 `v3 ab --logs ab-run7`，B 段 55 块合法性分档 b70 24 / b75 18 / b80 13），也就是「把水位稳定压出一档、又不让政府一次失能」的那一档；本档案**原样沿用**，**没有针对巴伐利亚重跑 A/B**。原版同字段的档位阶梯为 +10 / +5 / -10 / -20（common/static_modifiers/00_code_static_modifiers.txt:322、:331、:343、:353）与 -50（同文件 :986 的 low_electoral_confidence），-35 落在 -20 与 -50 之间，方向与档位都不是我们发明的。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（-35），未针对本条处境独立校准**。"

[[pressure.effects]]
key = "interest_group_ig_landowners_pol_str_mult"
amount = -0.30
why = "第三条：**被选边动到的那一侧**。**为什么是地主**（ru/tr/eg 也用 landowners，但那是**别的国家的推导**，不是一条通则）—— 本处境有两条自己的依据：① **本机实测**：巴伐利亚 1836 开局**在朝的就是地主**，common/history/countries/bav - bavaria.txt:15-17 的 `ig:ig_landowners ?= { add_ruling_interest_group = yes }`（同一个文件 :3-4 是 effect_starting_technology_tier_2_tech 与 effect_starting_politics_conservative，:5 是唯一一条直接写的法 `law_freedom_of_conscience`）；② **选边要动的正是他们的地盘**：Zollverein 把关税权交到普鲁士手里（巴伐利亚 1834 加入，common/history/power_blocs/00_power_blocs.txt:70），而关税是农业保护的地盘 —— 「照旧过、别跟普鲁士走」的正是这一伙人，所以一旦倒向普鲁士的秩序，**失势的是他们**。**这个字段在原版里也有同族用法**：-0.20（`modifier_minor_royal_assassinated`，common/static_modifiers/agitators_4_revolution_modifiers.txt:319 是修正名、:321 是这个字段）、-0.75（`shogun_ig_forced_to_open_market`，common/static_modifiers/content_1_modifiers.txt:1465，与知识界 +0.5、工业家 +0.5 成对写）、正向 +0.25（common/static_modifiers/00_ip4_04_modifiers.txt:12）。**为什么取 -0.30**：它是 `ru_defeat` 实测调过档的值（-0.15 在一整局里没能让行为层动起来 → -0.30），本档案**原样沿用**；-0.30 落在原版 -0.20 与 -0.50 之间，方向明确、又不把这一侧一次打垮（一次打垮会让议会算术失去张力）。**为什么不是虔诚派（devout）**：巴伐利亚的教派问题在开局那条 `law_freedom_of_conscience`（common/history/countries/bav - bavaria.txt:5）上已经落地，而选边动的是**关税与市场**（地主的地盘），不是政教关系 —— devout 留给「政教冲突 / 变卖教产」那一类处境（eg_debt 的 why 里也是这么分的）。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（-0.30），未针对本条处境独立校准**；换字段的判断依据是实测的在朝 IG 与原版对巴伐利亚的建模（上面那一串行号），**不是实测**。"

# ── ④ 现代化侧输入：选边在国内留下的那一半（A 级）────────────
#
# 为什么单独一张表、而不是往 [pressure] 里再加两条字段：阶段 3 的 A/B 阶梯要在**一局
# 之内**分两处施加 —— 第 13 月只加冲击（B 段），第 37 月才追加这一处（B2 段）。
# 合进同一个修正就没有「只加冲击」的那一段，两段之间的差分无从谈起。
#
# ⚠️ 这张表的名字是 schema 的（reform_inputs），但**它在本处境里不是「改革」**：
# 它记的是「倒向普鲁士那一边的经济秩序之后，靠德国市场吃饭的那一派抬头」。
[reform_inputs]
name = "sitai_bv_reform_inputs"
effect = "sitai_bv_reform_input"
icon = "gfx/interface/icons/timed_modifier_icons/modifier_lightbulb_positive.dds"
why = "**定位**：它是「现代化那一侧的输入」的直接修正，用来把 A/B 阶梯的第二处理段做成可施加、可关掉的一处。走 A 级而不是递牌的理由（F5）：原版 `ai_strategy_progressive_agenda` 的权重是**读**这两个 IG 的（common/ai_strategies/03_political_strategies.txt:374 是块头、:528-544 是读知识界与工业家是否 powerful 的那两段），改世界状态就等于改它的输入，不占任何槽位。**为什么巴伐利亚的这一处落在工业家与知识界**（依据是本机实测的原版数据，不是照抄）：① 原版把巴伐利亚放进了普鲁士的 Zollverein（common/history/power_blocs/00_power_blocs.txt:70）—— 关税同盟本来就是「市场整合 → 工业化」这件事在原版里的写法，而整合的受益者是工业家；② 原版给巴伐利亚的起点里**已经有铁路与集约农业**（common/history/countries/bav - bavaria.txt:7-8 的 `add_technology_researched = railways` 与 `intensive_agriculture`），也就是原版自己认为它 1836 站在铁路时代门口；③ 原版还给它的**学校制度投到 2 级**（同文件 :10-13 的 `institution_schools … level = 2`）—— 识字与教育那一侧有底子，对应知识界。**⚠️ 必须写明的让步**：本处境真正该动的是**外交槽**（倒向谁），而 schema 的递牌通道只认四张**政治**议程牌（tools/pdx/modgen.py:679-686），外交槽的意图（如 `ai_strategy_unify_germany`，`type = diplomatic`，common/ai_strategies/02_diplomatic_strategies.txt:1631）**递不出去**；所以这张表**只记选边在国内留下的那一半**，把「倒向谁」本身留给原版的集团与 JE（那是它们的账）。⚠️ 正式的因果链应当是「选边 → 关税与市场准入的真实位移 → 工业化与识字率的位移 → IG 势力自然变化」，而不是直接改政治力量；那条已记进 backlog（B35）。　【沿用·口径】本表的数值与依据**原样沿用** `ru_defeat.toml` 的实测档位（阶段 3 的 A/B 读数），**未针对本条处境独立校准**。"

[[reform_inputs.params]]
key = "years"
amount = 10
why = "与 [pressure.params] 的 `years = 10`、记忆变量的 `days = 3650` 三处对齐：三者在实验里是同一段时间窗，任何一处短了都会出现「输入还在、压力已经没了」的半截状态。原版 `add_modifier` 用 `years` 的写法见 common/scripted_effects/00_movement_effects.txt:2-4。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

[[reform_inputs.effects]]
key = "interest_group_ig_industrialists_pol_str_mult"
amount = 0.5
why = "取原版同族强档 +0.5，而且这一档在本处境的语义上**有同型先例**：`shogun_ig_forced_to_open_market`（common/static_modifiers/content_1_modifiers.txt:1463-1471）在同一个修正里把地主 -0.75（:1465）、知识界 +0.5（:1466）、工业家 +0.5（:1467）一起写 —— 那就是「被外力逼着开门 → 改革侧势力抬头」，与本档案要表达的「倒向普鲁士的市场秩序 → 现代化派抬头」同型（幕府与巴伐利亚，同一时代的同一种外部经济压力）。原版同字段的档位为 0.1（common/static_modifiers/00_ip4_03_modifiers.txt:7）、0.25（common/static_modifiers/00_ip4_04_modifiers.txt:33）、0.5（content_1_modifiers.txt:1467）。取 0.5 而不是 0.1：`progressive_agenda` 的权重只在 `ig:ig_industrialists ?= { is_powerful = yes }` 时 +10（common/ai_strategies/03_political_strategies.txt:537-544），而 `is_powerful` 是**相对份额**判定 —— 只抬一档常常翻不过那条线，实验要的是「输入明确到位」，不是「差一点」。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（0.5），未针对本条处境独立校准**；档位本身也是原版幕府那条的档（common/static_modifiers/content_1_modifiers.txt:1467）。"

[[reform_inputs.effects]]
key = "interest_group_ig_intelligentsia_pol_str_mult"
amount = 0.5
why = "与工业家同档同源：`shogun_ig_forced_to_open_market`（common/static_modifiers/content_1_modifiers.txt:1466）里这两条就是成对写的，而原版那条「自由战争的遗产」也把知识界 +0.25 与地主写成一对（common/static_modifiers/00_ip4_04_modifiers.txt:47）。原版该字段档位为 0.15（common/static_modifiers/106_modifiers.txt:205）、0.25（00_ip4_04_modifiers.txt:47）、0.5（content_1_modifiers.txt:1466）。两条一起给才是原版的用法；只给一条会让「哪一条起了作用」在实验里不可分。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位（0.5），未针对本条处境独立校准**；档位依据见上一条。"

# ── ⑤ 「倒向谁」的窗口 JE：把处境喂进原版的最短路径 ──────────
[journal_entry]
name = "je_sitai_bv_alignment_window"
group = "je_group_german_unification"
icon = "gfx/interface/icons/event_icons/waving_flag.dds"
why = "为什么用 JE 而不是我们自己的牌：JE 的作用只有三条（2026-09-22 实测复核）——① 玩家可见性（G3 三行解释的载体）；② 世界状态判据（原版脚本可用 `has_journal_entry = <本 JE 名>` 读它）；③ `immediate` / `on_complete` 里递牌（本档案不用，见 `[cards]`）。⚠️ 它喂不到原版 AI 牌：原版 212 处 `has_journal_entry` 全部硬编码具名 JE，没有「读任意 JE」的通用谓词（backlog B52）。**group 与 icon 都按本处境另选，而且选的是原版自己那一对**：`je_group_german_unification`（定义见 common/journal_entry_groups/00_journal_entries.txt:44-47，就是一个普通的 `context = country` 分组，没带任何额外条件）—— 原版三条德意志 JE 用的都是它（common/journal_entries/00_german_unification.txt:4、:114、:202、:323），而本档案的处境**就是德意志问题**（普奥之间、邦联之内），不是内政（ru/tr 用 `je_group_internal_affairs`，定义见 00_journal_entries.txt:112-114），也不是某一国的历史内容族（cn 用 `je_group_qing`）。icon 用 `gfx/interface/icons/event_icons/waving_flag.dds` —— **原版德意志统一那一族 JE 用的就是这一张图**（00_german_unification.txt:2、:112、:200、:259、:321），不是我们另挑的。⚠️ **本档案的 JE 判据只能是「结构性 + 合法性」，读不到「你到底站哪边」**：原版读这件事一律带块或作用域操作数（`is_supporting_unification_candidate = { who = … country_formation = GER }`，common/on_actions/00_code_on_actions.txt:2487；`is_in_customs_union_with = scope:target_country`，common/ai_strategies/02_diplomatic_strategies.txt:1182），而生成器的判据渲染只支持平铺一行（tools/pdx/modgen.py:185-186）—— 这是**让步**，如实记在这里。　【沿用·口径】本表的**结构与数值**沿用 `ru_defeat.toml` 的实测档位，**未针对本条处境独立校准**；group 与 icon 是按本处境的语义另选的（有原版行号）。"

[[journal_entry.fields]]
key = "weight"
amount = 100
why = "JE 列表拥挤时的保留优先级。与原版 `je_corn_laws` 的 `weight = 100` 同档（common/journal_entries/00_corn_laws.txt:79）—— 处境级窗口不该被小 JE 挤掉。⚠️ 已知的档位差异：**原版德意志统一那一族 JE 用的是 1000**（`je_schleswig_holstein_question`，common/journal_entries/00_german_unification.txt:106；`je_german_unification_idea`，:194；`je_north_german_unification`，:253）。本档案**刻意不取 1000**：那是原版核心历史内容 JE，本档案是与它并行的处境窗口，压过它会把原版自己的德意志问题挤下去。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

[[journal_entry.conditions]]
gate = "is_shown_when_inactive"
key = "c:BAV"
op = "?="
arg = "this"
why = "档案是**单国**的，主角是巴伐利亚。tag = `BAV` 是**本机实测确认**的：`common/country_definitions/00_countries.txt:480` 就是 `BAV = {`（原版国家定义文件的顶层键就是国家 tag）。**平铺写法 `c:BAV ?= this` 在巴伐利亚身上有原版先例**（这点与 eg_debt 不同：原版写埃及一律用块形式）：common/character_templates/historical_agitators.txt:172 就是 `c:BAV ?= this`；另一处见 common/customizable_localization/ip3_custom_loc.txt:137。问号的语义是「作用域存在才比」，比裸 `=` 稳。　【沿用·口径】写法沿用 ru/tr/cn，未针对本条处境独立校准；单国门这一行是按本档案主角换的（tag 与形式各有原版行号）。"

[[journal_entry.conditions]]
gate = "is_shown_when_inactive"
key = "country_has_primary_culture"
arg = "cu:south_german"
why = "**这是本档案比 ru/tr 多出来的一行，也是「倒向谁」这个处境的结构性前提**：普奥之间那件事只对**德意志诸邦**成立 —— 一个南德邦国才有「倒向普鲁士还是倒向奥地利」这个选择，别的国家没有。这条判据不是我们发明的分法：原版圈德意志问题用的就是这一行（`country_has_primary_culture = cu:south_german`，common/journal_entries/00_german_unification.txt:9，同族还有 :21、:30、:122、:135、:142、:165；北德那一半写在 :20、:29、:121、:134 等行）。巴伐利亚是 `cultures = { south_german }`（common/country_definitions/00_countries.txt:487，本机实测）⇒ 这条判据在它身上为真。　【原版行号依据】不是实测读数，是原版同族用法。"

[[journal_entry.conditions]]
gate = "is_shown_when_inactive"
key = "is_in_geographic_region"
arg = "geographic_region_german_confederation"
why = "**第二行结构性前提，与上一行成对**：德意志问题原版是**按地理圈**的，不是按文化圈 —— 这一行原版也写了（common/journal_entries/00_german_unification.txt:11，同族 :23、:118、:132）。它的语义对本档案尤其贴：**只要巴伐利亚还在德意志邦联这个框架里，「在普奥之间选边」这件事才成立**；一旦它被并进 GER / NGF / SGF（原版那条路就是 `change_tag = NGF` / `SGF`，events/german_unification.txt:127 与 :138），这段因果就换了性质 —— 那时它已经不是选边的一方，而是被合并掉的一方（那正是原版要玩家去争的结局）。　【原版行号依据】不是实测读数，是原版同族用法。"

[[journal_entry.conditions]]
gate = "is_shown_when_inactive"
key = "has_variable"
arg = "sitai_bv_alignment_memory"
why = "没被记过「选边」的国家连这条 JE 都不该看见 —— 「和平期占槽率 ≈ 0」这条出口判据（G-EXIT-5.2）靠它：不施加冲击的局里，这行判据为假，整条 JE 不出现。原版读变量的写法见 common/journal_entries/00_corn_laws.txt:7（`NOT = { has_variable = corn_laws_abolished }`）。　【沿用·口径】沿用 ru/tr/cn 的判据形状，未针对本条处境独立校准。"

[[journal_entry.conditions]]
gate = "possible"
key = "has_variable"
arg = "sitai_bv_alignment_memory"
why = "开窗的第一个条件：选边这件事确实发生过（记忆变量在）。`is_shown_when_inactive` 与 `possible` 都写一遍是有意的 —— 前者管「看不看得见」，后者管「开不开」，原版 `je_corn_laws` 也是两处各写一套（common/journal_entries/00_corn_laws.txt:6-31）。　【沿用·口径】沿用 ru/tr/cn 的判据形状，未针对本条处境独立校准。"

[[journal_entry.conditions]]
gate = "possible"
key = "legitimacy"
op = "<="
amount = 75
why = "开窗的第二个条件：压力够大。**为什么门槛是 75**：① 原版就用 75 做「政府站得住 / 站不住」的国家级分界（common/journal_entries/00_meiji_restoration.txt:314 的 `legitimacy >= 75`）；② 它同时是 `ru_defeat` 在阶段 3 里**实测校准**过的门槛（A 组无冲击时每一个观测月都 >80、不会误开；B 组 -35 时 55 块里有 42 块 ≤75）。本档案没有独立重跑 A/B：这个 75 **原样沿用 `ru_defeat` 的实测分界**。**⚠️ 本处境最想要的那条门（你到底倒向谁 / 你在不在别人的关税同盟里）写不进去，如实记在这里**：原版确有**平铺**的关税同盟触发器 —— `is_junior_in_customs_union = yes`（原版真的这么写：common/treaty_articles/25_trade_privilege.txt:52，取反的用法见 common/journal_entries/00_prohibition_laws.txt:13）—— 它在**形状上**正好能当这个门（「我在别人的关税同盟里当小弟」）。不拿它当门的理由**不是「原版没有这个词」，而是实测教训**：`ru_defeat` 曾经把判据挂在一个没实测过的门槛上（50），那一局（`ab-run3-done`）窗口一次都没开、法律全程没动 —— 一个没跑过 A/B 的新判据会把窗口**关死**，而关死是静默的（JE 就是不出现，没有任何报错）。而**真正想说清「站哪边」的那条**（`is_supporting_unification_candidate` / `is_in_customs_union_with`）在原版里一律带块或作用域操作数（common/on_actions/00_code_on_actions.txt:2487、common/ai_strategies/02_diplomatic_strategies.txt:1182），渲染不出来。所以本档案的门只开在沿用过的合法性上，关税同盟那条**留给下一次带 A/B 的校准**（**这是让步，不是结论**）。相应地 `complete` 写 75，开与关正好接上。　【沿用·口径】**数值沿用 `ru_defeat` 的实测档位，未针对本条处境独立校准**；另一条原版 75 是先例（有行号）。"

[[journal_entry.conditions]]
gate = "complete"
key = "legitimacy"
op = ">="
amount = 75
why = "关窗的门：国家重新站稳，窗口自己关上（不是「改革完成」—— 改什么、以及倒向谁，都由 AI 与原版牌池决定，本档案不替它选）。75 也是原版用过的档：common/journal_entries/00_meiji_restoration.txt:314 的 `legitimacy >= 75`。**为什么不用原版德意志问题自己的完成条件当关门**（比如「成为统一候选人」`is_unification_candidate`，common/journal_entries/00_german_unification.txt:213；或邦联问题解决 `schleswig_holstein_question_solved`，:206）：那是**原版目标的胜负**，本档案的窗口关的是**处境压力**；把它们绑在一起等于替原版内容做决定（§0「让 AI 自己推导」）。　【沿用·口径】沿用 `ru_defeat` 的取值，未针对本条处境独立校准。"

# ── ⑥ 本地化：窗口说明的文案 ─────────────────────────────────
# 键名与游戏里的约定一致：JE 标题 = JE 名、说明 = `<JE 名>_reason`（见原版
# localization/simp_chinese/ip3_misc_01_l_simp_chinese.yml 的 je_metternich /
# je_metternich_reason）；静态修正的键名 = 修正名本身（ip4_misc_01_l_simp_chinese.yml
# 的 modifier_regency_landowners）。两处都按原版口径，不自创后缀。

[[localization]]
key = "je_sitai_bv_alignment_window"
english = "Which Way to Lean: A Window to Choose"
simp_chinese = "倒向谁：选边的窗口"
why = "G3 要求试玩者能复述「当前目标 + 主因」。标题只写目标（选边）与来由（倒向谁），不写机制，也不写「改革」二字 —— 这一份的处境**不是内部改革**。与既有六份并列时，这个标题一眼能分出是另一种东西：一个打输了、一个被人撬开门、一个被两边夹着、一个钱不是自己的了，而**这一份是两个大国都来拉你**。"

[[localization]]
key = "je_sitai_bv_alignment_window_reason"
english = "Vienna and Berlin are both courting us, and both are paying the same price. We are already inside Prussia's customs union whether we like it or not, our court still keeps its warmth for Vienna, and the only tie we ever wrote down for ourselves is with Wurttemberg. A middle kingdom cannot stay in both camps forever: whoever we lean on will set our tariffs, carry our votes, and speak for us.\\n\\nA window is open: once the choice is on the books, the court's authority is spent on it, our own voice in Europe is no longer ours alone, and the landed interest that lives off protection loses its grip — while the men who live off the German market gain. It closes again once the state stands on its own feet."
simp_chinese = "维也纳与柏林都在拉我们，而且两边出的价一样。不管我们愿不愿意，人已经在普鲁士的关税同盟里了；朝廷对维也纳的那点热络也还在；而我们自己写下的唯一一条关系，是跟符腾堡。一个中等王国不可能永远待在两个阵营里：靠上哪一边，关税就由哪一边定、票就跟着哪一边投、话也就由哪一边替我们说。\\n\\n窗口已经打开：选边一旦记进账，朝廷的威信就花在这上头，我们在欧洲自己的声音也不再只属于自己，靠保护吃饭的地主一派会失势 —— 而靠德意志市场吃饭的那批人会抬头。等国家重新自己站住，这扇窗就会关上。"
why = "三行解释里的「最大压力与阻力」写在这里（P11 可观测）：压力 = **选边把外交主动权交了出去** + 王权为它花掉威信 + 靠关税保护吃饭的地主失势，阻力 = 「等国家重新自己站住」—— 与 `complete` 的 `legitimacy >= 75` 是同一条判据的两种说法，数值改了文案也要改（P9：改一处、三处同步）。文案里刻意**不出现**「战败」「革命」「破产」「被打穿」这些别份档案的词，也**不写「改革」**：本处境的因果起点是**两个大国都来拉你、而你只能挑一个**。第一句把三条实测读数翻成人话（普鲁士的关税同盟、维也纳的热络、对符腾堡那条线），因为「双重位置没法一直维持」正是本档案与六份既有档案的处境差别，玩家应当读得出来。"

[[localization]]
key = "sitai_bv_alignment_pressure"
english = "The Price of Choosing Sides"
simp_chinese = "选边的代价"
why = "静态修正的名字（键 = 修正名）。玩家在修正列表里看到的就是这一行，所以写「选边的代价」而不是机制名，也不写「影响力 -10% / 合法性 -35」。原版同族写法见 ip4_misc_01_l_simp_chinese.yml 的 modifier_regency_landowners；同族的原版修正名可参照 `working_with_the_great_powers`（与列强合作）这一族（都是「依附」的短名）。"

[[localization]]
key = "sitai_bv_reform_inputs"
english = "The German Market Gains Friends"
simp_chinese = "德意志市场那一派抬头"
why = "第二处修正同样要文案，否则它挂在国家上时在修正列表里是一行空名（闸门 ② 也会点名缺键）。⚠️ 这一条的文案**刻意不与前六份同键同文案**（它们都写「改革派抬头」）：本处境里抬头的不是抽象的「改革派」，是**靠德意志市场吃饭的那一派** —— 写清这一点，玩家才读得出它是选边的结果，而不是家里自己长出来的改革。原版同族写法见 ip4_misc_01_l_simp_chinese.yml 的 modifier_regency_landowners。"

# ── ⑦ 三行解释（P11 / G3）──────────────────────────────────
#
# 与 `eg_debt` / `pe_great_game` 同款：三行接进 JE 说明后才真的上屏，
# 所以 `[panel]` 与上面那条 `<JE 名>_reason` 必须**同时**存在（生成器会报错点名）。
# ⚠️ 三行的本地化键（`<JE 名>_goal` / `_pressure` / `_last_change`）由生成器**派生**，
# 不在这里手写 `[[localization]]` —— 写了就会与派生出来的那三条**重键**。
[panel]
why = "三行是 G3 的判据载体：目标 / 最大压力与阻力 / 上次改主意的原因。放同一张表是为了让「缺哪一行」当场可见（生成器要求三行齐全，缺一行即退 2）。"

[panel.goal]
english = "Current goal: while both great powers are still bidding for us, settle which one we can live under — and keep the kingdom while doing it."
simp_chinese = "当前目标：趁两边都还在出价，先弄清楚我们能活在谁家的秩序里 —— 同时把这个王国保住。"
why = "第一行 = **当前目标**。写「弄清楚能活在谁家的秩序里」而不是点名某条法律或某张牌：倒向哪一边由 AI 与原版牌池决定（§0「让 AI 自己推导」），本档案不替它选，也**递不出去**（见 `[cards]`）。写「把王国保住」是本处境的落点 —— 巴伐利亚不是要争德意志的领导权（那是普鲁士的 `ai_strategy_unify_germany`，common/ai_strategies/02_diplomatic_strategies.txt:1628），它要的是**别被碾过去**。"

[panel.pressure]
english = "Biggest pressure and resistance: pressure — our own voice in Europe is no longer ours alone, the court's authority is spent on the choice, and the landed interest that lives off protection loses its grip; resistance — the two great powers, and a kingdom that cannot afford to offend either of them."
simp_chinese = "最大压力与阻力：压力 = 我们在欧洲自己的声音不再只属于自己、朝廷的威信花在这个选择上、靠保护吃饭的地主一派失势；阻力 = 两个大国本身，以及一个哪个都得罪不起的王国。"
why = "第二行 = **最大压力与阻力**。压力项与 `[pressure.effects]` 的三条字段一一对应（外交影响力 / 合法性 / 地主），其中第一条是本档案与六份既有档案最硬的差别（别的档案压的是合法性、借债成本、守旧派，本档案压的是**你说话还算不算数**），所以必须在玩家看得见的那一行里说出来。阻力项刻意**不写成「等国家重新站稳」**（那是别的处境的说法）：本处境的阻力是**外面那两个大国** —— 这正是它与「战败 / 破产 / 被夹击」的根本区别。"

[panel.last_change]
english = "Why it changed its mind: because the choice of sides was written into the books — having to pick a patron, not a reform at home, is what moved the inputs the AI reads."
simp_chinese = "上次改主意的原因：因为倒向哪一边这件事被记进了账 —— 是「必须挑一个靠山」这件事挪动了 AI 读到的那些输入，不是家里自己长出来的改革。"
why = "第三行 = **上次改主意的原因**（G3 里最容易被跳过、却最关键的一行）。与六份既有档案的差别刻意写在这一行里：别的档案改主意的原因是「打输了 / 被撬开门 / 被夹住 / 钱不是自己的」，本档案是「**必须挑一个靠山**」。这一句同时是对玩家的诚实交代：本档案能记的是**选边的代价**，记不了「选了哪一边」（见文件头与 `[memory].why`）。"

# ── ⑧ 递牌：本档案一张都不递 ───────────────────────────────
[cards]
why = "**为什么是零张，而且这次的零张是两条判据性的理由叠在一起**（与 au/pe 的「查不到初始落点」不完全相同，必须说清）：① **查不到初始落点**（实测）：原版 `common/history/ai/00_strategy.txt` 里**没有 `c:BAV` 块** —— 该文件的具名块是 `c:AUS`（:62）、`c:PRU`（:82）、`c:RUS`（:87）、`c:TUR`（:92），没有巴伐利亚。ru_defeat 那套递牌写法（窗口开时递进步牌、窗口关时递回**该国 1836 年的初始牌**）在巴伐利亚这里**没有落点可引**，照抄俄国那三行等于把它递到一个它从没站过的路线上 —— 那不是「让 AI 自己推导」，是我们替它选（与 `au_revolution` / `pe_great_game` 同一条纪律）。② **就算查得到，递牌通道也递不出「倒向谁」**：schema 的 `[journal_entry.signals]` 白名单只有**四张政治议程牌**（`ai_strategy_progressive_agenda` / `reactionary_agenda` / `conservative_agenda` / `egalitarian_agenda`，tools/pdx/modgen.py:679-686；四张的 `type = political` 分别写在 common/ai_strategies/03_political_strategies.txt:377、:213、:4、:574，四个议程块的头在 :374、:170、:1、:571），而「倒向普鲁士 / 倒向奥地利」在原版里是**外交槽**的事（`ai_strategy_unify_germany`，`type = diplomatic`，common/ai_strategies/02_diplomatic_strategies.txt:1631）—— **同一份 schema 里没有任何一格能把落点拨到外交槽**。⚠️ 这不是「递牌不可能」，是**本 schema 的通道只通往政治槽**：真要表达「倒向谁」，要么占外交槽自建一张牌（`card_text` 支持任意 slot，tools/pdx/modgen.py:1370 渲染成 `type = <slot>`；代价按阶段 2 的等效竞争权重表：外交槽 S≈107、政治槽 S≈33），要么按 F5 的例外「整条路线要换」另开一档抽象（B22 说的正是这一类）。**本档案选择不递**，理由同样是判据性的：这一版要先拿到「只动世界状态（选边的代价）」的 A/B 读数（G-EXIT-5.2/5.3），在同一份档案里再叠一层牌就分不清是哪一层起的作用（`阶段5-批次1-结果.md` §二·补 的读数最需要保持干净的变量）。**一张都不递**比在通道本来就缺一格的地方硬塞一张诚实。"

