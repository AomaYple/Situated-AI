# ── ⑩ 探针口径（B80：本档案盯哪条法；**留空 = 没查实**）────────────
#
# 为什么要有这张表：探针的行为层②原来写死 `NOT = { has_law = law_type:law_serfdom }`，
# 而**对没有农奴制的国家它立刻为真** ⇒ 会报出一个假的「法律换了」（奥斯曼/埃及实测踩到）。
# 现在按档案声明：查实了就写，没查实就留空（留空时那条判据**不产出**）。
[probe]
why = "**查实了，但查法与四份既有档案不同，写清楚过程**：`common/history/countries/bav - bavaria.txt` 只有 19 行，逐行打开确认 —— :3 `effect_starting_technology_tier_2_tech = yes`、:4 `effect_starting_politics_conservative = yes`、:5 `activate_law = law_type:law_freedom_of_conscience`（这是该文件里**唯一**一条直接写的 `activate_law`，**不是**土地法）、:15-17 是地主的在朝设置。也就是说巴伐利亚的土地法**不在历史文件里直接写**，而是由 :4 调用的那个 scripted effect 定的：`effect_starting_politics_conservative` 定义在 common/scripted_effects/00_political_setup.txt:20（块头），其中 **:43 就是 `activate_law = law_type:law_tenant_farmers`** —— 巴伐利亚开局的土地法（佃农制）来自这里，后面没有任何一条把它覆盖掉。再核这条法属于哪一组：common/laws/01_land_reform.txt:140 是 `law_tenant_farmers = {`、:141 是 `group = lawgroup_land_reform`（同文件 :1 是 `law_serfdom`、:74 是 `law_manorialism`）—— 确实是土地改革那一组，与 `au_revolution` 的 `law_manorialism` 同一种「不是农奴制」的情况：**照抄俄国写 `law_serfdom` 会当场为真、报出假的「法律换了」**（B80 踩过）。　【牌口径 · B86】`reform_card` =「意图层动没动」看哪张牌（判据是它**出现过**）：本档案开局那张政治牌不是它（八份逐份核过 common/history/ai/00_strategy.txt —— AUS/EGY 是 conservative、RUS 是 reactionary、TUR/CHI/PER/SPA/BAV 没有块），所以它出现就是真的位移。"
reform_law = "law_tenant_farmers"
reform_card = "ai_strategy_progressive_agenda"
